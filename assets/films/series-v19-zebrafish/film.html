<h1 class="sr">A Heartbeat in High-Speed Frames: high-speed zebrafish microscopy</h1>

<script>"use strict";

const W=1280,H=720,FPS=24,DURATION=84,B=[0,14,28,42,56,70,84],PI=Math.PI,TAU=PI*2;
const P={ink:"#08151b",deep:"#10262c",dark:"#21383e",paper:"#e9eae2",ivory:"#f2f4ed",muted:"#a4b8b3",mint:"#8bceb7",aqua:"#76b3b6",red:"#d67f73",amber:"#e7ba86",blue:"#7185a3"};

const canvas=document.getElementById("screen"),view=canvas.getContext("2d",{alpha:false}),buf=[document.createElement("canvas"),document.createElement("canvas")];

const sin=Math.sin,cos=Math.cos,clamp=(q,a=0,b=1)=>Math.max(a,Math.min(b,q)),seg=(t,a,b)=>clamp((t-a)/(b-a)),ease=q=>{q=clamp(q);return q*q*(3-2*q)},out=q=>1-Math.pow(1-clamp(q),3),mix=(a,b,p)=>a+(b-a)*p;
function rect(d,x,y,w,h,c){d.fillStyle=c;d.fillRect(x,y,w,h)}
function line(d,points,c,w=2,a=1){d.save();d.globalAlpha=a;d.beginPath();d.moveTo(...points[0]);for(let i=1;i<points.length;i++)d.lineTo(...points[i]);d.strokeStyle=c;d.lineWidth=w;d.lineCap="round";d.lineJoin="round";d.stroke();d.restore()}
function dot(d,x,y,r,c,a=1){d.save();d.globalAlpha=a;d.beginPath();d.arc(x,y,Math.max(1,r),0,TAU);d.fillStyle=c;d.fill();d.restore()}
function ring(d,x,y,r,c,w=2,a=1){d.save();d.globalAlpha=a;d.beginPath();d.arc(x,y,Math.max(1,r),0,TAU);d.strokeStyle=c;d.lineWidth=w;d.stroke();d.restore()}
function box(d,x,y,w,h,c){d.fillStyle=c;d.beginPath();d.roundRect(x,y,w,h,11);d.fill()}
function text(d,s,x,y,z=20,c=P.ivory,font="sans",a=1,align="left"){d.save();d.globalAlpha=clamp(a);d.textAlign=align;d.textBaseline="alphabetic";d.font=z+"px "+(font==="serif"?"Georgia,serif":font==="mono"?"monospace":"Arial,sans-serif");d.fillStyle=c;d.fillText(s,x,y);d.restore()}
function title(d,s,x,y,z,t,at,c=P.ivory){let p=out(seg(t,at,at+.9));d.save();d.beginPath();d.rect(x-8,y-z*1.4,1150,(z+34)*p);d.clip();text(d,s,x,y+14*(1-p),z,c,"serif");d.restore()}
function background(d,t,light=false){rect(d,0,0,W,H,light?P.paper:P.ink);let g=d.createRadialGradient(light?315:945,310,30,light?315:945,310,830);g.addColorStop(0,light?"rgba(192,172,141,.15)":"rgba(98,168,155,.15)");g.addColorStop(1,"rgba(0,0,0,0)");rect(d,0,0,W,H,g);for(let j=0;j<8;j++){let x=100+j*162+8*sin(t*.14+j);line(d,[[x,67],[x-8,673]],light?P.blue:P.aqua,1,.1)}}

function beating(d,t,x,y,s=1){let q=sin(t*TAU*1.03),p=1-.095*(.5+.5*q);d.save();d.translate(x,y);d.rotate(.15*sin(t*.19));d.scale(s*p,s*(2-p));for(let a of [[-46,-41,47,38,-.22],[30,35,58,67,.3]]){d.beginPath();d.ellipse(a[0],a[1],a[2],a[3],a[4],0,TAU);d.fillStyle="rgba(111,185,166,.14)";d.fill();d.strokeStyle=P.mint;d.lineWidth=4;d.stroke();}line(d,[[-21,-16],[12,12]],P.amber,2,.62);d.restore()}
function vessel(d,t,x,y,w,h){const up=[],dn=[];for(let i=0;i<=100;i++){let q=i/100,mid=y+8*sin(q*TAU+t*.25),rad=h/2*(1+.12*sin(t*TAU*.8+q*TAU));up.push([x+q*w,mid-rad]);dn.push([x+q*w,mid+rad]);}d.save();d.beginPath();d.moveTo(...up[0]);for(let p of up.slice(1))d.lineTo(...p);for(let p of dn.reverse())d.lineTo(...p);d.closePath();d.fillStyle="rgba(100,190,180,.16)";d.fill();d.strokeStyle=P.aqua;d.lineWidth=3;d.stroke();d.clip();for(let k=0;k<35;k++){let q=(t*.18+(k*.61803399)%1)%1,yy=y+sin(k*2.1+t*.29)*h*.24;d.save();d.translate(x+q*w,yy);d.scale(1.3,.7);ring(d,0,0,6+(k%3),P.red,2.6,.65);d.restore();}d.restore()}
function photo(d,img,x,y,w,h,t,cap){let iw=img.naturalWidth,ih=img.naturalHeight;if(!iw)return;d.save();d.beginPath();d.roundRect(x,y,w,h,10);d.clip();let sc=Math.max(w/iw,h/ih)*1.04,rw=iw*sc,rh=ih*sc;d.drawImage(img,x+(w-rw)/2+8*sin(t*.2),y+(h-rh)/2+6*cos(t*.23),rw,rh);d.restore();text(d,cap,x,y+h+31,15,P.muted,"mono")}
function sourceFigure(d,x,y,w,h,t){let im=images[0],sc=Math.min(w/im.naturalWidth,h/im.naturalHeight);box(d,x-13,y-13,w+26,h+26,P.ivory);let ww=im.naturalWidth*sc,hh=im.naturalHeight*sc;d.drawImage(im,x+(w-ww)/2,y+(h-hh)/2,ww,hh);let p=(t*.07)%1;line(d,[[x+w*.08+p*w*.78,y+h+17],[x+w*.12+p*w*.78,y+h+17]],P.red,3,.8)}
function frameSeries(d,t,x,y,n){for(let k=0;k<n;k++){let px=x+k*148+7*sin(t*.12+k);box(d,px,y,128,140,P.deep);beating(d,t*.34+k*.17,px+64,y+73,.31);text(d,String(k+1).padStart(2,"0"),px+12,y+130,12,P.muted,"mono")}}
function waveform(d,t,x,y,w,h,discrete=false){let points=[];for(let i=0;i<=220;i++){let q=i/220;points.push([x+q*w,y-h*.42*sin(q*TAU*3.2-t*.35)])}line(d,points,P.mint,2.5,discrete?.24:.9);if(discrete)for(let i=0;i<18;i++){let q=i/17;dot(d,x+q*w,y-h*.42*sin(q*TAU*3.2-t*.35),5,P.red,.9)}}
function s0(d,t){background(d,t);title(d,"Life moves before",83,149,67,t,.25);title(d,"we can measure it.",83,232,67,t,1.6,P.amber);vessel(d,t,121,434,1030,113);beating(d,t,734,424,1.1);text(d,"CARDIAC MOTION  /  CIRCULATION",97,618,21,P.mint,"mono",out(seg(t,5,6)));text(d,"Interpretive geometry · not experimental footage",97,648,16,P.muted,"mono",out(seg(t,7,8)));hud(d,t,0)}
function s1(d,t){background(d,t);let l=t-14;title(d,"Record time, not just shape.",86,150,59,t,14.2);photo(d,images[1],92,213,333,308,t,"ARCHIVAL LARVA · NOT PAPER SOURCE VIDEO");frameSeries(d,t,460,311,5);for(let k=0;k<28;k++){let q=(t*.14+k/28)%1;dot(d,476+688*q,559+10*sin(q*TAU*2),2,P.amber,.3+.5*sin(PI*q))}text(d,"10 S HIGH-SPEED RECORDINGS",481,256,19,P.amber,"mono",out(seg(l,4,5)));text(d,"3 dpf representative embryos in the paper",484,628,17,P.muted,"mono",out(seg(l,6,7)));hud(d,t,1)}
function s2(d,t){background(d,t,true);let l=t-28;title(d,"From frames to function.",82,145,60,t,28.2,P.deep);sourceFigure(d,126,185,827,435,t);text(d,"PUBLISHED FIGURE",972,280,17,P.deep,"mono");text(d,"PCV / DA",972,322,20,P.red,"mono");text(d,"MICROZEBRALAB",972,361,16,P.deep,"mono");text(d,"IMAGEJ",972,391,16,P.deep,"mono");text(d,"No synthetic outputs",973,451,15,P.dark,"mono");text(d,"Original figure is displayed unaltered",91,650,16,P.deep,"mono",out(seg(l,6,7)));hud(d,t,2,true)}
function s3(d,t){background(d,t);let l=t-42;title(d,"A camera has a sampling limit.",84,145,57,t,42.25);text(d,"CONTINUOUS SIGNAL  ·  ILLUSTRATION",106,244,17,P.mint,"mono",out(seg(l,2,3)));waveform(d,t,140,344,961,95,false);line(d,[[140,381],[1110,381]],P.blue,1,.4);text(d,"SAMPLED FRAMES  ·  ILLUSTRATION",106,468,18,P.amber,"mono",out(seg(l,4,5)));waveform(d,t,140,567,961,93,true);let x=141+960*((t*.13)%1);line(d,[[x,258],[x,611]],P.amber,2,.42);text(d,"FRAME RATE / OPTICAL SCALE / ASSUMPTIONS",105,652,17,P.muted,"mono",out(seg(l,7,8)));hud(d,t,3)}
function s4(d,t){background(d,t);let l=t-56;title(d,"Flow and anatomy both change.",87,145,57,t,56.2);photo(d,images[2],99,223,344,307,t,"ARCHIVAL EMBRYO · CONTEXT ONLY");vessel(d,t,488,411,667,94);beating(d,t,827,401,.8);let x=501+639*((t*.12)%1);line(d,[[x,296],[x,532]],P.amber,2,.35);text(d,"MOVING CELLS · ILLUSTRATIVE, NOT TRACKED",470,566,17,P.mint,"mono");text(d,"Flow parameters depend on sampling and analysis.",486,624,18,P.muted,"serif",out(seg(l,7,8)));hud(d,t,4)}
function s5(d,t){background(d,t,true);let l=t-70;title(d,"Make the invisible measurable.",87,146,56,t,70.2,P.deep);sourceFigure(d,116,207,665,376,t);box(d,811,210,359,378,P.deep);beating(d,t,977,322,.43);const ls=["HEART RATE","FRACTIONAL SHORTENING","CARDIAC OUTPUT","BLOOD-FLOW ASSESSMENT"];for(let i=0;i<ls.length;i++){let y=421+i*39,p=out(seg(l,3+i*.7,4+i*.7));text(d,ls[i],844,y,16,i%2?P.amber:P.mint,"mono",p);dot(d,1141,y-8,4,P.red,p)}text(d,"FIGURE RETAINED IN FULL",121,642,15,P.deep,"mono");text(d,"METHOD ≠ CLINICAL DIAGNOSIS",822,638,15,P.deep,"mono",out(seg(l,8,9)));hud(d,t,5,true)}
const scenes=[s0,s1,s2,s3,s4,s5];
function draw(t){t=clamp(t,0,DURATION-1/FPS);let k=5;for(let j=0;j<6;j++)if(t>=B[j]&&t<B[j+1]){k=j;break}let tr=-1;for(let j=1;j<6;j++)if(t>=B[j]-.4&&t<B[j]+.4){tr=j;break}view.setTransform(1.5,0,0,1.5,0,0);if(tr<0){scenes[k](dc[0],t);view.drawImage(buf[0],0,0);return}scenes[tr-1](dc[0],t);scenes[tr](dc[1],t);let q=ease(seg(t,B[tr]-.4,B[tr]+.4));view.drawImage(buf[0],0,0);view.save();view.beginPath();if(tr%2)view.arc(610,357,Math.hypot(W,H)*q,0,TAU);else{let x=(W+140)*q-80;view.moveTo(0,0);view.lineTo(x,0);view.lineTo(x-100,H);view.lineTo(0,H);view.closePath()}view.clip();view.drawImage(buf[1],0,0);view.restore()}
