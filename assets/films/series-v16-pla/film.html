function rect(d,x,y,w,h,c){d.fillStyle=c;d.fillRect(x,y,w,h)}

function filmSurface(d,t,y=491,mode="untreated",x0=96,x1=1161){
 const active=mode==="plasma"||mode==="fa"||mode==="asa";
 rounded(d,x0,y,x1-x0,123,13,C.mid);
 const points=[];for(let x=x0;x<=x1;x+=9){let rough=active?5*sin(x*.09+t*.21)+2*sin(x*.31):1.5*sin(x*.07+t*.25);points.push([x,y+rough]);}

function droplet(d,cx,baseY,t,theta=70.2,scale=1){
 const width=lerp(76,125,(70.2-theta)/28)*scale,height=lerp(112,68,(70.2-theta)/28)*scale;
 const y=baseY-4;
 d.save();d.translate(cx,y);d.beginPath();d.moveTo(-width,0);

 d.closePath();let grad=d.createLinearGradient(0,-height,0,0);grad.addColorStop(0,"rgba(176,221,216,.82)");grad.addColorStop(1,"rgba(72,149,163,.49)");
 d.fillStyle=grad;d.fill();d.strokeStyle=C.mint;d.lineWidth=3;d.stroke();
 for(let k=0;k<5;k++){let x=-width*.62+k*width*.28+3*sin(t*.65+k),yy=-height*.40+5*cos(t*.5+k);dot(d,x,yy,2.2,C.white,.24)}
 d.restore();
}

 for(let i=0;i<n;i++){let q=(t*.087+(i*.61803398875)%1)%1,xx=x+q*w;
 let yy=y+90*sin((xx-x)/w*PI*2+i*.35);
 dot(d,xx,yy,1.3+(i%3)*.5,i%4?C.blue:C.orange,.2+.5*sin(PI*q));
 }
}

}

 d.save();d.translate(x+20,y);d.rotate(-angle*l);

 dot(d,xx,y+2+8*sin(q*5+t*.3),2.1,C.orange,.36+.42*sin(PI*q))}
}

function drawScene(d,i,t){d.save();scenes[i](d,t);d.restore()}
function draw(t){t=clamp(t,0,DURATION-1/FPS);let i=7;for(let j=0;j<8;j++)if(t>=B[j]&&t<B[j+1]){i=j;break;}
