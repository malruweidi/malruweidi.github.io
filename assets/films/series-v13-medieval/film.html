function syrup(d,t,x,y,w=540,h=190,visc=.48,heated=false){d.save();d.translate(x,y);
 rr(d,0,0,w,h,14,"#4d342b");rect(d,9,16,w-18,h-30,"#674431");let top=h*(.52-.28*visc);
 d.beginPath();d.moveTo(9,top);for(let xx=9;xx<w-9;xx+=14)d.lineTo(xx,top+4*sin(xx/47+t*.52));d.lineTo(w-9,h-14);d.lineTo(9,h-14);d.closePath();
 let g=d.createLinearGradient(0,top,w,h);g.addColorStop(0,"#b26c2e");g.addColorStop(.4,"#d59b4d");g.addColorStop(1,"#8c522e");d.fillStyle=g;d.fill();
 for(let i=0;i<(heated?18:8);i++){let q=(t*(heated?.16:.06)+i/19)%1;let px=30+(i*79)%(w-60);let py=top+(h-top)*q;stroke(d,px,py,1.5+2*(1-q),P.aged,1.5,.18+.6*(1-q))}

  if(k===2){for(let i=0;i<7;i++)dot(d,xx+24*cos(i+.3*t),yy+30*sin(i+.2*t),9,i%2?P.red:P.green,.75)}}
 for(let k=0;k<3;k++){let p=ease(seg(l,4+k*.8,8+k*.8));let x=x0[k],y=353;

function scene3(d,t){backdrop(d,t,false);let l=t-45;title(d,"The work of keeping.",89,145,58,t,45.35);

 txt(d,"Too little control",126,578,26,P.light,"serif",outEase(seg(l,4,5)));

function scene5(d,t){backdrop(d,t,false);let l=t-75;

function scene6(d,t){backdrop(d,t,true);let l=t-90;title(d,"When an ingredient was missing.",76,136,54,t,90.2,P.ink);

function paint(d,j,t){d.save();SCENES[j](d,t);d.restore();}
function draw(t){t=clamp(t,0,DURATION-1/FPS);let scene=7;
 for(let j=0;j<8;j++)if(t>=B[j]&&t<B[j+1]){scene=j;break}
 let transition=-1;for(let j=1;j<8;j++)if(t>=B[j]-.37&&t<B[j]+.37){transition=j;break}
 out.setTransform(1.5,0,0,1.5,0,0);
 if(transition<0){paint(dctx[0],scene,t);out.drawImage(buf[0],0,0);return;}
 paint(dctx[0],transition-1,t);paint(dctx[1],transition,t);let p=ease(seg(t,B[transition]-.37,B[transition]+.37));
 out.drawImage(buf[0],0,0);out.save();out.beginPath();
 if(transition===1||transition===7){out.arc(640,380,Math.hypot(W,H)*p,0,2*PI);}
 else{let x=(W+180)*p-90;out.moveTo(0,0);out.lineTo(x,0);out.lineTo(x-70,H);out.lineTo(0,H);out.closePath();}
 out.clip();out.drawImage(buf[1],0,0);out.restore();}
