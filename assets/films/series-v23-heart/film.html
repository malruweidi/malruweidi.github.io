<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Listening for a Failing Heart — Film 15</title><style>html,body{margin:0;background:#071620}canvas{width:100vw;height:100vh;object-fit:contain;display:block}.sr{position:absolute;left:-9999px}</style></head><body><h1 class="sr">Listening for a Failing Heart — conceptual sensor science documentary</h1><canvas id="c" width="1920" height="1080"></canvas><script>
"use strict";const cv=document.getElementById("c"),d=cv.getContext("2d",{alpha:false}),W=1920,H=1080,PI=Math.PI,T=PI*2,cols={bg:"#071620",deep:"#123141",panel:"#19394a",cream:"#f5f0e4",muted:"#a9c2c9",teal:"#87d6ca",coral:"#f4a89c",gold:"#f3cb8b",violet:"#bca5dc",blue:"#7eb5e8"};const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));const ease=x=>{x=clamp(x);return x*x*(3-2*x)};function text(s,x,y,z=32,color=cols.cream,font="sans-serif",align="left"){d.fillStyle=color;d.font=z+"px "+font;d.textAlign=align;d.fillText(s,x,y)}function line(points,c=cols.teal,w=3,a=1){d.save();d.globalAlpha=a;d.beginPath();d.moveTo(...points[0]);for(let i=1;i<points.length;i++)d.lineTo(...points[i]);d.strokeStyle=c;d.lineWidth=w;d.lineCap="round";d.stroke();d.restore()}function circle(x,y,r,c=cols.teal,a=1){d.save();d.globalAlpha=a;d.beginPath();d.arc(x,y,Math.max(.1,r),0,T);d.fillStyle=c;d.fill();d.restore()}function ring(x,y,r,c=cols.teal,a=1,w=2){d.save();d.globalAlpha=a;d.beginPath();d.arc(x,y,r,0,T);d.strokeStyle=c;d.lineWidth=w;d.stroke();d.restore()}function rect(x,y,w,h,c){d.fillStyle=c;d.fillRect(x,y,w,h)}function panel(x,y,w,h){d.fillStyle=cols.panel;d.beginPath();d.roundRect(x,y,w,h,22);d.fill()}function waveform(x,y,w,h,t,kind=0,c=cols.teal){let pts=[];for(let i=0;i<=240;i++){let p=i/240,q=(p*4.5-t*.42)%1;if(q<0)q++;let f=kind===0?(Math.exp(-Math.pow((q-.18)/.016,2))*.94-Math.exp(-Math.pow((q-.12)/.028,2))*.18+Math.exp(-Math.pow((q-.53)/.14,2))*.22):kind===1?Math.sin(T*(p*2.4-t*.22))*.55+Math.sin(T*(p*4.8-t*.22))*.12:Math.sin(T*(p*1.8-t*.17))*.4;pts.push([x+p*w,y-h*f]);}line(pts,c,4,.95);for(let j=0;j<5;j++)circle(x+((t*.12+j*.2)%1)*w,y-h*.15,3,c,.3)}function heart(x,y,t,s=1){d.save();d.translate(x,y);d.scale(s,s);let pulse=1+.045*Math.sin(T*t*1.13);d.scale(pulse,pulse);d.beginPath();d.moveTo(0,112);d.bezierCurveTo(-205,-15,-150,-153,-55,-103);d.bezierCurveTo(-20,-85,-4,-45,0,-34);d.bezierCurveTo(20,-100,87,-151,146,-98);d.bezierCurveTo(246,-4,112,101,0,112);d.fillStyle=cols.coral;d.fill();d.lineWidth=7;d.strokeStyle="#ffccbb";d.stroke();for(let i=0;i<7;i++){let a=i*T/7+t*.6;circle(42*Math.cos(a),22*Math.sin(a),6,cols.gold,.65)}d.restore()}function particles(t,x,y,w,h,c){for(let i=0;i<42;i++){let p=(i*.618034+t*.07)%1,q=(i*.414214+t*.02)%1;circle(x+w*p,y+h*q,1.5+(i%3),c,.16+.25*Math.sin(i+t*.4)**2)}}function top(t,n,title){rect(0,0,W,H,cols.bg);let g=d.createRadialGradient(1060,480,80,1060,480,1050);g.addColorStop(0,"#153743");g.addColorStop(1,cols.bg);rect(0,0,W,H,g);particles(t,0,80,W,840,cols.teal);text("RUWAIDIX   /   CARDIOVASCULAR RESEARCH CINEMA",90,68,19,cols.muted,"monospace");text("FILM 15  /  SENSOR TECHNOLOGIES",1830,68,19,cols.muted,"monospace","right");line([[90,88],[1830,88]],cols.muted,1,.4);text(title,100,178,63,cols.cream,"Georgia");line([[90,1005],[1830,1005]],cols.muted,2,.3);line([[90,1005],[90+1740*t/84,1005]],cols.gold,5);text("0"+n+" / 06",100,974,22,cols.muted,"monospace");text("ILLUSTRATIVE PHYSIOLOGY — NOT PATIENT DATA",1825,974,19,cols.muted,"monospace","right")}
function scene0(t){top(t,1,"Can the heart warn us early?");heart(560,552,t,1.25);for(let k=0;k<4;k++)ring(560,552,230+k*60+15*Math.sin(t*.7-k),cols.coral,.08+.12*k/4,3);panel(995,285,745,500);text("RHYTHM",1040,350,26,cols.gold,"monospace");waveform(1035,450,650,120,t,0);text("MECHANICS",1040,570,26,cols.teal,"monospace");waveform(1035,675,650,110,t,1,cols.coral);text("A signal is not a diagnosis.",1050,850,31,cols.cream,"Georgia")}
function scene1(t){top(t,2,"Signals outside the operating room");let cards=[["ECG / RHYTHM",cols.gold,0],["PPG / LIGHT",cols.teal,1],["BIOIMPEDANCE",cols.coral,2],["ACTIVITY / MASS",cols.violet,3]];for(let k=0;k<4;k++){let x=100+(k%2)*875,y=255+Math.floor(k/2)*332;panel(x,y,830,294);text(cards[k][0],x+43,y+60,29,cards[k][1],"monospace");if(k<3)waveform(x+47,y+208,720,90,t+k,k===0?0:k===1?1:2,cards[k][1]);else{for(let j=0;j<24;j++){let xx=x+55+j*30;rect(xx,y+231-70*(.3+.65*Math.sin(j*.39+t*.28)**2),13,70*(.3+.65*Math.sin(j*.39+t*.28)**2),cols.violet)}}}text("DIFFERENT MEASUREMENTS  /  DIFFERENT CLINICAL LIMITS",140,920,28,cols.muted,"monospace")}
function scene2(t){top(t,3,"From measurement to prediction");let names=["PRESSURE SENSOR","LUNG ULTRASOUND","DOPPLER FLOW"];for(let k=0;k<3;k++){let x=110+k*575;panel(x,286,545,560);text(names[k],x+31,356,25,k===0?cols.gold:k===1?cols.teal:cols.violet,"monospace");if(k===0){ring(x+275,545,128,cols.gold,.65,5);for(let j=0;j<9;j++){let a=j*T/9+t*.45;circle(x+275+128*Math.cos(a),545+128*Math.sin(a),7,cols.gold,.5)}waveform(x+50,750,450,80,t,1,cols.gold)}if(k===1){for(let j=0;j<17;j++){let yy=445+j*13;line([[x+45,yy],[x+495,yy+8*Math.sin(t*.5+j*.33)]],cols.teal,1,.2+.25*Math.sin(j*.3+t)**2)}for(let j=0;j<5;j++)ring(x+275,595,j*38+30,cols.teal,.1+.06*j,3)}if(k===2){for(let j=0;j<46;j++){let px=x+50+(j*39+t*40)%440,py=470+j%9*26+10*Math.sin(t*.4+j);circle(px,py,4,cols.violet,.5)}waveform(x+50,750,450,80,t,2,cols.violet)}}}
function scene3(t){top(t,4,"A signal can mislead");panel(105,295,1705,500);text("CLEAN PHYSIOLOGY",150,355,25,cols.teal,"monospace");waveform(170,480,1500,125,t,0);text("MOTION + SENSOR ARTIFACT",150,620,25,cols.coral,"monospace");let pts=[];for(let i=0;i<=280;i++){let p=i/280,q=(p*4.5-t*.42)%1;if(q<0)q++;let clean=Math.exp(-((q-.18)/.016)**2)*.9;let artifact=.24*Math.sin(27*p+t*3)+.13*Math.sin(77*p+t*2);pts.push([170+p*1500,740-125*(clean+artifact)])}line(pts,cols.coral,4,.9);text("Timing, noise and individual variation change interpretation.",180,887,30,cols.cream,"Georgia")}
function scene4(t){top(t,5,"The validation question");let nodes=[["SENSOR",210,440,cols.teal],["SIGNAL",570,440,cols.gold],["MODEL",940,440,cols.violet],["CLINICAL USE",1370,440,cols.coral]];for(let k=0;k<3;k++){let a=nodes[k],b=nodes[k+1];line([[a[1]+135,480],[b[1]-20,480]],cols.muted,3,.6);let p=(t*.2+k*.32)%1;circle(a[1]+135+p*(b[1]-a[1]-155),480,7,cols.gold,.9)}for(let n of nodes){panel(n[1]-45,n[2]-70,285,145);text(n[0],n[1]+95,n[2]+16,25,n[3],"monospace","center")}text("External testing   •   representative populations   •   actionable decisions",190,730,34,cols.cream,"Georgia");text("A better trace does not guarantee a better outcome.",210,825,30,cols.muted,"Georgia")}
function scene5(t){top(t,6,"A technology belongs to its use");heart(485,555,t,1.12);panel(875,275,865,545);text("WILEY  /  2022",928,350,27,cols.gold,"monospace");text("Minimally Invasive and Non-Invasive",928,431,35,cols.cream,"Georgia");text("Sensor Technologies for Predicting",928,485,35,cols.cream,"Georgia");text("Heart Failure: An Overview",928,539,35,cols.cream,"Georgia");line([[925,584],[1650,584]],cols.muted,2,.4);text("Salman · Al-Ruweidi · Ouakad · Yalcin",928,636,27,cols.teal,"Georgia");text("DOI 10.1002/9781119813040.ch5",928,707,25,cols.muted,"monospace");text("A 2022 review — not a clinical decision tool",928,763,23,cols.coral,"monospace")}
const scenes=[scene0,scene1,scene2,scene3,scene4,scene5];function draw(t){t=clamp(t,0,83.999);d.setTransform(1,0,0,1,0,0);scenes[Math.min(5,Math.floor(t/14))](t)}window.__draw=draw;window.__meta={W,H,FPS:24,DURATION:84,doi:"10.1002/9781119813040.ch5"};window.__ready=true;draw(0);
</script></body></html>
