const scenes=[scene0,scene1,scene2,scene3,scene4,scene5];
function draw(t){t=clamp(t,0,DURATION-1/FPS);let current=5;for(let j=0;j<6;j++)if(t>=B[j]&&t<B[j+1]){current=j;break;}
let transition=-1;for(let i=1;i<6;i++)if(t>=B[i]-.39&&t<B[i]+.39){transition=i;break;}
v.setTransform(1.5,0,0,1.5,0,0);
if(transition<0){scenes[current](d[0],t);v.drawImage(back[0],0,0);return}
scenes[transition-1](d[0],t);scenes[transition](d[1],t);
const p=ease(seg(t,B[transition]-.39,B[transition]+.39));
v.drawImage(back[0],0,0);v.save();v.beginPath();if(transition%2){v.arc(634,375,Math.hypot(W,H)*p,0,TAU)}
else{const x=(W+110)*p-65;v.moveTo(0,0);v.lineTo(x,0);v.lineTo(x-86,H);v.lineTo(0,H);v.closePath();}
v.clip();v.drawImage(back[1],0,0);v.restore();}
