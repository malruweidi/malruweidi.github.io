<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Symptoms do not identify a mechanism conceptual scientific illustration"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112e36"/><stop offset="1" stop-color="#091f27"/></linearGradient><filter id="halo"><feGaussianBlur stdDeviation="26"/></filter></defs><rect width="1280" height="720" fill="url(#bg)"/><line x1="62" y1="116" x2="1218" y2="116" stroke="#56766e" stroke-width="2"/><text x="64" y="59" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" font-weight="700" fill="#a3cabb">RUWAIDIX  /  SCIENTIFIC VISUAL NOTEBOOK</text><text x="64" y="100" font-family="Georgia,serif" font-size="39" fill="#f4efdd">Symptoms do not identify a mechanism</text><text x="64" y="145" font-family="Arial,sans-serif" font-size="17" fill="#dfac85">GASTROINTESTINAL DIAGNOSTIC REASONING</text><rect x="74" y="245" width="258" height="121" rx="19" fill="#1f4047" stroke="#61918c" stroke-width="2"/><text x="97" y="285" font-family="Arial" font-weight="700" font-size="21" fill="#f7ecdd">Clinical symptoms</text><text x="97" y="317" font-family="Arial" font-size="16" fill="#a9cfc4">Pain, nausea and others</text><rect x="490" y="245" width="290" height="121" rx="19" fill="#1f4047" stroke="#61918c" stroke-width="2"/><text x="513" y="285" font-family="Arial" font-weight="700" font-size="21" fill="#f7ecdd">Tissue findings</text><text x="513" y="317" font-family="Arial" font-size="16" fill="#a9cfc4">Anatomy and histology</text><rect x="930" y="245" width="260" height="121" rx="19" fill="#1f4047" stroke="#61918c" stroke-width="2"/><text x="953" y="285" font-family="Arial" font-weight="700" font-size="21" fill="#f7ecdd">Differentials</text><text x="953" y="317" font-family="Arial" font-size="16" fill="#a9cfc4">Other possible causes</text><path d="M 343 306 L 474 306" stroke="#d7a47f" stroke-width="4" fill="none" marker-end="url(#arw)"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#d7a47f"/></marker></defs><path d="M 792 306 L 915 306" stroke="#d7a47f" stroke-width="4" fill="none" marker-end="url(#arw)"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#d7a47f"/></marker></defs><rect x="339" y="457" width="608" height="104" rx="19" fill="#1f4047" stroke="#61918c" stroke-width="2"/><text x="362" y="497" font-family="Arial" font-weight="700" font-size="21" fill="#f7ecdd">Diagnosis integrates independent observations</text><text x="362" y="529" font-family="Arial" font-size="16" fill="#a9cfc4">One image or one symptom cannot establish a disease</text><rect x="50" y="645" width="1180" height="45" rx="8" fill="#28444b" fill-opacity=".9"/><text x="68" y="673" font-family="Arial,sans-serif" font-size="14" fill="#c5d4ca">Conceptual diagnostic pathway; not individual clinical test results.</text><text x="1090" y="673" font-family="Arial,sans-serif" font-size="12" fill="#f3c6a4">SCHEMATIC ONLY</text></svg>
