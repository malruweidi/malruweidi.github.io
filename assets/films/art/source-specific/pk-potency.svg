<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Potency is not target-site exposure conceptual scientific illustration"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112e36"/><stop offset="1" stop-color="#091f27"/></linearGradient><filter id="halo"><feGaussianBlur stdDeviation="26"/></filter></defs><rect width="1280" height="720" fill="url(#bg)"/><line x1="62" y1="116" x2="1218" y2="116" stroke="#56766e" stroke-width="2"/><text x="64" y="59" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" font-weight="700" fill="#a3cabb">RUWAIDIX  /  SCIENTIFIC VISUAL NOTEBOOK</text><text x="64" y="100" font-family="Georgia,serif" font-size="39" fill="#f4efdd">Potency is not target-site exposure</text><text x="64" y="145" font-family="Arial,sans-serif" font-size="17" fill="#dfac85">FREE CONCENTRATION  /  PHARMACOKINETICS</text><rect x="66" y="222" width="334" height="133" rx="19" fill="#1f4047" stroke="#61918c" stroke-width="2"/><text x="89" y="262" font-family="Arial" font-weight="700" font-size="21" fill="#f7ecdd">In-vitro potency</text><text x="89" y="294" font-family="Arial" font-size="16" fill="#a9cfc4">Apparent activity in an assay</text><rect x="473" y="222" width="330" height="133" rx="19" fill="#1f4047" stroke="#61918c" stroke-width="2"/><text x="496" y="262" font-family="Arial" font-weight="700" font-size="21" fill="#f7ecdd">Systemic exposure</text><text x="496" y="294" font-family="Arial" font-size="16" fill="#a9cfc4">Disposition and protein binding</text><rect x="877" y="222" width="327" height="133" rx="19" fill="#1f4047" stroke="#61918c" stroke-width="2"/><text x="900" y="262" font-family="Arial" font-weight="700" font-size="21" fill="#f7ecdd">Effect-site exposure</text><text x="900" y="294" font-family="Arial" font-size="16" fill="#a9cfc4">Unbound drug at target</text><path d="M 401 297 L 470 297" stroke="#d7a47f" stroke-width="4" fill="none" marker-end="url(#arw)"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#d7a47f"/></marker></defs><path d="M 804 297 L 873 297" stroke="#d7a47f" stroke-width="4" fill="none" marker-end="url(#arw)"/><defs><marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#d7a47f"/></marker></defs><rect x="100" y="440" width="1090" height="109" rx="18" stroke="#d3ad81" stroke-width="2" fill="#24454b"/><text x="134" y="482" font-family="Arial" font-size="22" fill="#f6eddb">Compare assay potency against achievable free concentration</text><text x="134" y="519" font-family="Arial" font-size="18" fill="#bfd4c9">Requires measured pharmacokinetics and target access, not a nominal IC₅₀ alone.</text><rect x="50" y="645" width="1180" height="45" rx="8" fill="#28444b" fill-opacity=".9"/><text x="68" y="673" font-family="Arial,sans-serif" font-size="14" fill="#c5d4ca">No concentration–time curve, dose, or patient exposure has been fabricated.</text><text x="1090" y="673" font-family="Arial,sans-serif" font-size="12" fill="#f3c6a4">SCHEMATIC ONLY</text></svg>
