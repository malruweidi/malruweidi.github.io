<html lang="en"><head><meta charset="utf-8"><title>Film 13 — What Happens When Immunity Turns on the Gut?</title>
<style>

<h1 class="sr">What Happens When Immunity Turns on the Gut? A documentary animation based on a 2022 research book chapter.</h1>
<canvas id="screen" width="1280" height="720" role="img" aria-label="A six-chapter continuously moving explanatory research film about gut epithelium, immune tolerance, immune-mediated disease classifications, disease-specific diagnosis and the limitations of mechanistic inference."></canvas>
<script>
"use strict";
/* Reconstructive scientific animation, never histology, patient imaging or original assay data. */
const W=1280,H=720,FPS=24,DURATION=84,TWO=Math.PI*2;
const C={bg:"#101b23",deep:"#0b141b",sea:"#143039",muted:"#8da8aa",paper:"#f0ebdf",white:"#fff7e9",teal:"#7dc5ba",cyan:"#72adb4",amber:"#ebbc7d",clay:"#d58574",pink:"#dda1a0",olive:"#abb887",blue:"#8f9ed0",grid:"#2d4751"};
const canvas=document.getElementById("screen"),ctx=canvas.getContext("2d",{alpha:false});
const a=document.createElement("canvas"),b=document.createElement("canvas");a.width=b.width=W;a.height=b.height=H;
const ax=a.getContext("2d"),bx=b.getContext("2d");
const sin=Math.sin,cos=Math.cos,abs=Math.abs,PI=Math.PI;
const clamp=(v,lo=0,hi=1)=>Math.max(lo,Math.min(hi,v));
const ease=v=>{v=clamp(v);return v*v*(3-2*v)};
const pulse=(t,w=1)=>.5+.5*sin(t*w);
const lerp=(a,b,p)=>a+(b-a)*p;
const phase=(t,k)=>((t*.07+k*.618033988749)%1+1)%1;
function box(g,x,y,w,h,col,r=0){g.fillStyle=col;if(r){g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}else{g.fillRect(x,y,w,h)}}
function line(g,points,col,width=2,alpha=1){g.save();g.globalAlpha=clamp(alpha);g.beginPath();g.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)g.lineTo(points[i][0],points[i][1]);g.lineCap="round";g.lineJoin="round";g.lineWidth=width;g.strokeStyle=col;g.stroke();g.restore()}
function circ(g,x,y,r,col,alpha=1){g.save();g.globalAlpha=clamp(alpha);g.fillStyle=col;g.beginPath();g.arc(x,y,Math.max(.01,r),0,TWO);g.fill();g.restore()}
function ring(g,x,y,r,col,width=2,alpha=1){g.save();g.globalAlpha=clamp(alpha);g.strokeStyle=col;g.lineWidth=width;g.beginPath();g.arc(x,y,Math.max(.01,r),0,TWO);g.stroke();g.restore()}
function words(g,s,x,y,size=22,col=C.paper,face="sans",align="left",alpha=1){g.save();g.globalAlpha=clamp(alpha);g.textAlign=align;g.textBaseline="alphabetic";g.fillStyle=col;g.font=(face==="serif"?"400 ": "500 ")+size+"px "+(face==="serif"?"Georgia,serif":face==="mono"?"monospace":"Arial,sans-serif");g.fillText(s,x,y);g.restore()}
function caption(g,heading,sub,t,scene){
 words(g,heading,76,139,43,C.white,"serif",1);
 words(g,sub,78,178,16,C.muted,"mono",1);
}
function smalltag(g,s,x,y,color=C.teal){words(g,s,x,y,15,color,"mono")}
function orb(g,x,y,r,t,color,segments=7){
 g.save();g.translate(x,y);g.rotate(t*.12);const pts=[];
 for(let i=0;i<segments;i++){let q=TWO*i/segments;pts.push([r*cos(q)*(1+.09*sin(t*.6+i*5)),r*sin(q)*(1+.08*cos(t*.4+i*3))]);}
 g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<segments;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fillStyle=color+"30";g.fill();g.strokeStyle=color;g.lineWidth=2.4;g.stroke();circ(g,0,0,r*.18,C.amber,.75);g.restore();
}
function microbiota(g,t,x,y,w,h,n=46){
 for(let i=0;i<n;i++){let p=phase(t,i),xx=x+p*w,yy=y+h*((i*.2971)%1)+12*sin(t*.55+i*2),c=i%5===0?C.amber:i%3===0?C.olive:C.teal;
 g.save();g.translate(xx,yy);g.rotate((i%2?-1:1)*t*.31);box(g,-(4+i%3),-2,8+i%5,4,c,4);if(i%4===0)line(g,[[-8,0],[-13,6]],c,1,.5);g.restore();
 }}
function section(g,t,x,y,w,h,flare=0){
 g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
 let gr=g.createLinearGradient(x,y,x,y+h);gr.addColorStop(0,"#304e4a");gr.addColorStop(.45,"#52766e");gr.addColorStop(.46,"#354f56");gr.addColorStop(1,"#192f3b");box(g,x,y,w,h,gr);
 const count=Math.floor(w/38);
 for(let k=0;k<count;k++){
 let px=x+10+(k+.5)*w/count,py=y+h*.44,top=y+27+8*sin(k*.4+t*.7);
 line(g,[[px-15,py],[px-11,py-41],[px-9,top+12],[px-3,top],[px+3,top+12],[px+10,py-41],[px+15,py]],flare?C.clay:C.teal,5,.85);
 for(let j=0;j<3;j++)circ(g,px-5+j*5,py-38-16*j/3,2.1,C.amber,.25+.2*pulse(t+k));
 }
 for(let k=0;k<22;k++){let xx=x+20+(k*83)%Math.max(50,w-40),yy=y+h*.62+(k*47)%(h*.25);circ(g,xx,yy,4+k%4,k%4===0?C.clay:C.cyan,.26+.16*pulse(t+k));}
 line(g,[[x,y+h*.46],[x+w,y+h*.46]],C.paper,2,.3);
 if(flare){for(let k=0;k<11;k++){let xx=x+18+k*w/11,yy=y+h*.46+21*sin(t*.8+k);ring(g,xx,yy,9+4*pulse(t+k),C.clay,2,.4);}}
 g.restore();
}
function immuneCell(g,x,y,r,t,c=C.clay){
 g.save();g.translate(x,y);const wob=1+.065*sin(t*2);g.scale(wob,1/wob);
 g.beginPath();for(let k=0;k<=12;k++){let q=TWO*k/12,rad=r*(1+.13*sin(k*3.8+t*.8));let xx=rad*cos(q),yy=rad*sin(q);if(!k)g.moveTo(xx,yy);else g.lineTo(xx,yy);}g.closePath();g.fillStyle=c+"33";g.fill();g.strokeStyle=c;g.lineWidth=2.5;g.stroke();
 orb(g,0,0,r*.42,t+3,C.blue,5);g.restore();
}
function base(g,t,id){
 let grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,C.deep);grad.addColorStop(1,id===3?"#25333e":C.sea);box(g,0,0,W,H,grad);
 for(let k=0;k<18;k++){let y=77+k*34+3*sin(t*.1+k),x=42+4*sin(t*.17+k);line(g,[[x,y],[1250,y-13]],C.grid,1,.12);}
 for(let k=0;k<25;k++){let x=72+k*49+8*sin(t*.13+k),y=91+11*cos(t*.09+k);circ(g,x,y,1.5,C.paper,.07);}
 words(g,"R U W A I D I X    /    RESEARCH CINEMA",72,44,13,C.muted,"mono");
 words(g,"FILM 13 / GI IMMUNOLOGY",1209,44,13,C.muted,"mono","right");
 line(g,[[72,59],[1208,59]],C.muted,1,.33);line(g,[[72,681],[1208,681]],C.muted,1,.28);
 box(g,72,680,1136*clamp(t/84),3,C.amber);
 words(g,String(id+1).padStart(2,"0")+" / 06",76,658,15,C.muted,"mono");
 words(g,"CONCEPTUAL ANIMATION  /  NOT PATIENT MATERIAL",1206,659,13,C.muted,"mono","right");
}
function scene0(g,t){
 base(g,t,0);caption(g,"What happens when immunity turns on the gut?","A living interface, not an empty tube",t,0);
 section(g,t,90,270,1100,285,0);
 microbiota(g,t,108,204,1050,56,70);
 for(let i=0;i<12;i++){const x=120+i*90+7*sin(t*.33+i),y=580+11*sin(i*2.4+t*.5);immuneCell(g,x,y,15+i%3*2,t+i,i%4===0?C.amber:C.teal);}
 for(let k=0;k<8;k++){let y=264-50+k*14;line(g,[[110,y],[1160,y+2*sin(t*.5+k)]],C.teal,1,.06);}
 smalltag(g,"LUMEN / MICROBIAL SIGNALS",110,228,C.amber);
 smalltag(g,"EPITHELIAL BARRIER",110,518,C.paper);
 smalltag(g,"MUCOSAL IMMUNE COMPARTMENT",110,616,C.cyan);
 words(g,"Gut architecture is drawn schematically; not a histology specimen.",110,639,17,C.muted,"serif");
}
function scene1(g,t){
 base(g,t,1);caption(g,"A boundary designed for tolerance","Microbes, diet, recognition and restraint",t,1);
 section(g,t,79,262,824,312,.15);
 microbiota(g,t,95,203,790,67,49);
 let drift=t-14;
 for(let k=0;k<16;k++){let p=phase(t,k),xx=145+(k*48)%710,yy=248+180*p;circ(g,xx,yy,3.3,k%3===0?C.amber:C.teal,.36+.4*sin(p*PI));}
 for(let k=0;k<8;k++){let x=145+k*99+22*sin(t*.19+k),y=600+6*cos(t*.55+k);immuneCell(g,x,y,17,t+k,k%3?C.cyan:C.olive);}
 box(g,953,235,246,290,"#182a36",17);smalltag(g,"THE QUESTION",982,282,C.amber);
 words(g,"How much",978,328,28,C.paper,"serif");
 words(g,"response is",978,365,28,C.paper,"serif");
 words(g,"enough?",978,402,28,C.paper,"serif");
 ring(g,1077,495,47,C.teal,2,.6);ring(g,1077,495,35+8*sin(t*.8),C.amber,2,.55);
 smalltag(g,"PROTECT",1039,498,C.teal);
 words(g,"Recognition is not automatically disease.",95,650,20,C.paper,"serif");
}
function scene2(g,t){
 base(g,t,2);caption(g,"Inflammation has more than one logic","Innate and adaptive pathways may interact",t,2);
 const lx=340,rx=935,yy=377;ring(g,lx,yy,146,C.olive,3,.63);ring(g,rx,yy,146,C.blue,3,.67);
 for(let j=0;j<23;j++){
  let q=j*TWO/23+(t-28)*.1,r=143;circ(g,lx+r*cos(q),yy+r*sin(q),j%3?3:5,C.olive,.7);
  circ(g,rx+r*cos(-q),yy+r*sin(-q),j%3?3:5,C.blue,.7);
 }
 immuneCell(g,lx,yy,58,t,C.olive);immuneCell(g,rx,yy,58,t+4,C.blue);
 words(g,"INNATE",lx,565,30,C.olive,"mono","center");
 words(g,"ADAPTIVE",rx,565,30,C.blue,"mono","center");
 for(let k=0;k<11;k++){
   let p=phase(t,k),xx=lerp(lx+160,rx-160,p),y=yy+22*sin(p*TWO+t+k);circ(g,xx,y,4+(k%3),k%2?C.olive:C.blue,.2+.68*sin(p*PI));
 }
 line(g,[[lx+145,yy],[rx-145,yy]],C.amber,2,.66);
 words(g,"INTERACTING IMMUNE PATHWAYS",645,333,19,C.paper,"mono","center");
 box(g,221,607,833,38,"#2d3840",9);
 words(g,"Autoinflammation and autoimmunity describe mechanisms, not interchangeable labels.",637,633,18,C.paper,"serif","center");
}
function scene3(g,t){
 base(g,t,3);caption(g,"Five conditions. Different mechanisms.","A chapter's historical grouping is not one immunological diagnosis",t,3);
 const d=[
 ["COELIAC DISEASE","Gluten-linked, adaptive and autoimmune",C.amber],
 ["AUTOIMMUNE GASTRITIS","Immune injury to gastric parietal cells",C.olive],
 ["EOSINOPHILIC OESOPHAGITIS","Type 2 immune-mediated, not classical autoimmune",C.clay],
 ["INFLAMMATORY BOWEL DISEASE","Chronic immune-mediated intestinal inflammation",C.cyan],
 ["ACHALASIA","Motility disorder; immune roles differ by case",C.blue]
 ];
 d.forEach((x,i)=>{
  let y=222+i*84,dx=10*sin(t*.19+i),p=ease((t-42-i*.43)/.6);
  box(g,105+dx,y,1060,70,i%2?"#253741":"#1b3039",11);
  box(g,105+dx,y,7,70,x[2],3);
  ring(g,146+dx,y+35,14+2*sin(t*.7+i),x[2],3,.8);
  words(g,x[0],190+dx,y+29,23,C.white,"mono", "left",p);
  words(g,x[1],190+dx,y+53,18,C.muted,"sans","left",p);
  for(let k=0;k<5;k++)circ(g,1015+k*29+dx,y+34+10*sin(t*.65+k+i),4,x[2],.35);
 });
 words(g,"Diagnostic categories are not interchangeable with immune pathways.",108,669,16,C.paper,"serif");
}
function scene4(g,t){
 base(g,t,4);caption(g,"The diagnostic question is a synthesis","A mechanism alone cannot establish the disease",t,4);
 const names=[["CLINICAL","Symptoms and history"],["TISSUE","Histological patterns"],["CRITERIA","Disease-specific tests"]];
 names.forEach((q,j)=>{
 let x=91+j*380,y=220;box(g,x,y,337,344,j===1?"#233d43":"#1e333c",17);
 smalltag(g,"0"+(j+1)+" / "+q[0],x+23,y+35,[C.amber,C.teal,C.blue][j]);
 words(g,q[1],x+24,y+69,20,C.paper,"serif");
 if(j===0){
  for(let k=0;k<6;k++){let yy=y+117+k*30,w=244-(k%3)*36;line(g,[[x+28,yy],[x+28+w,yy]],C.muted,3,.28)}
  for(let k=0;k<7;k++)circ(g,x+38+k*38,y+290+14*sin(t*.85+k),5,C.amber,.33+.23*pulse(t+k));
 }else if(j===1){
  section(g,t,x+24,y+98,285,209,.9);
  for(let k=0;k<13;k++){let xx=x+36+k*20;circ(g,xx,y+310+5*sin(t*.7+k),4,C.clay,.43);}
 }else{
  const yy=y+112;
  for(let k=0;k<4;k++){let x1=x+30,y1=yy+k*52;ring(g,x1+10,y1,9,C.blue,2);line(g,[[x1+35,y1],[x1+257,y1]],C.paper,2,.26);let p=phase(t,k);circ(g,x1+35+p*222,y1,5,C.amber,.75);}
 }
 });
 for(let k=0;k<2;k++){let x=443+380*k;line(g,[[x,365],[x+21,365]],C.amber,2,.8);}
 words(g,"Schematic tissue and test motifs: no patient slides or measurements are shown.",94,612,18,C.muted,"serif");
}
function scene5(g,t){
 base(g,t,5);caption(g,"Evidence before a label.","Pathophysiology is the beginning of an investigation",t,5);
 const u=t-70;
 for(let k=0;k<26;k++){
 let q=k*TWO/26+.13*t,r=170+18*sin(k*.3+t*.09);
 orb(g,936+r*cos(q),349+r*.7*sin(q),7+k%5,t+k,k%3===0?C.clay:C.teal,6);
 }
 immuneCell(g,934,344,82,t,C.teal);ring(g,934,344,137+6*sin(t*.6),C.olive,2,.4);
 words(g,"Autoimmune Diseases of the GI Tract",89,301,41,C.white,"serif");
 words(g,"Part I: Etiology and Pathophysiology",90,348,29,C.amber,"serif");
 line(g,[[91,375],[743,375]],C.muted,2,.36);
 words(g,"Al-Ruweidi and colleagues · 2022",94,415,22,C.paper,"serif");
 words(g,"doi.org/10.5772/intechopen.106184",94,462,22,C.teal,"mono");
 words(g,"A review of scientific mechanisms, not a clinical diagnostic tool.",95,517,21,C.paper,"serif");
 words(g,"The five conditions do not share one established autoimmune mechanism.",96,553,19,C.muted,"serif");
 smalltag(g,"SOURCES AND LIMITATIONS IN THE ACCOMPANYING LEDGER",95,601,C.amber);
}
const scene=[scene0,scene1,scene2,scene3,scene4,scene5];
function drawAt(t){
 t=Math.min(DURATION-1e-5,Math.max(0,+t||0));
 const ix=Math.min(5,Math.floor(t/14)),local=t-14*ix;
 const next=ix<5&&local>13.0,blend=next?ease((local-13)/1):0;
 scene[ix](ax,t);if(next)scene[ix+1](bx,t);
 ctx.clearRect(0,0,W,H);ctx.drawImage(a,0,0);
 if(next){ctx.save();ctx.globalAlpha=blend;ctx.drawImage(b,0,0);ctx.restore();}
}
window.__draw=drawAt;window.__ready=true;
window.__meta={W:1920,H:1080,FPS,DURATION,chapters:6,scientific_form:"editorial schematic, not patient or measured experimental data"};
drawAt(0);
</script></body></html>
