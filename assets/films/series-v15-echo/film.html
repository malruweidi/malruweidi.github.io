// Ultrasound sector is obviously graphical: no manufactured granular "real scan".
function sector(d,x,y,w,h,t,subtle=false){
 const apexX=x+w*.5,apexY=y+20,left=x+12,right=x+w-12,bottom=y+h-14;
 d.save();d.beginPath();d.moveTo(apexX,apexY);d.lineTo(right-23,bottom-12);
 d.quadraticCurveTo(apexX,bottom+52,left+23,bottom-12);d.closePath();d.clip();
 let f=d.createLinearGradient(x,y,x+w,y+h);f.addColorStop(0,"#1a303d");f.addColorStop(.65,"#24434b");f.addColorStop(1,"#101e2a");rect(d,x,y,w,h,f);
 for(let k=1;k<6;k++){let r=(h-30)*k/6;d.beginPath();d.arc(apexX,apexY,r,.35,PI-.35);d.lineWidth=1.3;d.strokeStyle="rgba(147,181,180,.12)";d.stroke()}
 const wave=sin(t*TAU*1.18),pulse=1-.09*(.5+.5*wave),cx=apexX,cy=y+h*.60;
 d.save();d.translate(cx,cy);d.rotate(-.12+sin(t*.36)*.035);d.scale(pulse,1+.055*wave);
 const cells=[[-67,-44,39,31],[60,-48,37,30],[-56,47,38,60],[58,47,33,63]];
 d.lineWidth=4.8;d.strokeStyle=P.phosphor;d.fillStyle="rgba(10,31,41,.68)";
 for(let k=0;k<4;k++){const [xx,yy,rx,ry]=cells[k];d.beginPath();d.ellipse(xx,yy,rx,ry,xx<0?.17:-.13,0,TAU);d.fill();d.stroke()}
 line(d,[[-4,-84],[0,116]],P.aqua,4,.8);line(d,[[-110,-2],[112,1]],P.aqua,2,.7);d.restore();
 // Coherent moving ultrasonic sweep, visually distinct from source footage.
 let sweep=((t*.25)%1),angle=PI*.18+sweep*PI*.64;
 let r=Math.min(h*1.1,w*.9);line(d,[[apexX,apexY],[apexX+r*cos(angle),apexY+r*sin(angle)]],P.aqua,3,subtle?.15:.4);
 d.restore();line(d,[[apexX,apexY],[right-23,bottom-12]],P.phosphor,2,.6);
 line(d,[[apexX,apexY],[left+23,bottom-12]],P.phosphor,2,.6);
 text(d,"SCHEMATIC · NOT PATIENT ULTRASOUND",x+23,y+h-4,13,P.muted,"mono");

function ecg(d,t,x,y,w,level=.85){const points=[];for(let k=0;k<=190;k++){let p=k/190,s=(p*4-t*1.15)%1;if(s<0)s+=1;
 let pulse=Math.exp(-Math.pow((s-.43)*32,2))*-27+Math.exp(-Math.pow((s-.51)*43,2))*95-Math.exp(-Math.pow((s-.565)*37,2))*35;
 points.push([x+p*w,y+level*(pulse*.36+3*sin(s*TAU))]);}
 line(d,points,P.aqua,2,.72)}

}

function drawScene(d,j,t){d.save();scenes[j](d,t);d.restore()}
function render(t){t=clamp(t,0,DURATION-1/FPS);let which=5;
 for(let i=0;i<6;i++)if(t>=B[i]&&t<B[i+1]){which=i;break}
 let tr=-1;for(let k=1;k<6;k++)if(t>=B[k]-.39&&t<B[k]+.39){tr=k;break}

 if(tr<0){drawScene(dc[0],which,t);view.drawImage(buffers[0],0,0);return;}
 drawScene(dc[0],tr-1,t);drawScene(dc[1],tr,t);let p=ease(seg(t,B[tr]-.39,B[tr]+.39));
 view.drawImage(buffers[0],0,0);view.save();view.beginPath();
 if(tr%2){view.arc(618,390,Math.hypot(W,H)*p,0,TAU)}
 else{let x=(W+170)*p-80;view.moveTo(0,0);view.lineTo(x,0);view.lineTo(x-98,H);view.lineTo(0,H);view.closePath()}
 view.clip();view.drawImage(buffers[1],0,0);view.restore();}
