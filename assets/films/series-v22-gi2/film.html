<script>"use strict";

const sin=Math.sin,cos=Math.cos,clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),mix=(x,y,p)=>x+(y-x)*p,seg=(t,a,b)=>clamp((t-a)/(b-a)),ease=p=>{p=clamp(p);return p*p*(3-2*p)},out=p=>1-Math.pow(1-clamp(p),3);
function rect(d,x,y,w,h,c){d.fillStyle=c;d.fillRect(x,y,w,h)}

function tracer(d,x,y,X,Y,t,c=C.mint,count=7,sp=.15){line(d,[[x,y],[X,Y]],c,1.8,.4);for(let i=0;i<count;i++){let p=(t*sp+i/count)%1;dot(d,mix(x,X,p),mix(y,Y,p)+5*sin(p*TAU+t*.42+i),3,c,.14+.67*sin(PI*p))}}
function microscopy(d,t,cx,cy,w,h,injury=.1){
 // Clearly labelled *conceptual pattern only*, not histology/endoscopy.
 round(d,cx-w/2,cy-h/2,w,h,16,C.deep);
 d.save();d.beginPath();d.roundRect(cx-w/2+8,cy-h/2+8,w-16,h-16,13);d.clip();
 for(let k=0;k<26;k++){let ang=k*2.3999632297,rr=(k*47)%Math.min(w/2,h/2),x=cx+rr*cos(ang)+3*sin(t*.24+k),y=cy+rr*sin(ang)+2*cos(t*.27+k);
 dot(d,x,y,8+(k%5)*2,k%3?C.mint:C.violet,.18+.25*sin(t*.4+k));
 if(k%4===0)circle(d,x,y,14,C.rose,1,.22);}
 for(let j=0;j<7;j++){const yy=cy-h*.26+j*h*.09;let p=[];for(let a=0;a<48;a++){let q=a/47;p.push([cx-w*.46+w*.92*q,yy+7*sin(q*TAU*2+t*.11+j)])}line(d,p,injury>.5?C.copper:C.aqua,3,.3);}
 d.restore();}
function endoscopic(d,t,x,y,r=120){
 // An abstract lumen ring, NOT a generated actual clinical image.
 d.save();d.translate(x,y);
 for(let k=5;k>=0;k--){let rr=r*(.22+k*.165),angle=t*.28+k*.19;circle(d,11*sin(angle),8*cos(angle),rr,k%2?C.rose:C.amber,4,.12+.09*(5-k));}
 const p=t*.13;for(let k=0;k<38;k++){let q=(p+(k*.61803399)%1)%1,a=k*TAU/38+t*.10;
 dot(d,cos(a)*r*q,sin(a)*r*q,2.1+(k%3),C.mint,.08+.44*sin(PI*q));}
 circle(d,0,0,r*.93,C.mint,2,.58);circle(d,0,0,r*.31,C.rose,5,.55);
 d.restore();
}
function microIcon(d,x,y,t,kind){
 if(kind===0){for(let k=0;k<6;k++){let a=k*TAU/6+t*.07;dot(d,x+29*cos(a),y+29*sin(a),5,C.violet,.45);}circle(d,x,y,21,C.mint,3,.6)}
 else if(kind===1){endoscopic(d,t,x,y,34)}

}
function photo(d,img,x,y,w,h,t,caption){
 let iw=img.naturalWidth,ih=img.naturalHeight;if(!iw||!ih)return;
 d.save();d.beginPath();d.roundRect(x,y,w,h,10);d.clip();let s=Math.max(w/iw,h/ih)*1.035,ww=iw*s,hh=ih*s;d.drawImage(img,x+(w-ww)/2+7*sin(t*.23),y+(h-hh)/2+5*cos(t*.19),ww,hh);rect(d,x,y,w,h,"rgba(9,25,31,.22)");d.restore();text(d,caption,x,y+h+28,13,C.muted,"mono");
}
function antibody(d,x,y,t,s=1,c=C.amber){
 d.save();d.translate(x,y);d.scale(s,s);d.rotate(.12*sin(t*.27+x*.03));
 line(d,[[0,22],[0,-2],[-19,-25]],c,5,.85);line(d,[[0,-2],[19,-25]],c,5,.85);
 dot(d,-20,-27,4,C.mint,.85);dot(d,20,-27,4,C.mint,.85);d.restore();
}
function pathNodes(d,t,nodes,connections){

 for(let n of nodes){round(d,n.x-n.w/2,n.y-35,n.w,70,11,C.deep);dot(d,n.x-n.w/2+19,n.y,7,n.c,.86);text(d,n.title,n.x-n.w/2+36,n.y+7,n.size||17,C.white,"mono");}}

 for(let k=0;k<nodes.length;k++){let n=nodes[k],p=out(seg(l,1+k*.5,2+k*.5));round(d,n.x-n.w/2,n.y-38,n.w,77,11,C.deep);dot(d,n.x-n.w/2+21,n.y,8,n.c,p);text(d,n.title,n.x-n.w/2+40,n.y+8,n.size||17,C.white,"mono",p);}

const scenes=[scene0,scene1,scene2,scene3,scene4,scene5];
function draw(t){t=clamp(t,0,DURATION-1/FPS);let i=5;for(let j=0;j<6;j++)if(t>=B[j]&&t<B[j+1]){i=j;break}
let tr=-1;for(let j=1;j<6;j++)if(t>=B[j]-.4&&t<B[j]+.4){tr=j;break}
v.setTransform(1.5,0,0,1.5,0,0);
if(tr<0){scenes[i](G[0],t);v.drawImage(buffers[0],0,0);return}
scenes[tr-1](G[0],t);scenes[tr](G[1],t);
let p=ease(seg(t,B[tr]-.4,B[tr]+.4));v.drawImage(buffers[0],0,0);v.save();v.beginPath();

else{let x=(W+120)*p-75;v.moveTo(0,0);v.lineTo(x,0);v.lineTo(x-105,H);v.lineTo(0,H);v.closePath()}
v.clip();v.drawImage(buffers[1],0,0);v.restore();}
