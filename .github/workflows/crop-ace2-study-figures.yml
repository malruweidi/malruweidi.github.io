name: Extract exact ACE2 clinical Figure 1-3 pixel crops
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/crop-ace2-real-cohort-figures.py
      - .github/workflows/crop-ace2-study-figures.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  source-preserving-crops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - run: python scripts/crop-ace2-real-cohort-figures.py
      - name: Confirm original pages and exact crop SHA before release into film asset folder
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=json.loads(Path("assets/films/source-figures/v3/ace2-covid-drugs-figure-crops.json").read_text())
          assert len(d["figures"])==3
          for f in d["figures"]:
            assert hashlib.sha256(Path(f["image_path"]).read_bytes()).hexdigest()==f["sha256"]
            assert f["source_doi"]==d["doi"]
          PY
      - name: Commit separate exact-source archive without touching any existing film
        run: |
          git config user.name "Ruwaidix Clinical Source Editor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/source-figures/v3/ace2-covid-drugs-figure-*.jpg assets/films/source-figures/v3/ace2-covid-drugs-figure-crops.json
          if ! git diff --cached --quiet; then
            git commit -m "Curate exact 2022 ACE2 clinical source figures and intact chart labels"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
