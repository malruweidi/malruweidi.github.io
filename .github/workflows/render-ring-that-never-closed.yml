name: Render The Ring That Never Closed
on:
  push:
    branches: [main]
    paths:
      - assets/films/ring-that-never-closed-scenes.json
      - scripts/render-ring-that-never-closed.py
      - .github/workflows/render-ring-that-never-closed.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-ring-film-${{ github.ref }}
  cancel-in-progress: false
jobs:
  film:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[ring-film-output]')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout complete existing source
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Install Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install no-watermark open film tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
      - name: Validate documented chemical observations and provenance
        run: |
          python -m py_compile scripts/render-ring-that-never-closed.py
          python scripts/render-ring-that-never-closed.py --validate-only
      - name: Download free local Kokoro voice model
        run: |
          mkdir -p film-models
          curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
          test "$(stat -c%s film-models/voices-v1.0.bin)" -gt 1000000
      - name: Render 180-second chemistry film and captions
        run: python scripts/render-ring-that-never-closed.py --workspace film-models
      - name: Verify MP4, captions, exact running time and checksum
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          f=Path("assets/films/ring-that-never-closed.mp4")
          m=json.loads(Path("assets/films/ring-that-never-closed-build.json").read_text())
          assert f.stat().st_size>1_000_000
          assert f.open("rb").read(8)[4:8]==b"ftyp"
          assert hashlib.sha256(f.read_bytes()).hexdigest()==m["video_sha256"]
          assert abs(m["seconds"]-180)<.2 and m["scene_count"]==10
          assert Path("assets/films/ring-that-never-closed.vtt").read_text().count("-->")>=20
          print("Verified",f.stat().st_size,m["seconds"])
          PY
      - name: Commit new artifacts, preserve all original films and sources
        run: |
          git config user.name "Ruwaidix Film Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/ring-that-never-closed.mp4 assets/films/ring-that-never-closed.vtt assets/films/ring-that-never-closed-poster.webp assets/films/ring-that-never-closed-build.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish three-minute imine chemistry archival film [ring-film-output]"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
