name: Making Medicines Keep V3 — primary-source documentary
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/render-making-medicines-v3.py
      - .github/workflows/render-making-medicines-v3.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-making-medicines-v3
  cancel-in-progress: false
jobs:
  render-new-historical-film:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source film and voice engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-making-medicines-v3.py
      - name: Validate authentic source manuscript is attached
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path("assets/films/source-manuscripts/wellcome-ms-arabic-1002")
          d=json.loads((root/"source-register.json").read_text())
          assert d["copy_date"]=="Egypt, 1904 CE" and d["canvas_count"]==180
          for n in ("canvas-001.jpg","canvas-013.jpg"):
            f=root/n
            record=next(x for x in d["staged_pages"] if x["filename"]==n)
            assert hashlib.sha256(f.read_bytes()).hexdigest()==record["sha256"]
          print("Wellcome MS Arabic 1002 source verified, later copy 1904.")
          PY
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Obtain only openly distributed voice model weights
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Render 8 bespoke visual episodes with exact-source manuscript and synthetic narration
        run: python scripts/render-making-medicines-v3.py
      - name: Verify video streams, captions, fidelity record and preserved V1
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          folder=Path("assets/films/series-v3")
          master=folder/"making-medicines-keep.mp4"
          meta=json.loads((folder/"making-medicines-keep.json").read_text())
          assert master.stat().st_size>700_000
          assert abs(meta["duration_seconds"]-120)<.30
          assert meta["sha256"]==hashlib.sha256(master.read_bytes()).hexdigest()
          assert "NOT YET APPROVED" in meta["human_review"]
          assert len(meta["chapters"])==8
          assert (folder/"making-medicines-keep.vtt").read_text().startswith("WEBVTT")
          assert Path("assets/films/series/making-medicines-keep.mp4").exists()
          probe=json.loads(subprocess.check_output(["ffprobe","-loglevel","error","-show_entries","stream=codec_name,codec_type","-of","json",str(master)]))
          assert {"h264","aac"}<={s["codec_name"] for s in probe["streams"]}
          print("V3 new historical-film master verified; source and human rights audit pending.")
          PY
      - name: Commit the V3 alternative without altering default public video
        run: |
          git config user.name "Ruwaidix Historical Film"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v3/making-medicines-keep.*
          git commit -m "Render genuine source-backed Making Medicines Keep V3 documentary film"
          git fetch origin "${{ github.ref_name }}"
          if git rebase "origin/${{ github.ref_name }}"; then
            git push origin HEAD:"${{ github.ref_name }}"
          else
            git rebase --abort
            echo "The new film is not merged automatically when competing edits appear."
            exit 1
          fi
