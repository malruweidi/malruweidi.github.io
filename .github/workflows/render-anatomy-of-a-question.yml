name: Render and publish Anatomy of a Question

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/anatomy-of-a-question/**'
      - '.github/workflows/render-anatomy-of-a-question.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anatomy-of-a-question-release
  cancel-in-progress: false

jobs:
  render-and-release:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[anatomy-film-output]')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out documentary archive
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install the CPU-only open-source film toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pocket-tts==4.0.1' pillow numpy scipy
      - name: Stage verified original archive material
        run: |
          python scripts/anatomy-of-a-question/prepare_sources.py --repo-root . --assets film-sources
      - name: Render video, original soundtrack, narration and captions
        env:
          HF_HOME: ${{ runner.temp }}/anatomy-hf-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/anatomy-app-cache
          OMP_NUM_THREADS: '4'
        run: |
          python scripts/anatomy-of-a-question/full_film.py --assets film-sources --out film-render
      - name: Technical and source-integrity quality gates
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          output=Path('film-render/anatomy-of-a-question-2026.mp4')
          assert output.is_file() and output.stat().st_size > 1_000_000
          probe=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration:stream=codec_name,width,height',
              '-of','json',str(output)]))
          assert abs(float(probe['format']['duration'])-386) < 1.5, probe
          names={s['codec_name'] for s in probe['streams']}
          assert 'h264' in names and 'aac' in names, names
          assert any(s.get('width')==1440 and s.get('height')==600 for s in probe['streams'])
          vtt=Path('film-render/anatomy-of-a-question.vtt').read_text()
          assert vtt.startswith('WEBVTT') and vtt.count('-->') == 38
          manifest=json.loads(Path('film-render/source_manifest.json').read_text())
          assert manifest['duration']==386 and len(manifest['shots'])==39
          assert all(s['sha256'] for s in manifest['shots'] if s['asset'])
          subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(output),'-f','null','-'],check=True)
          print('Film validation passed:',probe['format']['duration'],'seconds')
          PY
      - name: Place new film and replace three existing website players
        run: |
          python scripts/anatomy-of-a-question/publish_site.py \
            --site-root . --media film-render \
            --shots scripts/anatomy-of-a-question/full_shots.json
      - name: Release the exact validated master without deleting the prior film
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html film.html films.html
          git add assets/films/anatomy-of-a-question-2026.mp4
          git add assets/films/anatomy-of-a-question-2026.vtt
          git add assets/films/anatomy-of-a-question-2026.webp
          git add assets/films/anatomy-of-a-question-2026-source.json
          git diff --cached --check
          git commit -m 'Publish Anatomy of a Question 6:26 documentary [anatomy-film-output]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
