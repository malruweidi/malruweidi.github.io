name: Ruwaidix encoded-film quality gate
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/audit-all-film-recuts.py
      - scripts/normalize-film-captions.py
      - scripts/build-film-pronunciation-index.py
      - assets/films/pronunciation-review-lexicon.json
      - .github/workflows/audit-film-recuts.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-video-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect-encoded-video:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install genuine encoded-video validation stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Correct long captions in the replacement editions without rewriting narration
        run: |
          python scripts/normalize-film-captions.py --collection series-v2
          python scripts/normalize-film-captions.py --collection longform-v2
      - name: Index high-risk scientific names and Arabic terms for human listening
        run: python scripts/build-film-pronunciation-index.py
      - name: Validate all current publication documentary remakes
        run: python scripts/audit-all-film-recuts.py --collection series-v2
      - name: Validate every feature documentary recut
        run: python scripts/audit-all-film-recuts.py --collection longform-v2
      - name: Save technical review results without mutating any film
        run: |
          git config user.name "Ruwaidix Film Quality Gate"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/pronunciation-review-v2.json assets/films/series-v2/technical-qa.json assets/films/longform-v2/technical-qa.json assets/films/series-v2/*.vtt assets/films/longform-v2/*.vtt
          if ! git diff --cached --quiet; then
            git commit -m "Audit full encoded films for interrupted playback, caption coverage and source hashes [qa-only]"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
