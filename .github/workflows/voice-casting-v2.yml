name: Ruwaidix narrator auditions — scientific and historical pronunciation
on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - scripts/render-voice-auditions.py
      - .github/workflows/voice-casting-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  blind-audition:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[voice-audition]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy soundfile kokoro-onnx
      - run: python scripts/render-voice-auditions.py --validate-only
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-voice-audition-kokoro-20261017
      - name: Retrieve public voice models, no cloning
        run: |
          mkdir -p film-models
          test -s film-models/kokoro-v1.0.fp16.onnx || curl --fail --location --retry 3 -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          test -s film-models/voices-v1.0.bin || curl --fail --location --retry 3 -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Prepare 9 sample wav recordings, unapproved
        run: python scripts/render-voice-auditions.py --models film-models
      - name: Commit only audition material on protected editorial branch
        run: |
          git config user.name "Ruwaidix Sound Editor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/voice-audition-v2/
          if ! git diff --cached --quiet; then
            git commit -m "Add scientific narrator comparison samples [voice-audition]"
            for n in 1 2 3 4 5; do
              git fetch origin cinematic-remake-20261017
              git rebase FETCH_HEAD
              if git push origin HEAD:cinematic-remake-20261017; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
