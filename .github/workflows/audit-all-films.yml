name: Full Ruwaidix Cinema Editorial Audit
on:
  push:
    branches: [cinema-rebuild-audit-20261017]
    paths:
      - scripts/audit-all-films.py
      - tests/full-cinema-remake-audit.test.cjs
      - cinema-workshop.html
      - assets/films/audit/directors-board.json
      - assets/films/audit/THREE_PILOT_DIRECTORS_CUTS.md
      - assets/films/audit/EDITORIAL_AUDIT_AND_REMAKE_PLAN.md
      - .github/workflows/audit-all-films.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[audit-output]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoding and contact sheet dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - name: Audit every actual published documentary MP4
        run: |
          python -m py_compile scripts/audit-all-films.py
          python scripts/audit-all-films.py
      - name: Verify audit completeness and source documentation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("assets/films/audit/full-film-inventory.json").read_text())
          assert a["completed_films"]>=44
          assert a["short_publication_count"]==35
          for x in a["records"]:
              assert (Path(x["contact_sheet"])).is_file(),x["id"]
              assert Path(x["contact_sheet"]).stat().st_size>3000
          print("Verified",a["completed_films"],"actual video contact sheets")
          PY
      - name: Verify all 44 bespoke editorial treatments and non-destructive picture snapshots
        run: node --test tests/full-cinema-remake-audit.test.cjs
      - name: Save contact sheets on audit-only branch without replacing films
        run: |
          git config user.name "Ruwaidix Film Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/audit/
          if ! git diff --cached --quiet; then
            git commit -m "Film contact sheets and 44-work visual inventory [audit-output]"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
