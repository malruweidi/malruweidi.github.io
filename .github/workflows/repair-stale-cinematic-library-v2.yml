name: Rebuild nine stale Ruwaidix documentary cuts and verify the complete archive

on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - .github/workflows/repair-stale-cinematic-library-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ruwaidix-nine-film-repair-v2
  cancel-in-progress: false

jobs:
  restore-current-storyboards:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: cinematic-remake-20261017
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic open film/voice/render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx cairosvg
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-voice-audition-kokoro-20261017
      - name: Prepare audition model for protected draft films
        run: |
          mkdir -p film-models
          test -s film-models/kokoro-v1.0.fp16.onnx || curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          test -s film-models/voices-v1.0.bin || curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Check storyboard validity without changing any original media
        run: |
          python scripts/render-cinematic-library.py --validate-only
          python -m py_compile scripts/render-cinematic-library.py scripts/render-directors-cuts.py scripts/render-contact-sheet-v2.py
      - name: Rebuild only stale candidates with durable checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ruwaidix Source Film Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          films=(
            pub-airway-reopening
            pub-ace2-forms
            pub-microfluidic-virus
            pub-food-printing
            pub-ceramics-printing
            feature-what-survives-the-experiment
            feature-ring-that-never-closed
            feature-airway-reopening-evidence-cut
            feature-two-materials-no-section-evidence-cut
          )
          for film in "${films[@]}"; do
            echo "::group::Rebuild and verify $film"
            # Current storyboard/renderer SHA decides freshness, never a filename alone.
            python scripts/render-cinematic-library.py --film "$film" --missing-only --limit 1 --models film-models --voice-mode kokoro-preview
            FILM_SLUG="$film" python - <<'PY'
          import importlib.util, json, hashlib, os, pathlib, subprocess
          root=pathlib.Path.cwd()
          slug=os.environ["FILM_SLUG"]
          src=json.load((root/"assets/films/cinematic-library-v2.json").open())
          film=next(x for x in src["films"] if x["slug"]==slug)
          b=root/"assets/films/library-v2"/(slug+"-rough-cut")
          info=json.load((b.with_suffix(".json")).open())
          movie=b.with_suffix(".mp4")
          assert movie.is_file() and movie.stat().st_size>10000
          assert info["sha256"]==hashlib.sha256(movie.read_bytes()).hexdigest()
          assert info["voice_approved"] is False
          assert info["never_auto_publish"] is True
          assert (b.with_suffix(".vtt")).read_text().startswith("WEBVTT")
          expected=sum(int(s["sec"]) for s in film["shots"])
          secs=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",str(movie)]))
          assert abs(expected-secs)<=.35,(slug,expected,secs)
          print("Verified refreshed MP4 and caption:",slug,secs)
          PY
            git add -A assets/films/library-v2/
            if ! git diff --cached --quiet; then
              git commit -m "Rebuild current source-timed cut $film [v2-output]"
              pushed=false
              for attempt in 1 2 3 4 5 6 7 8; do
                git fetch origin cinematic-remake-20261017
                git rebase FETCH_HEAD
                if git push origin HEAD:cinematic-remake-20261017; then pushed=true; break; fi
                sleep "$((attempt * 2))"
              done
              test "$pushed" = true
            fi
            echo "::endgroup::"
          done
      - name: Check all 44 exact storyboard hashes and actual decoded frames
        run: |
          python scripts/render-contact-sheet-v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("assets/films/visual-audit-v2/screening-results.json").read_text())
          assert j["exports_examined"]==44 and j["exports_remaining"]==0, (j["exports_examined"],j["exports_remaining"])
          flagged=[(f["slug"],f["issues"]) for f in j["films"] if f["issues"]]
          assert not flagged,flagged
          assert j["status"]=="TECHNICAL AUDIT ONLY, NOT ARTISTIC APPROVAL"
          print("All 44 exports pass technical/freshness checks; artistic and narrator approval remain outstanding.")
          PY
      - name: Commit technical film contact sheets on protected branch only
        run: |
          git add assets/films/visual-audit-v2/
          if ! git diff --cached --quiet; then
            git commit -m "Verify all 44 current film exports without claiming artistic sign-off [v2-qa]"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin cinematic-remake-20261017
              git rebase FETCH_HEAD
              if git push origin HEAD:cinematic-remake-20261017; then exit 0; fi
              sleep "$((attempt * 2))"
            done
            exit 1
          fi
