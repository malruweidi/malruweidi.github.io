name: V7 film-frame review
on:
  push:
    branches: [main]
    paths:
      - scripts/audit-v7-pilot-contact-sheets.py
      - assets/films/series-v7-pilots/*.mp4
      - .github/workflows/cinema-v7-contact-sheets.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cinema-contact-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare frames
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - name: Extract actual film frames, not promotional posters
        run: python scripts/audit-v7-pilot-contact-sheets.py
      - name: Preserve actual contact sheets for visual inspection
        run: |
          git config user.name "Ruwaidix Film QC"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/quality-review-v7/*-contact-sheet.webp
          if ! git diff --cached --quiet; then
            git commit -m "Record real video-frame storyboards for creative review [v7-contact]"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:"${{ github.ref_name }}"
          fi
