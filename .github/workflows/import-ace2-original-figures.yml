name: Stage genuinely reusable RAAS paper figures 3 and 7
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/import-ace2-original-figures.py
      - .github/workflows/import-ace2-original-figures.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - run: python scripts/import-ace2-original-figures.py
      - name: Preserve figure identity and metadata for each chapter
        run: |
          git config user.name "Ruwaidix Article Figure Verification"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/source-figures/ace2-original/
          if ! git diff --cached --quiet; then
            git commit -m "Stage only original ACE2 review figures 3 and 7 after rights triage"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then git push origin HEAD:"${{ github.ref_name }}"; else git rebase --abort; exit 1; fi
          fi
