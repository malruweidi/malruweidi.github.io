name: 2017 polymer micelles V3 — authentic research archive documentary
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/render-micelles-pahs-v3.py
      - .github/workflows/render-micelles-pahs-v3.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ruwaidix-owner-micelles-v3, cancel-in-progress: false}
jobs:
  source-bound-polymeric-micelles:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare free cinematic video and local voice software
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-micelles-pahs-v3.py
      - uses: actions/cache@v4
        with: {path: film-models, key: ruwaidix-kokoro-onnx-fp16-v1.1}
      - name: Download openly distributed local Kokoro voice model if absent
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl -fL --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl -fL --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Render eight source-specific research episodes using original archive only
        run: python scripts/render-micelles-pahs-v3.py
      - name: Verify original source, eight film episodes and encoded audiovisual streams
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          d=Path("assets/films/series-v3")
          f=d/"micelles-pahs.mp4"
          meta=json.loads((d/"micelles-pahs.json").read_text())
          assert meta["original_grant"]=="UREP19-110-1-014"
          assert len(meta["chapters"])==8
          assert len(meta["archival_files"])==3
          for a in meta["archival_files"]:assert Path(a).exists()
          assert meta["sha256"]==hashlib.sha256(f.read_bytes()).hexdigest()
          assert abs(meta["duration_seconds"]-120)<.35
          assert f.stat().st_size>700000
          assert (d/"micelles-pahs.vtt").read_text().startswith("WEBVTT")
          assert Path("assets/films/series/micelles-pahs.mp4").exists()
          x=json.loads(subprocess.check_output(["ffprobe","-loglevel","error","-show_streams","-of","json",str(f)]))
          assert {"h264","aac"}<={t["codec_name"] for t in x["streams"]}
          assert "NOT APPROVED" in meta["human_review"]
          print("True owner-archive polymer documentary encoded; scientific and rights review pending")
          PY
      - name: Commit independent V3 film without deleting or replacing original
        run: |
          git config user.name "Ruwaidix Research Film"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v3/micelles-pahs.*
          if ! git diff --cached --quiet; then
            git commit -m "Render original-archive polymer micelle research documentary"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              git push origin HEAD:"${{ github.ref_name }}"
            else
              git rebase --abort
              echo "Detected competing update: preserve remote source films"
              exit 1
            fi
          fi
