name: Inspect exact-study videos by full-frame encoded contact sheets
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/audit-experiment-films-v3.py
      - .github/workflows/audit-experiment-films-v3.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ruwaidix-actual-scientific-film-review
  cancel-in-progress: false
jobs:
  check-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - name: Generate frame-accurate scientific visual QA with provenance
        run: python scripts/audit-experiment-films-v3.py
      - name: Commit source-hash-bound frame galleries
        run: |
          git config user.name "Ruwaidix Film Science Review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v3/qa/
          if ! git diff --cached --quiet; then
            git commit -m "Stage full-frame actual encoded V3 scientific paper film checks"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
