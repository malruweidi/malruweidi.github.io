name: Film 04 original research narration - Kokoro
on:
  push:
    branches: [film04-curcumin-voice-20261022]
    paths: ['.github/workflows/film04-curcumin-voice.yml']
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Kokoro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          python -m pip install -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
      - name: Download open voice model
        run: |
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s model/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Create twelve exact chapter voices with full words
        run: |
          python - <<'PY'
          from kokoro_onnx import Kokoro
          from pathlib import Path
          import numpy as np, soundfile as sf, json
          texts=["A yellow plant pigment becomes a chemical question. Could curcumin give a visible signal when cyanide is present?","Curcumin comes from turmeric. The researchers measured what happened when cyanide was introduced under controlled laboratory conditions.","The solvent matters. The curcumin solution contained ninety parts acetonitrile to ten parts water. It was not plain drinking water.","In that mixture, cyanide changed the curcumin solution from bright yellow to dark orange. This was directly observed.","In the absorption spectrum, a band at four hundred twenty-one nanometres decreased. A new band appeared near five hundred twenty.","The difference was ninety-nine nanometres, a measurable red shift. The original plot shows the observation more precisely than a photograph.","Other anions, including chloride and bromide, did not show the same response. But hydroxide also changed the signal.","The reported detection limit was two point three micromolar. That sensitivity belongs to this specific analytical setup.","Curcumin also emits fluorescent light. Adding cyanide quenched the fluorescence near five hundred twenty nanometres.","Under the microscope, cultured human kidney cells showed curcumin fluorescence. Following cyanide exposure, that signal faded over time.","These cells provide a fluorescence demonstration, not proof that the method is safe or reliable for clinical diagnosis.","The lesson is chemical as much as visual: a sensor's performance depends on the solvent, competing ions, and measurement conditions."]
          model=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          sr=None;mix=None;events=[]
          for i,txt in enumerate(texts):
            for speed in (1.08,1.14,1.20,1.26,1.32):
              samples,rate=model.create(txt,voice='af_bella',speed=speed,lang='en-us')
              a=np.asarray(samples,dtype=np.float32).reshape(-1)
              if len(a)/rate<9.60:break
            if len(a)/rate>=9.60:raise RuntimeError(f'Chapter {i+1} overflows by {len(a)/rate:.2f}s')
            if sr is None:sr=rate;mix=np.zeros(120*sr,dtype=np.float32)
            assert sr==rate
            start=i*10+.19;offset=round(start*sr)
            mix[offset:offset+len(a)]+=a
            sf.write(f'chapter-{i+1:02}.wav',a,sr,subtype='PCM_16')
            events.append(dict(shot=i+1,start=start,end=start+len(a)/sr,voice_speed=speed,text=txt))
            print(i+1,round(len(a)/sr,2),speed,flush=True)
          mix*=0.78/max(0.01,float(np.max(np.abs(mix))))
          sf.write('Film_04_Kokoro_Narration.wav',mix,sr,subtype='PCM_16')
          Path('Film_04_Timing.json').write_text(json.dumps({'voice':'Kokoro ONNX af_bella','model':'Kokoro-v1.0 fp16','scenes':events,'editorial':'Requires narrator audition'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: film04-curcumin-narration
          path: |
            Film_04_Kokoro_Narration.wav
            Film_04_Timing.json
            chapter-*.wav
          retention-days: 7
