name: Film 15 | Immune Interface V21

on:
  push:
    branches:
      - cinema/heart-sensors-film15-v23
    paths:
      - assets/films/series-v23-heart/film.html
      - assets/films/series-v23-heart/SOURCE_NOTES.md
      - scripts/render-heart-v23.py
      - tests/heart-v23.test.py
      - .github/workflows/render-gut-diagnostics-v22.yml

permissions:
  contents: write

concurrency:
  group: single-film15-heart-v23
  cancel-in-progress: false

jobs:
  film13:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout all original documentary versions without changing existing website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local video production dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check pillow playwright numpy soundfile
          python -m playwright install --with-deps chromium
      - name: Validate source narration, citation and 6 animated scenes
        run: |
          python -m py_compile scripts/render-heart-v23.py tests/heart-v23.test.py
          python scripts/render-heart-v23.py --validate-only
          python tests/heart-v23.test.py
      - name: Render 2016 independent native Full HD frames and preserve source audio
        run: python -u scripts/render-heart-v23.py
      - name: Check encoded 84 s H.264/AAC, captions, source hashes, temporal motion, true peak
        run: |
          python - <<'PY'
          import hashlib,json,re,subprocess
          from pathlib import Path
          out=Path("assets/films/series-v23-heart")
          mp4=out/"heart-failure-sensors.mp4"
          manifest=json.loads((out/"heart-failure-sensors.json").read_text())
          assert manifest["film_index"]==15
          assert manifest["source_chapter"]["doi"]=="10.1002/9781119813040.ch5"
          assert manifest["source_mp4_sha256"]=="a5071e75cf771e8cd24e95796c665fe8f4ea6aa228b7d3f92ddf42ef784a2280"
          assert manifest["captions_count"]==12
          assert manifest["live_website_unchanged"] and manifest["older_film_masters_preserved"]
          assert hashlib.sha256(mp4.read_bytes()).hexdigest()==manifest["sha256"]
          assert (out/"heart-failure-sensors.vtt").read_text().count("-->")==12
          assert len(list(out.glob("chapter-??.jpg")))==6
          assert (out/"heart-failure-sensors.contact.webp").stat().st_size>12000
          assert (out/"heart-failure-sensors.webp").stat().st_size>3500
          meta=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(mp4)]))
          assert abs(float(meta["format"]["duration"])-84)<.15
          assert any(s.get("codec_name")=="h264" and s.get("width")==1920 and s.get("height")==1080 for s in meta["streams"])
          assert any(s.get("codec_name")=="aac" for s in meta["streams"])
          hashes=subprocess.check_output(["ffmpeg","-v","error","-i",str(mp4),"-map","0:v:0","-an","-vf","fps=1","-f","framemd5","-"],text=True)
          h=[l.rsplit(",",1)[-1].strip() for l in hashes.splitlines() if l and not l.startswith("#")]
          assert 83<=len(h)<=85
          assert len(set(h))>=80,("Too many static frames",len(set(h)))
          audio=subprocess.run(["ffmpeg","-hide_banner","-i",str(mp4),"-map","0:a:0",
                "-filter_complex","ebur128=peak=true","-f","null","-"],capture_output=True,text=True)
          assert audio.returncode==0
          peaks=[float(x) for x in re.findall(r"TPK:\s*([-+]?\d+(?:\.\d+)?)\s*dBFS",audio.stderr)]
          assert peaks and max(peaks)<=-1.0,("Master true peak too high",peaks[-4:])
          print("FILM15 PASS: 84s full HD, 12 captions, unique temporal frames",
                len(set(h)),"/",len(h),"worst true peak",max(peaks),"dBTP",flush=True)
          PY
      - name: Save reviewed artifacts to isolated version branch (never modify main)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ruwaidix Research Cinema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_hash="$(git hash-object scripts/render-heart-v23.py)"
          mkdir -p /tmp/film13-export
          cp -a assets/films/series-v23-heart/. /tmp/film13-export/
          git fetch origin cinema/heart-sensors-film15-v23
          current_hash="$(git show origin/cinema/heart-sensors-film15-v23:scripts/render-heart-v23.py | git hash-object --stdin)"
          if [ "$source_hash" != "$current_hash" ]; then
            echo "Renderer changed during job; refusing stale export"; exit 0
          fi
          git reset --hard origin/cinema/heart-sensors-film15-v23
          cp -a /tmp/film13-export/. assets/films/series-v23-heart/
          git add assets/films/series-v23-heart/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Film 15: export verified kinetic GI immunology cinema master"
          git push origin HEAD:cinema/heart-sensors-film15-v23
