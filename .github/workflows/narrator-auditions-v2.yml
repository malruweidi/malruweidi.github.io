name: Compare open-source narrators before public film release
on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - scripts/render-narrator-auditions.py
      - .github/workflows/narrator-auditions-v2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: narrator-auditions-v2
  cancel-in-progress: false
jobs:
  audition:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[voice-auditions-output]')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open audio renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install numpy soundfile kokoro-onnx
      - name: Validate voicecasting inputs
        run: python scripts/render-narrator-auditions.py --validate-only
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-voice-audition-kokoro-20261017
      - name: Download free ONNX model and voice vectors
        run: |
          mkdir -p film-models
          test -s film-models/kokoro-v1.0.fp16.onnx || curl --fail --location --retry 3 -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          test -s film-models/voices-v1.0.bin || curl --fail --location --retry 3 -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Render sixteen listening comparisons
        run: python scripts/render-narrator-auditions.py --models film-models
      - name: Preserve auditions without switching any live player
        run: |
          git config user.name "Ruwaidix Narrator Auditions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/voice-auditions-v2/
          if ! git diff --cached --quiet; then
            git commit -m "Audio previews for unapproved narrator comparison [voice-auditions-output]"
            pushed=false
            for retry in 1 2 3 4 5 6 7 8; do
              git fetch origin cinematic-remake-20261017
              git rebase FETCH_HEAD
              if git push origin HEAD:cinematic-remake-20261017; then pushed=true; break; fi
              sleep "$((retry * 2))"
            done
            if [ "$pushed" != true ]; then echo "Failed to reconcile concurrent output commits" >&2; exit 1; fi
          fi
