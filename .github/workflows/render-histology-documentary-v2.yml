name: Restore source accuracy in zebrafish histology documentary
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render-histology-documentary-v2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: histology-documentary-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-corrected-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local renderer and British narrator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
      - name: Cache open voice models
        uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Load the local Kokoro voice model
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then
            curl -fLsS --retry 3 -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          fi
          if [ ! -s film-models/voices-v1.0.bin ]; then
            curl -fLsS --retry 3 -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          fi
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Validate corrected source and preservation of the previous edition
        run: |
          python -m py_compile scripts/render-evidence-series.py
          python scripts/render-evidence-series.py --validate-only
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("assets/films/evidence-in-motion.json").read_text())
          film=next(x for x in obj["films"] if x["slug"]=="two-materials-no-section")
          assert film["media_stem"]=="two-materials-no-section-source-v2"
          assert film["scenes"][6]["visual"]=="agarose"
          assert "context_visual" not in film["scenes"][6]
          assert Path("assets/films/two-materials-no-section.mp4").is_file()
          assert Path("assets/films/two-materials-no-section.vtt").is_file()
          print("Original preserved; no third-party generic microtome footage remains")
          PY
      - name: Render only source-corrected histology documentary, keep other films intact
        run: python scripts/render-evidence-series.py --only two-materials-no-section --workspace film-models
      - name: Verify 120-second movie, captions, narration and publication source
        run: |
          python - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          base=Path("assets/films/two-materials-no-section-source-v2")
          mp4=base.with_suffix(".mp4")
          vtt=base.with_suffix(".vtt")
          report=Path(str(base)+"-build.json")
          assert mp4.stat().st_size>1000000
          info=json.loads(subprocess.check_output(
             ["ffprobe","-v","error","-show_format","-show_streams","-of","json",str(mp4)]))
          assert {t["codec_type"] for t in info["streams"]}>={"audio","video"}
          assert abs(float(info["format"]["duration"])-120)<.16
          assert vtt.read_text().startswith("WEBVTT")
          assert vtt.read_text().count("-->")>=8
          meta=json.loads(report.read_text())
          assert meta["sha256"]==hashlib.sha256(mp4.read_bytes()).hexdigest()
          assert meta["chapters"]==8
          assert Path("assets/films/two-materials-no-section.mp4").stat().st_size>1000000
          assert Path("assets/films/plates/two-materials-no-section-08.webp").is_file()
          print("Corrected histology documentary valid; original remains preserved")
          PY
      - name: Publish revised histology film and evidence map beside the original
        run: |
          git config user.name "Ruwaidix Documentary Editor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/two-materials-no-section-source-v2.mp4
          git add assets/films/two-materials-no-section-source-v2.vtt
          git add assets/films/two-materials-no-section-source-v2-build.json
          git add assets/films/plates/two-materials-no-section-08.webp
          if ! git diff --cached --quiet; then
            git commit -m "Remove unrelated generic microtome from zebrafish histology documentary V2"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:"${{ github.ref_name }}"
          fi
