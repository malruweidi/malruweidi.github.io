name: Ruwaidix five narrative feature-film remakes
on:
  push:
    branches: [film-remake-20261017, main]
    paths:
      - scripts/remaster-feature-films.py
      - assets/films/longform-remake-direction.json
      - .github/workflows/render-feature-film-overhaul.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-all-longform-${{ github.ref }}
  cancel-in-progress: false
jobs:
  editorial-features:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free video assembly, analysis and local speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy soundfile kokoro-onnx cairosvg
      - name: Check science narratives, registered sources and film lengths
        run: |
          python -m py_compile scripts/remaster-feature-films.py
          python scripts/remaster-feature-films.py --validate-only
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Ensure open local narrator models are present
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Replace quiet Cairo film with scene-specific first-person documentary narration
        run: python scripts/remaster-feature-films.py --missing-only --only cairo-microscope
      - name: Render four source-bounded scientific documentary recuts
        run: python scripts/remaster-feature-films.py --missing-only --limit 4
      - name: Verify every recut, duration, hash and subtitle file
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          d=Path("assets/films/longform-v2")
          stems=["what-survives-the-experiment","airway-reopening-evidence-cut","ring-that-never-closed","cairo-microscope","two-materials-no-section"]
          for stem in stems:
              mp4=d/(stem+".mp4")
              assert mp4.is_file(),mp4
              record=json.loads((d/(stem+"-feature-build.json")).read_text())
              assert record["edition"]=="longform-v2-recut"
              assert len(record["source_credits"])==4
              assert hashlib.sha256(mp4.read_bytes()).hexdigest()==record["sha256"]
              assert (d/(stem+".vtt")).read_text().startswith("WEBVTT")
              data=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","json",str(mp4)]))
              assert abs(record["seconds"]-float(data["format"]["duration"]))<.25
              print(stem,"verified",record["seconds"])
          PY
      - name: Generate inspectable frame sheets for all long features
        run: python scripts/make-film-qa-contact-sheets.py --collection longform-v2
      - name: Publish draft alternate feature footage, preserving original versions
        run: |
          git config user.name "Ruwaidix Open Film Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/longform-v2/*.mp4 assets/films/longform-v2/*.vtt assets/films/longform-v2/*.json assets/films/longform-v2/qa/*.jpg assets/films/longform-v2/qa/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Draft five source-grounded feature recuts with exact archived sound and credits"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
