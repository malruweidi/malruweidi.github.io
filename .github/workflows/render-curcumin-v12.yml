name: Film 04 | Curcumin optical motion-cinema master

on:
  push:
    branches:
      - cinema/curcumin-cyanide-v12-spectral-film
    paths:
      - assets/films/series-v12-curcumin/film.html
      - scripts/render-curcumin-v12.py
      - tests/curcumin-v12.test.py
      - .github/workflows/render-curcumin-v12.yml

permissions:
  contents: write

concurrency:
  group: curcumin-v12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  make-single-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout original research image and production code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free video compositor dependencies and headless Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check pillow playwright numpy soundfile
          python -m playwright install --with-deps chromium
      - name: Verify authentic narration, scientific boundaries and seekable motion
        run: |
          python -m py_compile scripts/render-curcumin-v12.py tests/curcumin-v12.test.py
          python scripts/render-curcumin-v12.py --validate-only
          python tests/curcumin-v12.test.py
      - name: Render only Film 04 in native full HD
        run: python -u scripts/render-curcumin-v12.py
      - name: Independently verify MP4, captions, motion and source manifest
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('assets/films/series-v12-curcumin')
          mp4=root/'curcumin-cyanide.mp4'
          record=json.loads((root/'curcumin-cyanide.json').read_text())
          metadata=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(mp4)]))
          streams=metadata['streams']
          assert {'video','audio'}<={s['codec_type'] for s in streams}
          assert abs(float(metadata['format']['duration'])-84)<.15
          assert any(x.get('codec_name')=='h264' and x.get('width')==1920 and x.get('height')==1080 for x in streams)
          assert record['primary_paper_doi']=='10.1039/C9AY01557D'
          assert record['reported_optical_results']['medium']=='acetonitrile:water 90:10'
          assert record['reported_optical_results']['bathochromic_shift_nm']==99
          assert record['source_figure_integrity'].startswith('Original published')
          assert hashlib.sha256(mp4.read_bytes()).hexdigest()==record['sha256']
          assert (root/'curcumin-cyanide.vtt').read_text().count('-->')==12
          assert (root/'curcumin-cyanide.webp').stat().st_size>6000
          assert (root/'curcumin-cyanide.contact.webp').stat().st_size>15000
          assert len(list(root.glob('chapter-??.jpg')))==6
          # Audio packets must NOT contaminate the video-only motion test.
          report=subprocess.check_output(['ffmpeg','-v','error','-i',str(mp4),'-map','0:v:0',
             '-an','-vf','fps=1','-f','framemd5','-'],text=True)
          hashes=[q.rsplit(',',1)[-1].strip() for q in report.splitlines() if q and not q.startswith('#')]
          assert 83<=len(hashes)<=85,len(hashes)
          assert len(set(hashes))>=80, f'Static-motion regression: {len(set(hashes))} distinct'
          print('FILM04 INDEPENDENT VIDEO MOTION PASS:',len(set(hashes)),'of',len(hashes),'distinct sampled video frames')
          # Measure actual output loudness, but listening remains a human creative gate.
          audio=subprocess.run(['ffmpeg','-hide_banner','-i',str(mp4),'-map','0:a:0',
             '-filter_complex','ebur128=peak=true','-f','null','-'],capture_output=True,text=True)
          assert audio.returncode==0
          print('FILM04 LOUDNESS QC tail:',audio.stderr[-1300:])
          PY
      - name: Publish isolated review artifacts to this branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ruwaidix Research Cinema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_hash="$(git hash-object scripts/render-curcumin-v12.py)"
          mkdir -p /tmp/curcumin-v12-render
          cp -a assets/films/series-v12-curcumin/. /tmp/curcumin-v12-render/
          git fetch origin cinema/curcumin-cyanide-v12-spectral-film
          upstream_hash="$(git show origin/cinema/curcumin-cyanide-v12-spectral-film:scripts/render-curcumin-v12.py | git hash-object --stdin)"
          if [ "$source_hash" != "$upstream_hash" ]; then
            echo "Newer renderer exists; skip stale binary export"
            exit 0
          fi
          git reset --hard origin/cinema/curcumin-cyanide-v12-spectral-film
          cp -a /tmp/curcumin-v12-render/. assets/films/series-v12-curcumin/
          git add assets/films/series-v12-curcumin/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Film 04 cinematic full-HD review master [curcumin-v12-output]"
          git push origin HEAD:cinema/curcumin-cyanide-v12-spectral-film
