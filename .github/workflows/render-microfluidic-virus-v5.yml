name: V5 respiratory virus microfluidics source-correct documentary
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/render-microfluidic-virus-v5.py
      - .github/workflows/render-microfluidic-virus-v5.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ruwaidix-unique-microfluidic-v5
  cancel-in-progress: false
jobs:
  microfluidic-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install free documentary engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-microfluidic-virus-v5.py
      - name: Reject missing or wrong-study evidence before rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          folder=Path("assets/films/source-figures/v4/microfluidic-virus")
          record=json.loads((folder/"source-provenance.json").read_text())
          original=folder/"microfluidic-virus-figure-01-source-page.jpg"
          assert record["doi"]=="10.1007/s42247-021-00169-7" and record["pmcid"]=="PMC7992628"
          assert record["original_figure"]=="Figure 1" and "Overview of microfluidic" in record["caption"]
          assert hashlib.sha256(original.read_bytes()).hexdigest()==record["sha256"]
          assert "review schematic" in record["editorial_note"]
          PY
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Download openly distributed voice model
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Encode eight science-specific chapters with only the matching paper's Figure 1
        run: python scripts/render-microfluidic-virus-v5.py
      - name: Check MP4/VTT and preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          mp4=Path("assets/films/series-v5/microfluidic-virus.mp4")
          j=json.loads(mp4.with_suffix(".json").read_text())
          assert j["sha256"]==hashlib.sha256(mp4.read_bytes()).hexdigest()
          assert j["doi"]=="10.1007/s42247-021-00169-7"
          assert len(j["chapters"])==8 and abs(j["duration_seconds"]-120)<.3
          assert mp4.with_suffix(".vtt").read_text().startswith("WEBVTT")
          assert Path("assets/films/series/microfluidic-virus.mp4").exists()
          codecs=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-of","json",str(mp4)]))
          assert {"h264","aac"}<={s["codec_name"] for s in codecs["streams"]}
          print("Source-correct review documentary MP4 and VTT validated")
          PY
      - name: Commit only isolated candidate MP4/VTT/manifest
        run: |
          git config user.name "Ruwaidix Evidence-Correct Cinematography"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v5/microfluidic-virus.mp4 assets/films/series-v5/microfluidic-virus.vtt assets/films/series-v5/microfluidic-virus.json
          if ! git diff --cached --quiet; then
            git commit -m "Render actual-2021-Figure-1 microfluidic V5 documentary with original detection motion"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
