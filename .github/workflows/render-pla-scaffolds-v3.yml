name: Distinct 2020 PLA scaffold study V3 source figure documentary
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/render-pla-scaffolds-v3.py
      - .github/workflows/render-pla-scaffolds-v3.yml
      - scripts/audit-new-v3-study-cuts.py
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ruwaidix-pla-scaffolds-2020-v3, cancel-in-progress: false}
jobs:
  original-research-scaffold-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-pla-scaffolds-v3.py
      - uses: actions/cache@v4
        with: {path: film-models, key: ruwaidix-kokoro-onnx-fp16-v1.1}
      - run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl -fL --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl -fL --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Render eight original 2020 scaffold-science episodes around verified figures
        run: python scripts/render-pla-scaffolds-v3.py
      - name: Check DOI source identity, exact figure SHA, VTT and actual video/audio codec
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path("assets/films/series-v3")
          stem="pla-scaffolds"
          film=root/(stem+".mp4")
          meta=json.loads((root/(stem+".json")).read_text())
          assert meta["doi"]=="10.1016/j.surfcoat.2020.126216"
          assert len(meta["source_pages"])==5
          for item in meta["source_pages"]:
            assert hashlib.sha256(Path(item["artifact"]).read_bytes()).hexdigest()==item["sha256"]
          assert meta["sha256"]==hashlib.sha256(film.read_bytes()).hexdigest()
          assert film.stat().st_size>700000
          assert abs(meta["duration_seconds"]-120)<.4
          assert root.joinpath(stem+".vtt").read_text().startswith("WEBVTT")
          assert Path("assets/films/series/pla-scaffolds.mp4").exists()
          x=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-of","json",str(film)]))
          assert {"h264","aac"}<={a["codec_name"] for a in x["streams"]}
          assert "NOT APPROVED" in meta["human_review"]
          print("2020 source-only scaffold science film is technically valid; human approval pending")
          PY
      - name: Inspect real encoded frames, original-asset SHA and complete source credits for this specific film
        run: python scripts/audit-new-v3-study-cuts.py --only pla-scaffolds
      - name: Commit independently; never replace the previous paper or any live film
        run: |
          git config user.name "Ruwaidix Scientific Materials Cinema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v3/pla-scaffolds.* assets/films/series-v3/qa/pla-scaffolds-contact.jpg assets/films/series-v3/qa/pla-scaffolds-contact.json
          if ! git diff --cached --quiet; then
            git commit -m "Render actual-2020-scaffold figure-backed eight-scene materials documentary"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              git push origin HEAD:"${{ github.ref_name }}"
            else
              git rebase --abort
              echo "Refusing to overwrite a concurrent authoritative movie"
              exit 1
            fi
          fi
