name: Source SHA V5 full-frame science film review
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/audit-pla-scaffolds-v5.py
      - assets/films/series-v5/*.mp4
      - .github/workflows/audit-pla-scaffolds-v5.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  full-frame-cinema-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - run: python scripts/audit-pla-scaffolds-v5.py
      - name: Commit actual decoded source-verified film frames
        run: |
          git config user.name "Ruwaidix scientific film frame review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v5/qa/
          if ! git diff --cached --quiet; then
            git commit -m "Show complete source-verified V5 shots without overlaying actual film frames"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
