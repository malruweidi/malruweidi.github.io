name: Film 13 | Intestinal barrier and immune differential cinema

on:
  push:
    branches:
      - cinema/gi-autoimmunity-v21-epithelial-world
    paths:
      - assets/films/series-v21-gi1/film.html
      - scripts/render-gi-v21.py
      - tests/gi-v21.test.py
      - .github/workflows/render-gi-v21.yml

permissions:
  contents: write

concurrency:
  group: single-film13-gi-v21-${{ github.ref }}
  cancel-in-progress: false

jobs:
  film13-review-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out observational 2022 open-access GI immunology chapter and laboratory context and preserved 84s narration
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible no-cost Chromium FFmpeg rendering stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check pillow playwright numpy soundfile
          python -m playwright install --with-deps chromium
      - name: Validate nonquantitative immune-pathway and chapter source integrity and 6 moving reproducible chapters
        run: |
          python -m py_compile scripts/render-gi-v21.py tests/gi-v21.test.py
          python scripts/render-gi-v21.py --validate-only
          python tests/gi-v21.test.py
      - name: Render full 84-second film at native 1920x1080 24fps
        run: python -u scripts/render-gi-v21.py
      - name: Independent check of source claims, encoded motion, captions and loudness
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess,re
          root=Path("assets/films/series-v21-gi1")
          master=root/"gi-autoimmunity-1.mp4"
          data=json.loads((root/"gi-autoimmunity-1.json").read_text())
          ff=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(master)]))
          assert abs(float(ff["format"]["duration"])-84)<.15
          assert {"video","audio"}<={x["codec_type"] for x in ff["streams"]}
          assert any(x.get("codec_name")=="h264" and x.get("width")==1920 and x.get("height")==1080 for x in ff["streams"])
          assert data["film_index"]==13 and data["source"]["doi"]=="10.5772/intechopen.106184"
          assert data["source"]["scope"].startswith("Narrative review")
          mechanisms=data["illustrated_mechanisms"]
          assert len(mechanisms)==5
          assert any("NOT generally categorized as classical autoimmune" in x["boundary"] for x in mechanisms)
          assert any("not a single autoantibody disease" in x["boundary"] for x in mechanisms)
          assert data["live_website_unchanged"] and data["older_film_masters_preserved"]
          assert hashlib.sha256(master.read_bytes()).hexdigest()==data["sha256"]
          for src in data["archival_images"]:
            assert hashlib.sha256(Path(src["path"]).read_bytes()).hexdigest()==src["sha256"]
          assert (root/"gi-autoimmunity-1.vtt").read_text().count("-->")==12
          assert (root/"gi-autoimmunity-1.contact.webp").stat().st_size>14000
          assert (root/"gi-autoimmunity-1.webp").stat().st_size>4000
          assert len(list(root.glob("chapter-??.jpg")))==6
          frames=subprocess.check_output(["ffmpeg","-v","error","-i",str(master),
            "-map","0:v:0","-an","-vf","fps=1","-f","framemd5","-"],text=True)
          hashes=[q.rsplit(",",1)[-1].strip() for q in frames.splitlines() if q and not q.startswith("#")]
          assert 83<=len(hashes)<=85,len(hashes)
          assert len(set(hashes))>=80,(len(set(hashes)),len(hashes))
          print("FILM13 VERIFIED VIDEO-ONLY TEMPORAL FRAMES",len(set(hashes)),"/",len(hashes))
          audio=subprocess.run(["ffmpeg","-hide_banner","-i",str(master),
            "-map","0:a:0","-filter_complex","ebur128=peak=true","-f","null","-"],
            capture_output=True,text=True)
          assert audio.returncode==0
          import re
          samples=[float(x) for x in re.findall(r"TPK:\s*([-+]?\d+(?:\.\d+)?)\s*dBFS",audio.stderr)]
          assert samples, "True-peak samples missing from EBU R128 measurement"
          worst=max(samples)
          assert worst <= -1.0, f"True peak over mastering ceiling: {worst:.1f} dBTP"
          print("FILM13 VERIFIED TRUE PEAK",worst,"dBTP")
          print("FILM13 EBU R128",audio.stderr[-1500:])
          PY
      - name: Commit verified review master to isolated branch and retain all existing films
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ruwaidix Research Cinema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          render_source_hash="$(git hash-object scripts/render-gi-v21.py)"
          mkdir -p /tmp/gi-v21-output
          cp -a assets/films/series-v21-gi1/. /tmp/gi-v21-output/
          git fetch origin cinema/gi-autoimmunity-v21-epithelial-world
          current_hash="$(git show origin/cinema/gi-autoimmunity-v21-epithelial-world:scripts/render-gi-v21.py | git hash-object --stdin)"
          if [ "$render_source_hash" != "$current_hash" ]; then
            echo "Newer source renderer exists; do not push a stale binary"; exit 0
          fi
          git reset --hard origin/cinema/gi-autoimmunity-v21-epithelial-world
          cp -a /tmp/gi-v21-output/. assets/films/series-v21-gi1/
          git add assets/films/series-v21-gi1/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Film 13: export original GI immune barrier world cinematic research review master"
          git push origin HEAD:cinema/gi-autoimmunity-v21-epithelial-world
