name: Ruwaidix Directors Cuts — test and preview
on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - assets/films/directors-cuts-v2.json
      - scripts/render-directors-cuts.py
      - tests/directors-cuts.test.cjs
      - .github/workflows/directors-cuts-preview.yml
  workflow_dispatch:
    inputs:
      film:
        description: Preview exactly one film
        required: true
        default: making-medicines-keep
        type: choice
        options:
          - two-materials-no-section
          - what-a-bubble-can-do
          - making-medicines-keep

permissions:
  contents: write
concurrency:
  group: ruwaidix-directors-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install pillow numpy soundfile
      - name: Validate scene provenance, scripts and original preservation
        run: |
          python -m py_compile scripts/render-directors-cuts.py
          node --test tests/directors-cuts.test.cjs
          python scripts/render-directors-cuts.py --validate-only
  rough-cut:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 85
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[v2-preview-output]')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free video rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-directors-kokoro-v1.1
      - name: Obtain open-source audition-only voice model
        run: |
          mkdir -p film-models
          test -s film-models/kokoro-v1.0.fp16.onnx || curl --fail --location --retry 3 -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          test -s film-models/voices-v1.0.bin || curl --fail --location --retry 3 -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Render one unapproved cinematic film in the preview folder
        env:
          CHOSEN_FILM: ${{ inputs.film || 'making-medicines-keep' }}
        run: |
          python scripts/render-directors-cuts.py --film "$CHOSEN_FILM" --voice-mode kokoro-preview --models film-models
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "assets/films/preview-v2/$CHOSEN_FILM-rough-cut.mp4"
      - name: Preserve rough cut on preview branch without public site edits
        if: github.ref == 'refs/heads/cinematic-remake-20261017'
        run: |
          git config user.name "Ruwaidix Rough Cut Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/preview-v2/
          if ! git diff --cached --quiet; then
            git commit -m "Unapproved cinematic pilot for editorial review [v2-preview-output]"
            git fetch origin cinematic-remake-20261017
            git rebase FETCH_HEAD
            git push origin HEAD:cinematic-remake-20261017
          fi
