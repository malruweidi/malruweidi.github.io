name: Stories mobile reflow diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-reflow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Check browser executable
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Serve static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ruwaidix-audit-http.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/stories.html >/dev/null && break; sleep .5; done
      - name: Diagnose actual Stories EN/AR reflow at mobile widths
        run: node scripts/audit-stories-mobile-reflow.cjs
