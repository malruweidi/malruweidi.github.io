name: Film 07 — free Kokoro narrated research review
on:
  push:
    branches: [film07-heart-video-source-20261022]
    paths: ['.github/workflows/film07-kokoro-review.yml']
permissions:
  contents: read
jobs:
  narrator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open source Kokoro narrator
        run: |
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
      - name: Download free Kokoro weights
        run: |
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s model/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Render one complete voice per film shot
        run: |
          python - <<'PY'
          from kokoro_onnx import Kokoro
          import numpy as np,soundfile as sf,json
          from pathlib import Path
          sentences=["An ultrasound film shows a heart in motion. Before birth, that motion can reveal how the chambers are developing.","Our pilot study examined fetal echocardiograms from nine healthy pregnancies and thirteen with hypoplastic left heart syndrome.","The published figures show how raw ultrasound frames were cleaned and cropped. Those images are research data, not invented examples.","A heartbeat is a sequence. The study separated videos by cardiac cycle and prepared them as inputs for machine learning.","Convolutional networks extracted features from the frames. Long short-term memory networks modeled information across the sequence.","Five pretrained architectures were evaluated: MobileNet, two ResNets, DenseNet, and GoogLeNet. The strongest candidates informed a stacked model.","The stacking framework combined three models. Here is the original architecture, alongside our explanatory animation of how predictions are assembled.","These are genuine images from the article: healthy and hypoplastic left-heart ultrasound examples, displayed without invented abnormalities.","Across five-fold cross-validation, the authors reported approximately ninety-point-five percent accuracy. The pilot's cohort was small.","The comparison tables also report sensitivity, precision, specificity, and F-one score. A single accuracy number cannot replace those details.","Patient selection, validation design, and missed cases matter enormously before an algorithm can be considered for prenatal clinical use.","The promise is real, but limited: a research model found patterns in this pilot dataset. It was not validated as an autonomous diagnosis."]
          voice=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          sr=None;mix=None;events=[]
          for i,s in enumerate(sentences):
            for speed in (1.05,1.11,1.17,1.23,1.28):
              samples,rate=voice.create(s,voice='af_bella',speed=speed,lang='en-us')
              samples=np.asarray(samples,dtype=np.float32).reshape(-1)
              if len(samples)/rate<=9.65:break
            duration=len(samples)/rate
            if duration>9.65:raise RuntimeError(f'Scene {i+1} exceeded 9.65 sec; shorten text without truncating voice')
            if sr is None:sr=rate;mix=np.zeros(sr*120,dtype=np.float32)
            assert rate==sr
            t0=10*i+.2;off=round(t0*sr)
            mix[off:off+len(samples)]+=samples
            sf.write(f'shot_{i+1:02}.wav',samples,sr,subtype='PCM_16')
            events.append(dict(scene=i+1,start=t0,end=t0+duration,text=s,speed=speed))
            print('SHOT',i+1,'voice seconds',round(duration,2),'speed',speed,flush=True)
          peak=float(np.max(np.abs(mix)));assert peak>.02
          sf.write('Film_07_Narration.wav',mix*.82/peak,sr,subtype='PCM_16')
          Path('Film_07_Timings.json').write_text(json.dumps(dict(voice='Kokoro ONNX af_bella',source='Open source; separate human audition required',events=events),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: film07-open-voice-audition
          path: |
            Film_07_Narration.wav
            Film_07_Timings.json
            shot_*.wav
          retention-days: 7
