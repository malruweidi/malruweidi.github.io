name: Film09 open neural narration
on:
  push:
    branches: [film09-pla-scaffolds-narration-20261023]
    paths: ['.github/workflows/film09-kokoro.yml']
permissions:
  contents: read
jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free speech model
        run: |
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
      - name: Get open voice weights
        run: |
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Produce timed complete narration
        run: |
          python - <<'PY'
          import json,numpy as np,soundfile as sf
          from pathlib import Path
          from kokoro_onnx import Kokoro
          scripts=["An electrospun scaffold can look unchanged until we examine the surface. In this study, the interface of polylactic acid fibers was deliberately modified.","Electrospinning creates a porous web of fine polymer fibers. This moving illustration explains the process; it is not footage from the experiment.","The original paper shows the prepared PLA fibers. Their bulk polymer remains the scaffold, but surface chemistry controls first contact.","Thirty seconds of radio-frequency plasma increased wettability and created reactive surface species for subsequent grafting.","Two naturally occurring molecules were explored: L ascorbic acid and fumaric acid, grafted onto activated PLA fiber surfaces.","Infrared spectroscopy tested chemical changes after grafting. The published bands are evidence of material modification, not a clinical effect.","Electron and atomic force microscopy revealed changes in fiber topography. These are original scientific images from the experiment.","The researchers also tested nanomechanical behavior. Some processing conditions altered stiffness, so performance involves trade-offs.","Antimicrobial tests were conducted with Staphylococcus aureus and Escherichia coli in laboratory conditions, not implanted patients.","The modified scaffolds showed improved antimicrobial activity in those assays. The extent depends on treatment and material formulation.","But these tests cannot by themselves establish safety, long-term tissue integration, or prevention of infection in patients.","A scaffold has many properties. Surface grafting can change its first interaction with the world, while its deeper biological performance remains to be established."]
          engine=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          out=None;sr=None;events=[]
          for i,s in enumerate(scripts):
            for speed in (1.07,1.13,1.19,1.25):
              a,rate=engine.create(s,voice='af_bella',speed=speed,lang='en-us')
              a=np.asarray(a,dtype=np.float32).ravel()
              if len(a)/rate<=9.6:break
            dur=len(a)/rate
            if dur>9.6:raise RuntimeError(f'Shot {i+1} spoken words do not fit')
            if sr is None:sr=rate;out=np.zeros(sr*120,dtype=np.float32)
            start=i*10+.16
            out[int(start*sr):int(start*sr)+len(a)]+=a
            sf.write(f'shot_{i+1:02}.wav',a,sr)
            events.append(dict(shot=i+1,start=start,end=start+dur,text=s,speed=speed))
            print('Rendered voice',i+1,dur,flush=True)
          out*=.80/max(0.01,float(np.max(np.abs(out))))
          sf.write('Film_09_Voice.wav',out,sr)
          Path('Film_09_Voice_Timing.json').write_text(json.dumps(events,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: film09-neural-voice
          path: |
            Film_09_Voice.wav
            Film_09_Voice_Timing.json
          retention-days: 7