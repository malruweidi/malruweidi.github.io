name: PLA-film V3 — verified original study documentary
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/render-pla-grafting-v3.py
      - .github/workflows/render-pla-grafting-v3.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-pla-film-evidence-v3
  cancel-in-progress: false
jobs:
  source-grounded-film:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare open scientific film toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-pla-grafting-v3.py
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Ensure open Kokoro speaker models
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Compose 8 separate primary-publication experimental scenes
        run: python scripts/render-pla-grafting-v3.py
      - name: Verify the exact-DOI originals and the independent video master
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          path=Path("assets/films/series-v3/pla-grafting.mp4")
          data=json.loads(path.with_suffix(".json").read_text())
          assert data["doi"]=="10.3390/polym13213717"
          assert data["sha256"]==hashlib.sha256(path.read_bytes()).hexdigest()
          assert len(data["figures"])==3 and len(data["chapters"])==8
          assert {f["figure_number"] for f in data["figures"]}=={1,4,8}
          assert abs(data["duration"]-120)<.4
          assert "NOT YET APPROVED" in data["human_review"]
          assert path.with_suffix(".vtt").read_text().startswith("WEBVTT")
          assert Path("assets/films/series/pla-grafting.mp4").exists()
          print("Independent 2021 PLA-film source-correct narrative encoded.")
          PY
      - name: Preserve all originals and commit the alternative source-locked film
        run: |
          git config user.name "Ruwaidix Experimental Cinema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v3/pla-grafting.*
          if ! git diff --cached --quiet; then
            git commit -m "Render exact DOI-based PLA surface science film with genuine published figures and controls"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
