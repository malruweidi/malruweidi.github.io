name: Film 02 — open-source narration audition
on:
  push:
    branches: [film02-kokoro-audition-20261022]
    paths: ['.github/workflows/film02-kokoro-audition.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free audio engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
      - name: Get open-source voice files
        run: |
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s model/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Synthesize six timed chapters without trimming speech
        run: |
          python - <<'PY'
          import json,numpy as np,soundfile as sf
          from pathlib import Path
          from kokoro_onnx import Kokoro
          texts=["Before a zebrafish brain carries blood, its first vessels are already taking shape. Along the inner walls are tiny projections called primary cilia. The researchers asked what these structures were doing before flow arrived.","We used fluorescent zebrafish lines to examine developing cerebral vessels. In the published microscopy, magenta marks endothelial membranes, while green highlights cilia. These are real laboratory images, not computer generated blood vessels.","At twenty four hours after fertilization, cilia clustered near developing intravascular spaces. Time lapse observations revealed movements of cilia even before cranial circulation. This was an important clue that their role was not limited to sensing blood flow.","To test that idea, cardiac troponin was knocked down, creating embryos without a contracting heart. The early head vessel cilia remained. Later, cilia were also seen during angiogenic sprouting and new vessel connections.","The team also disrupted genes necessary for ciliary transport. Cranial hemorrhages increased. In another experiment, raised temperature increased circulatory shear stress and was associated with loss of endothelial cilia and vascular instability.","The evidence points to a role for primary cilia in both early vessel formation and later vessel stability. But the molecular pathway linking cilia to vessel integrity was not established. That question remains for further experiments."]
          voice=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          sr=None
          mix=None
          events=[]
          for i,txt in enumerate(texts):
              arr,rate=voice.create(txt,voice='af_bella',speed=1.12,lang='en-us')
              arr=np.asarray(arr,dtype=np.float32).flatten()
              if sr is None:
                  sr=rate;mix=np.zeros(round(120*sr),dtype=np.float32)
              assert sr==rate
              d=len(arr)/sr
              print('CHAPTER',i+1,'speech seconds:',round(d,2),flush=True)
              if d>19.25:raise ValueError('VOICE TOO LONG FOR CHAPTER '+str(i+1))
              start=round((i*20+0.4)*sr)
              mix[start:start+len(arr)]+=arr
              sf.write(f'scene-{i+1:02}.wav',arr,sr,subtype='PCM_16')
              events.append(dict(start=i*20+0.4,end=i*20+0.4+d,chapter=i+1,text=txt))
          peak=float(np.max(np.abs(mix)))
          assert 0.01<peak<2.0
          mix*=0.80/peak
          sf.write('Film_02_Kokoro_Narration.wav',mix,sr,subtype='PCM_16')
          Path('Film_02_Narration_Timings.json').write_text(json.dumps(dict(voice='af_bella',source='Kokoro ONNX; open-source; synthetic; requires human audition',events=events),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: film02-kokoro-voice
          path: |
            Film_02_Kokoro_Narration.wav
            Film_02_Narration_Timings.json
            scene-*.wav
          retention-days: 7
