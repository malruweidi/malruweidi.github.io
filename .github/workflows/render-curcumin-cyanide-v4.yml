name: Curcumin cyanide V4 enlarged-original-panels retake
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/render-curcumin-cyanide-v4.py
      - .github/workflows/render-curcumin-cyanide-v4.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ruwaidix-curcumin-v4-exact-source, cancel-in-progress: false}
jobs:
  source-specific-cyanide-film:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Open-source encoding and synthetic speech dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-curcumin-cyanide-v4.py
      - uses: actions/cache@v4
        with: {path: film-models, key: ruwaidix-kokoro-onnx-fp16-v1.1}
      - name: Download public Kokoro ONNX narrator only if absent
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl -fL --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl -fL --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Render 8 study-specific scenes around actual owner-archived 2019 figure
        run: python scripts/render-curcumin-cyanide-v4.py
      - name: Check original source hash, study identifiers and film playback streams
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          d=Path("assets/films/series-v4")
          stem="curcumin-cyanide"
          film=d/(stem+".mp4")
          info=json.loads((d/(stem+".json")).read_text())
          assert info["primary_doi"]=="10.1039/C9AY01557D"
          assert info["no_stock_or_crossstudy_figures"]
          assert info["original_2019_spectra_unchanged"]
          assert info["sha256"]==hashlib.sha256(film.read_bytes()).hexdigest()
          assert film.stat().st_size>1_000_000
          assert abs(info["duration_seconds"]-120)<.38
          assert len(info["chapters"])==8
          assert (d/(stem+".vtt")).read_text().startswith("WEBVTT")
          assert Path("assets/films/series/curcumin-cyanide.mp4").exists()
          codecs=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-of","json",str(film)]))
          assert {"h264","aac"}<={x["codec_name"] for x in codecs["streams"]}
          print("Authentic experimental panel + V3 encoded cyanide documentary validated; human film audition outstanding")
          PY
      - name: Add independent V3 cut only; do not auto-replace live site
        run: |
          git config user.name "Ruwaidix Study-Specific Film Production"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v4/curcumin-cyanide.*
          if ! git diff --cached --quiet; then
            git commit -m "Create V4 curcumin source-panel-first retake with larger true spectral and color figure crops"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              git push origin HEAD:"${{ github.ref_name }}"
            else
              git rebase --abort
              echo "Prevent binary corruption from another concurrent render"
              exit 1
            fi
          fi
