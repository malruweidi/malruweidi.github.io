name: Film 09 — free Kokoro PLA-scaffold narration review
on:
  push:
    branches: [film09-pla-scaffold-kokoro-review-20261023]
    paths: ['.github/workflows/film09-kokoro-audition.yml']
permissions:
  contents: read
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install zero-cost Kokoro
        run: |
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
      - name: Download open-licensed model
        run: |
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s model/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Render the 12 complete source-accurate passages
        run: |
          python - <<'PY'
          import json,numpy as np,soundfile as sf
          from pathlib import Path
          from kokoro_onnx import Kokoro
          text=["A tissue scaffold begins as a network of fibers. But its surface must meet cells, moisture, and microorganisms.","Electrospinning stretches a polymer solution into fine threads, creating a porous PLA mat with a large exposed area.","The researchers varied PLA concentration. The ten-percent solution produced suitable fiber morphology for subsequent surface treatment.","A brief radiofrequency oxygen plasma treatment activated the outer fibers. Thirty seconds gave the selected surface conditions.","The activated mats were grafted with ascorbic acid or fumaric acid. The bulk PLA remained the underlying material.","Contact-angle tests showed that plasma changed wettability. These curves are measured samples, not a water droplet simulation.","Infrared spectroscopy helped assess chemical changes following grafting. A spectral feature alone cannot establish medical performance.","Real electron microscopy shows the untreated fibers, the plasma-treated surface, and the acid-grafted texture.","Atomic-force microscopy characterized topography and mechanical response on different fiber mats. These images are original measurements.","The antimicrobial tests used two bacterial species: Staphylococcus aureus and Escherichia coli, under laboratory test conditions.","The grafted samples scored zero for detectable bacterial growth in that assay; untreated mats were overgrown. These are not patient outcomes.","A scaffold must survive its biological environment. Antimicrobial results are promising, but in-vivo safety and effectiveness need separate evidence."]
          model=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          sr=None;out=None;events=[]
          for i,s in enumerate(text):
            for speed in (1.08,1.13,1.18,1.23,1.28):
              wav,rate=model.create(s,voice='af_bella',speed=speed,lang='en-us')
              wav=np.asarray(wav,dtype=np.float32).flatten()
              if len(wav)/rate<=9.55:break
            duration=len(wav)/rate
            if duration>9.55:raise RuntimeError('Narration overrun at shot '+str(i+1)+': '+str(duration))
            if sr is None:sr=rate;out=np.zeros(sr*120,dtype=np.float32)
            assert sr==rate
            start=i*10+0.2
            at=round(start*sr)
            out[at:at+len(wav)]+=wav
            sf.write(f'chapter-{i+1:02}.wav',wav,sr,subtype='PCM_16')
            events.append(dict(scene=i+1,start=start,end=start+duration,text=s,speed=speed))
            print('CHAPTER',i+1,'duration',round(duration,2),flush=True)
          peak=float(np.max(np.abs(out)));assert .01<peak<3
          sf.write('Film_09_Narration.wav',out*.80/peak,sr,subtype='PCM_16')
          Path('Film_09_Timings.json').write_text(json.dumps(dict(engine='Kokoro ONNX af_bella',status='voice audition required',events=events),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: film09-pla-scaffold-narration
          path: |
            Film_09_Narration.wav
            Film_09_Timings.json
            chapter-*.wav
          retention-days: 7
