name: Film 09 / open Kokoro voice audition
on:
  push:
    branches: [film09-cinematic-narration-review-20261023]
    paths: ['.github/workflows/film09-kokoro-audition.yml']
permissions:
  contents: read
jobs:
  narrator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open neural voice engine
        run: |
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
      - name: Obtain Apache-2.0 Kokoro weights
        run: |
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s model/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Synthesize twelve passages without clipping
        run: |
          python - <<'PY'
          import numpy as np, soundfile as sf, json
          from pathlib import Path
          from kokoro_onnx import Kokoro
          segments=["The scaffold is not just a shape. Living tissue meets its fibres, surfaces, and whatever grows upon them.","Electrospinning draws polylactic acid into a network of thin fibres. The original paper documents their measured surface morphology.","Radio frequency plasma activates the fibres' outer surfaces. Thirty seconds proved a useful treatment interval in these experiments.","Plasma creates reactive sites on the polymer surface. This animation represents the proposed chemistry, not a filmed molecular event.","The researchers grafted ascorbic acid or fumaric acid after plasma exposure. The bulk material and its interface need separate evaluation.","Water contact angle fell after treatment. A smaller angle tells us wetting changed, but it cannot establish biocompatibility.","Here are the study's actual scanning electron micrographs: untreated, plasma treated, and acid-grafted PLA fibres. Surface texture changes visibly.","Atomic-force microscopy offered another view of topography. These are real published measurements, displayed with their scale information.","Spectroscopic analysis supported the chemical changes. Multiple methods mattered because microscopy alone cannot identify a covalent graft.","Antibacterial tests examined Staphylococcus aureus and Escherichia coli. Grafted fibre mats performed better than untreated controls in this assay.","Better laboratory antibacterial activity does not establish a safe implant. Tissue compatibility, durability, and clinical performance remain unproven here.","The larger lesson is at the boundary: a familiar polymer can meet its environment differently when its surface chemistry changes."]
          engine=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          sr=None; complete=None; events=[]
          for i,txt in enumerate(segments):
            for speed in (1.05,1.10,1.15,1.20,1.25,1.30):
              audio,rate=engine.create(txt,voice='af_bella',speed=speed,lang='en-us')
              audio=np.asarray(audio,dtype=np.float32).reshape(-1)
              if len(audio)/rate<=9.60: break
            dur=len(audio)/rate
            if dur>9.60: raise RuntimeError(f'Scene {i+1} overrun {dur:.2f}. Edit script; never truncate.')
            if sr is None: sr=rate;complete=np.zeros(120*sr,dtype=np.float32)
            assert sr==rate
            start=i*10+.22
            complete[round(start*sr):round(start*sr)+len(audio)]+=audio
            sf.write(f'chapter_{i+1:02d}.wav',audio,sr,subtype='PCM_16')
            events.append(dict(scene=i+1,start=start,end=start+dur,script=txt,speed=speed))
            print(i+1,round(dur,2),speed,flush=True)
          peak=float(np.max(np.abs(complete))); assert peak>.02
          sf.write('Film_09_Kokoro_Voice.wav',complete*.82/peak,sr,subtype='PCM_16')
          Path('Film_09_Narration_Timings.json').write_text(json.dumps({'engine':'Kokoro ONNX af_bella','status':'requires listening and pronunciation approval','events':events},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: film09-free-kokoro-voice
          path: |
            Film_09_Kokoro_Voice.wav
            Film_09_Narration_Timings.json
            chapter_*.wav
          retention-days: 7
