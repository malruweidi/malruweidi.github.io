name: ACE2 V3 original source molecular documentary
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/render-ace2-forms-v3.py
      - .github/workflows/render-ace2-forms-v3.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ruwaidix-ace2-original-v3
  cancel-in-progress: false
jobs:
  movie:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-ace2-forms-v3.py
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Download openly distributed speech model
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl -fL --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl -fL --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Render actual crystal coordinates and original RAAS diagram
        run: python scripts/render-ace2-forms-v3.py
      - name: Check original source DOI, PDB, subtitles and retained first edition
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("assets/films/series-v3/ace2-forms.mp4")
          d=json.loads(p.with_suffix(".json").read_text())
          assert d["source_pdb"]=="6M0J" and d["article_doi"]=="10.3390/ijms22136703"
          assert len(d["source_figures"])==1 and d["source_figures"][0]["figure_number"]==3
          assert abs(d["duration_seconds"]-120)<.36
          assert hashlib.sha256(p.read_bytes()).hexdigest()==d["sha256"]
          assert p.with_suffix(".vtt").read_text().startswith("WEBVTT")
          assert "NOT YET APPROVED" in d["human_review"]
          assert Path("assets/films/series/ace2-forms.mp4").exists()
          print("Source-bound structural documentary ready for editorial review.")
          PY
      - name: Save alternative source-grounded movie only
        run: |
          git config user.name "Ruwaidix Molecular Documentary"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v3/ace2-forms.*
          if ! git diff --cached --quiet; then
            git commit -m "Render exact 6M0J ACE2 film and original RAAS figure with primary sources"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then git push origin HEAD:"${{ github.ref_name }}"; else git rebase --abort; exit 1; fi
          fi
