name: Film 01 / free Kokoro narration audition
on:
  push:
    branches: [film01-kokoro-audition-20261022]
    paths: ['.github/workflows/film01-kokoro-audition.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narrator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open-source Kokoro dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
      - name: Download Apache-2.0 Kokoro voice weights
        run: |
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s model/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Render six narration chapters without time stretching
        run: |
          python - <<'PY'
          import json,numpy as np,soundfile as sf
          from pathlib import Path
          from kokoro_onnx import Kokoro
          lines=[
          (0,20,"An airway can reopen, and still be injured. When air moves through a liquid-filled airway, its advancing boundary may stress the epithelial cells. We wanted to test that hidden mechanical event."),
          (20,40,"Here is our actual experimental apparatus, published in the paper. Rat alveolar epithelial cells were grown in a parallel-plate chamber. We moved one air bubble across the cell layer under controlled conditions."),
          (40,62,"These are the study's real fluorescence micrographs. Green and red staining helped distinguish surviving from dead cells after exposure. They are measurements from cultured cells, not images from a patient's lung."),
          (62,84,"The measured cell death after bubble exposure was about fifty-five percent. Pretreatment with dexamethasone lowered the reported average to about fifteen percent; with trans-dehydroandrosterone, to about sixteen percent. These results are in vitro."),
          (84,103,"Actin staining provided another window into the response. The treatments altered cytoskeletal organisation, suggesting that the cells' mechanical state may have influenced how they tolerated the moving interface."),
          (103,120,"Atomic-force microscopy provided additional evidence about cell mechanics. But a single bubble over a cell culture is not a ventilated patient. Clinical protection remains a question for future research.")]
          model=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          clips=[]; sr=None; events=[]
          for i,(start,end,txt) in enumerate(lines,1):
            samples,rate=model.create(txt,voice='af_bella',speed=1.06,lang='en-us')
            arr=np.asarray(samples,dtype=np.float32).reshape(-1)
            if sr is None:sr=rate
            assert rate==sr
            dur=len(arr)/sr
            print(f'VOICE {i}: {dur:.2f}s / {end-start:.1f}s available')
            if dur>end-start-1.3:raise RuntimeError(f'Chapter {i} speech overflows picture chapter; revise script, do not truncate')
            sf.write(f'chapter_{i:02}.wav',arr,sr)
            clips.append(arr);events.append(dict(start=start+0.6,end=start+0.6+dur,words=txt,chapter=i))
          mix=np.zeros(120*sr,dtype=np.float32)
          for e,a in zip(events,clips):
            off=round(e['start']*sr)
            mix[off:off+len(a)]+=a
          peak=float(np.max(np.abs(mix)))
          assert 0.01<peak<3.0
          mix*=0.79/peak
          sf.write('Film_01_Kokoro_Narration.wav',mix,sr,subtype='PCM_16')
          Path('Film_01_Narration_Provenance.json').write_text(json.dumps(dict(voice='Kokoro ONNX af_bella',license='Apache-2.0 model / MIT software',engine='kokoro-onnx',review_status='AUDITION REQUIRED — not release-approved',events=events),indent=2))
          print('SPEECH FILE:',Path('Film_01_Kokoro_Narration.wav').stat().st_size,'bytes')
          PY
      - name: Technical speech checks
        run: |
          ffprobe -v error -show_entries format=duration:stream=sample_rate,channels -of default=noprint_wrappers=1 Film_01_Kokoro_Narration.wav
          ffmpeg -hide_banner -nostats -i Film_01_Kokoro_Narration.wav -af volumedetect -f null - 2>&1 | tail -12
      - uses: actions/upload-artifact@v4
        with:
          name: film01-kokoro-voice-audition
          path: |
            Film_01_Kokoro_Narration.wav
            Film_01_Narration_Provenance.json
            chapter_*.wav
          retention-days: 7
