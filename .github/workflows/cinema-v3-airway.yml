name: Cinema V3 — genuine pulmonary primary experiment documentary
on:
  push:
    branches: [cinema-v3-evidence-first]
    paths:
      - scripts/render-cinema-v3-airway.py
      - assets/films/v3/airway-reopening.storyboard.json
      - .github/workflows/cinema-v3-airway.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cinema-v3-airway-primary-science
  cancel-in-progress: false
jobs:
  real-experiment-film:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source film compositor and scholarly typography
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy soundfile kokoro-onnx
      - name: Confirm actual 2021 research image and precise study source
        run: |
          python -m py_compile scripts/render-cinema-v3-history.py scripts/render-cinema-v3-airway.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("assets/films/v3/airway-reopening.storyboard.json").read_text())
          assert d["primary_paper"]["doi"]=="10.1152/japplphysiol.00574.2020"
          assert d["verified_figures"][0]["figure"]=="Figure 1, panels A–D"
          assert Path(d["verified_figures"][0]["image"]).is_file()
          assert len(d["scenes"])==8
          assert abs(d["quoted_numbers"]["bubble_control"]["mean"]-54.7)<.01
          PY
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-v3-kokoro-fp16-v1.1
      - name: Download openly distributed narrator if absent
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Render eight topic-specific documentary shots
        run: python scripts/render-cinema-v3-airway.py
      - name: Verify actually encoded MP4, original-image metadata, subtitles and runtime
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          p=Path("assets/films/v3/rendered")
          f=p/"airway-reopening-v3.mp4"
          meta=json.loads((p/"airway-reopening-v3.json").read_text())
          assert f.is_file() and f.stat().st_size>900000
          assert meta["sha256"]==hashlib.sha256(f.read_bytes()).hexdigest()
          assert meta["source_figure"][0]["figure"]=="Figure 1, panels A–D"
          cap=(p/"airway-reopening-v3.vtt").read_text()
          assert cap.startswith("WEBVTT")
          assert cap.count(" --> ")>15
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(f)]))
          assert abs(float(info["format"]["duration"])-128)<.3
          assert {"audio","video"} <= set(v["codec_type"] for v in info["streams"])
          print("Airway source-grounded draft validated",meta["sha256"])
          PY
      - name: Publish only a reversible review cut on V3 branch
        run: |
          git config user.name "Ruwaidix Source Critical Film Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/v3/rendered/
          if ! git diff --cached --quiet; then
            git commit -m "Add original-study pulmonary injury film V3 with real primary-paper figure and values"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
