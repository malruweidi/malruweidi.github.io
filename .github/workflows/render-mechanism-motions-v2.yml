name: Ruwaidix original scientific cinema motion plates
on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - scripts/render-mechanism-motions-v2.py
      - .github/workflows/render-mechanism-motions-v2.yml
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: ruwaidix-science-motion-plates
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local open-source animation stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check pillow
      - name: Validate source disclosure and output dimensions
        run: |
          python -m py_compile scripts/render-mechanism-motions-v2.py
          python scripts/render-mechanism-motions-v2.py --validate-only
      - name: Make four original 12-second motion plates
        run: python scripts/render-mechanism-motions-v2.py --seconds 12
      - name: Audit silent motion files and their scientific disclosures
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          folder=Path('assets/films/motion-v2')
          d=json.loads((folder/'motion-source-manifest.json').read_text())
          assert len(d['clips'])==4
          for c in d['clips']:
              assert 'not' in c['disclosure'].lower() or 'does not' in c['disclosure'].lower()
              p=folder/c['filename']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==c['sha256']
              assert not c['public_release_approved']
              m=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',str(p)]))
              assert len(m['streams'])==1 and m['streams'][0]['codec_type']=='video'
          PY
      - name: Save never-published motion inserts on protected film-edit branch
        run: |
          git config user.name "Ruwaidix Motion Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/motion-v2/
          if ! git diff --cached --quiet; then
            git commit -m "Four original silent scientific reconstruction shots [v2-motion-output]"
            done_push=false
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin cinematic-remake-20261017
              git rebase FETCH_HEAD
              if git push origin HEAD:cinematic-remake-20261017; then done_push=true; break; fi
              sleep "$((attempt * 2))"
            done
            if [ "$done_push" != true ]; then echo "Failed to save output after reconciliations" >&2; exit 1; fi
          fi
