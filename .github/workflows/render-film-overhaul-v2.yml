name: Ruwaidix film overhaul v2 (open-source)
on:
  push:
    branches:
      - film-remake-20261017
      - main
    paths:
      - scripts/film-overhaul-motion.py
      - scripts/remaster-publication-series.py
      - assets/films/remake-direction.json
      - .github/workflows/render-film-overhaul-v2.yml
      - scripts/make-film-qa-contact-sheets.py
      - scripts/normalize-film-captions.py
      - tests/film-overhaul-v2.test.cjs
      - film-studio.html
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ruwaidix-remake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render-film-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source media and scientific drawing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy soundfile kokoro-onnx cairosvg
      - name: Validate source-bound editorial directions and preserved archive
        run: |
          python -m py_compile scripts/remaster-publication-series.py scripts/film-overhaul-motion.py
          python scripts/remaster-publication-series.py --validate-only
          node --test tests/film-overhaul-v2.test.cjs
          node --test tests/publication-film-series.test.cjs
      - name: Cache open Kokoro ONNX voice files
        uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Download open public narrator model
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
          test "$(stat -c%s film-models/voices-v1.0.bin)" -gt 1000000
      - name: Render next six fully sourced motion remakes
        run: python scripts/remaster-publication-series.py --missing-only --limit 6
      - name: Enforce mobile-readable timed subtitle cues
        run: python scripts/normalize-film-captions.py --collection series-v2
      - name: Confirm codecs, captions and exact release provenance
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          p=Path("assets/films/series-v2")
          for v in p.glob("*.mp4"):
              meta=json.loads(v.with_suffix(".json").read_text())
              assert meta["edition"]=="cinematic-v2"
              assert meta["sha256"]==hashlib.sha256(v.read_bytes()).hexdigest()
              assert len(meta["animated_scene_ids"])>=1
              assert v.with_suffix(".vtt").read_text().startswith("WEBVTT")
              data=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","json",str(v)]))
              assert abs(float(data["format"]["duration"])-84)<.3,v
              print(v,meta["animated_scene_ids"])
          PY
      - name: Produce proof-of-render frame contact sheets for editorial review
        run: python scripts/make-film-qa-contact-sheets.py --collection series-v2
      - name: Preserve old films and commit only alternative v2 releases
        run: |
          git config user.name "Ruwaidix Open Film Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v2/
          if ! git diff --cached --quiet; then
            git commit -m "Add separately preserved scientific-motion film remakes [v2-output]"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Continue remaining films in the source-preserving review branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout --force -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
          count="$(python scripts/remaster-publication-series.py --remaining-count | tail -n 1)"
          echo "V2 films still to render: $count"
          if [ "$count" -gt 0 ]; then
            gh workflow run render-film-overhaul-v2.yml --ref "${{ github.ref_name }}"
          fi
