name: Source-hashed V4 documentary frame audit
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/audit-all-v4-films.py
      - assets/films/series-v4/*.mp4
      - assets/films/series-v4/*.json
      - .github/workflows/audit-all-v4-films.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-v4-frame-sheets
  cancel-in-progress: false
jobs:
  validate-actual-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - name: Decode all five V4 films and compare source manifests to actual bytes
        run: python scripts/audit-all-v4-films.py
      - name: Commit only images and SHA metadata
        run: |
          git config user.name "Ruwaidix Scientific Film QC"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v4/qa/
          if ! git diff --cached --quiet; then
            git commit -m "Review actual encoded V4 frames across historical and scientific film cuts"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
