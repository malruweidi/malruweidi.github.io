name: Ruwaidix publication film remakes V6
on:
  push:
    branches: [main]
    paths:
      - scripts/film-art-direction-v6.py
      - scripts/render-publication-series.py
      - .github/workflows/render-publication-v6.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: v6-film-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  remake:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open-source production dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx cairosvg
      - name: Verify 35 individual scientific art directions and registered sources
        run: |
          python -m py_compile scripts/render-documentary.py scripts/render-publication-series.py scripts/film-art-direction-v6.py
          python scripts/render-publication-series.py --edition-v6 --skip-v5 --validate-only
          python - <<'PY'
          import importlib.util,tempfile,hashlib
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("film_art","scripts/film-art-direction-v6.py")
          art=importlib.util.module_from_spec(spec);spec.loader.exec_module(art)
          assert len(art.MODE)==35
          with tempfile.TemporaryDirectory() as directory:
              hashes=[]
              for slug in art.MODE:
                  path=art.concept_image(slug,{"id":"02","title":"EVIDENCE AND ITS LIMITS"},Path(directory))
                  assert path.stat().st_size>10000
                  hashes.append(hashlib.sha256(path.read_bytes()).hexdigest())
              assert len(set(hashes))==35
          print("All 35 subject-specific concepts successfully rendered")
          PY
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Local open-source Kokoro narration model
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl -fLsS --retry 3 -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl -fLsS --retry 3 -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Render next three missing films; keep existing editions untouched
        run: python scripts/render-publication-series.py --edition-v6 --skip-v5 --models film-models --missing-only --limit 3
      - name: Validate videos, audible streams, captions and source maps
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          films=list(Path("assets/films/series-v6").glob("*.mp4"))
          assert films
          for f in films:
              assert f.stat().st_size>100000 and f.open("rb").read(8)[4:8]==b"ftyp"
              streams=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-of","json",str(f)]))["streams"]
              assert {s["codec_type"] for s in streams}>={"video","audio"}
              assert f.with_suffix(".vtt").read_text().count("-->")>=10
              metadata=json.loads(f.with_suffix(".json").read_text())
              assert len(metadata["scene_provenance"])==6
              assert all(not s["image"].startswith("/tmp/") for s in metadata["scene_provenance"])
          print("Validated",len(films),"MP4 remakes")
          PY
      - name: Commit real films and their subtitles to website
        run: |
          git config user.name "Ruwaidix Scientific Film Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v6/*.mp4 assets/films/series-v6/*.vtt assets/films/series-v6/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish revised source-screened research films [v6-output]"
            git fetch origin ${{ github.ref_name }}
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Continue only while missing films remain
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout --force -B main origin/main
          count="$(python scripts/render-publication-series.py --edition-v6 --skip-v5 --remaining-count | tail -n 1)"
          echo "Unrendered films: $count"
          if [ "$count" -gt 0 ]; then
            gh workflow run render-publication-v6.yml --ref main
          fi
