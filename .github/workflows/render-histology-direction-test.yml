name: Histology Cinema Directing Proof
on:
  push:
    branches: [cinema-rebuild-audit-20261017]
    paths:
      - scripts/render-histology-direction-test.py
      - .github/workflows/render-histology-direction-test.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: histology-test-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[histology-test-output]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare local archival director's-cut tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile
      - name: Render real archive-based forty-second proof
        run: |
          python -m py_compile scripts/render-histology-direction-test.py
          python scripts/render-histology-direction-test.py
      - name: Validate unaltered evidence, runtime and actual playable streams
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          folder=Path("assets/films/prototypes")
          record=json.loads((folder/"histology-directors-test-40s.json").read_text())
          source={x["archival_source"] for x in record["shots"] if x["archival_source"]}
          assert source=={
            "assets/2026-10-13-new-photos/zebrafish-paraffin-microtomy-failure.webp",
            "assets/2026-10-13-new-photos/zebrafish-orientation-specimens.webp",
            "assets/2026-10-13-new-photos/zebrafish-histology-processing.webp",
          }
          assert len(record["shots"])==6
          assert abs(record["runtime"]-40)<.12
          p=folder/"histology-directors-test-40s.mp4"
          assert p.stat().st_size>500000
          assert record["sha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","stream=codec_type,codec_name,width,height","-of","json",str(p)]))
          assert any(s.get("codec_name")=="h264" and s.get("width")==1280 for s in info["streams"])
          assert any(s.get("codec_name")=="aac" for s in info["streams"])
          for i in range(1,7):assert (folder/f"histology-test-frame-{i:02d}.webp").is_file()
          print("Source-grounded directing test verified")
          PY
      - name: Save preview on the review branch only, never overwrite public film
        run: |
          git config user.name "Ruwaidix Film Direction"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/prototypes/histology-directors-test-40s.mp4 assets/films/prototypes/histology-directors-test-40s.json assets/films/prototypes/histology-test-frame-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Picture-led histology film test with genuine archival evidence [histology-test-output]"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
