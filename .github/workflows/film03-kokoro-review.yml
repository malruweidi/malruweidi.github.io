name: Film 03 open Kokoro narration - creative review
on:
  push:
    branches: [film03-kokoro-source-review-20261022]
    paths: ['.github/workflows/film03-kokoro-review.yml']
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up free speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          python -m pip install -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
      - name: Download open Kokoro model and voices
        run: |
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s model/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Produce 12 timed source-verified scenes
        run: |
          python - <<'PY'
          from kokoro_onnx import Kokoro
          import json,numpy as np,soundfile as sf
          from pathlib import Path
          lines=["One pathway can oppose cancer in one tissue, and support it in another. That is the problem posed by SLIT2 and ROBO.","SLIT2 is an extracellular protein. It interacts with ROBO receptors at cell surfaces, alongside other molecular partners.","Blocking this interaction seems straightforward, until we ask which cells depend on it, and for what biological purpose.","In some tumours, SLIT2 is silenced. Indiscriminate inhibition there risks suppressing signalling that may already protect tissue.","In other settings, the pathway may contribute to invasion or immune exclusion. These contexts motivate research into inhibitors.","Our review examined patent families from twenty twenty through twenty twenty-six, assessing their mechanism and experimental support.","Antibodies can target ligands or receptors. Ligand traps offer another approach, with distinct manufacturing and evidence demands.","Small molecules and macrocycles may disrupt protein contacts. But binding alone is not proof of a useful cellular effect.","Nucleic-acid and bispecific strategies broaden the options. They still need evidence of specificity, exposure, and meaningful benefit.","A patent is a proposed invention, not a clinical trial. A broad claim cannot substitute for working experimental data.","Credible development requires biomarker selection, verified pathway direction, and tests in relevant models of each tumour context.","Ultimately, the important question is when to intervene. Inhibition needs biological justification, not merely a convenient target."]
          model=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          sr=None;mix=None;events=[]
          for i,txt in enumerate(lines):
            for speed in (1.08,1.13,1.18,1.23):
              a,rate=model.create(txt,voice='af_bella',speed=speed,lang='en-us')
              a=np.asarray(a,dtype=np.float32).reshape(-1)
              if len(a)/rate<=9.65:break
            if len(a)/rate>9.65:raise RuntimeError(f'Excess speech in scene {i+1}: {len(a)/rate:.2f}s')
            if sr is None:
              sr=rate;mix=np.zeros(120*sr,dtype=np.float32)
            assert sr==rate
            start=10*i+.17;off=int(start*sr)
            mix[off:off+len(a)]+=a
            sf.write(f'shot-{i+1:02}.wav',a,sr,subtype='PCM_16')
            events.append(dict(shot=i+1,start=start,end=start+len(a)/sr,text=txt,voice_speed=speed))
            print('SHOT',i+1,'SECONDS',round(len(a)/sr,2),'SPEED',speed,flush=True)
          peak=float(np.max(np.abs(mix)));assert peak>0.05
          sf.write('Film_03_Kokoro_Narration.wav',mix*(.79/peak),sr,subtype='PCM_16')
          Path('Film_03_Narration_Timings.json').write_text(json.dumps(dict(voice='Kokoro ONNX af_bella',notes='synthetic voice requiring human review',events=events),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: film03-open-voice-audition
          path: |
            Film_03_Kokoro_Narration.wav
            Film_03_Narration_Timings.json
            shot-*.wav
          retention-days: 7
