name: Film 12 | Clinical ACE2 and antihypertensive cohort cinema

on:
  push:
    branches:
      - cinema/ace2-covid-v20-clinical-evidence
    paths:
      - assets/films/series-v20-ace2/film.html
      - scripts/render-ace2-v20.py
      - tests/ace2-v20.test.py
      - .github/workflows/render-ace2-v20.yml

permissions:
  contents: write

concurrency:
  group: single-film12-ace2-v20-${{ github.ref }}
  cancel-in-progress: false

jobs:
  film12-review-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out observational 2022 research paper context and preserved 84s narration
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible no-cost Chromium FFmpeg rendering stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check pillow playwright numpy soundfile
          python -m playwright install --with-deps chromium
      - name: Validate 2022 observational data integrity and 6 moving reproducible chapters
        run: |
          python -m py_compile scripts/render-ace2-v20.py tests/ace2-v20.test.py
          python scripts/render-ace2-v20.py --validate-only
          python tests/ace2-v20.test.py
      - name: Render full 84-second film at native 1920x1080 24fps
        run: python -u scripts/render-ace2-v20.py
      - name: Independent check of source claims, encoded motion, captions and loudness
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess,re
          root=Path("assets/films/series-v20-ace2")
          master=root/"ace2-covid-drugs.mp4"
          data=json.loads((root/"ace2-covid-drugs.json").read_text())
          ff=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(master)]))
          assert abs(float(ff["format"]["duration"])-84)<.15
          assert {"video","audio"}<={x["codec_type"] for x in ff["streams"]}
          assert any(x.get("codec_name")=="h264" and x.get("width")==1920 and x.get("height")==1080 for x in ff["streams"])
          assert data["film_index"]==12 and data["paper"]["doi"]=="10.1080/08037051.2022.2055530"
          assert "cross-sectional" in data["paper"]["type"].lower()
          study=data["published_numbers"]
          assert study["total_participants"]==200
          assert study["cohorts"]=={"ACEi":57,"ARB":68,"beta_blocker":15,
            "calcium_channel_blocker":30,"unknown_medication_class":30}
          assert sum(study["cohorts"].values())==200
          assert study["soluble_ACE2_severe_vs_mild_fold_approx"]==1.9
          assert study["angiotensin_II_mild_vs_severe_fold_approx"]==1.2
          assert study["ACE2_hospital_stay_correlation_r"]==0.3
          assert "severity category counts" in data["data_quality_note"]
          assert data["live_website_unchanged"] and data["older_film_masters_preserved"]
          assert hashlib.sha256(master.read_bytes()).hexdigest()==data["sha256"]
          for src in data["contextual_images"]:
            assert hashlib.sha256(Path(src["file"]).read_bytes()).hexdigest()==src["sha256"]
          assert (root/"ace2-covid-drugs.vtt").read_text().count("-->")==12
          assert (root/"ace2-covid-drugs.contact.webp").stat().st_size>14000
          assert (root/"ace2-covid-drugs.webp").stat().st_size>4000
          assert len(list(root.glob("chapter-??.jpg")))==6
          frames=subprocess.check_output(["ffmpeg","-v","error","-i",str(master),
            "-map","0:v:0","-an","-vf","fps=1","-f","framemd5","-"],text=True)
          hashes=[q.rsplit(",",1)[-1].strip() for q in frames.splitlines() if q and not q.startswith("#")]
          assert 83<=len(hashes)<=85,len(hashes)
          assert len(set(hashes))>=80,(len(set(hashes)),len(hashes))
          print("FILM12 VERIFIED VIDEO-ONLY TEMPORAL FRAMES",len(set(hashes)),"/",len(hashes))
          audio=subprocess.run(["ffmpeg","-hide_banner","-i",str(master),
            "-map","0:a:0","-filter_complex","ebur128=peak=true","-f","null","-"],
            capture_output=True,text=True)
          assert audio.returncode==0
          import re
          samples=[float(x) for x in re.findall(r"TPK:\s*([-+]?\d+(?:\.\d+)?)\s*dBFS",audio.stderr)]
          assert samples, "True-peak samples missing from EBU R128 measurement"
          worst=max(samples)
          assert worst <= -1.0, f"True peak over mastering ceiling: {worst:.1f} dBTP"
          print("FILM12 VERIFIED TRUE PEAK",worst,"dBTP")
          print("FILM12 EBU R128",audio.stderr[-1500:])
          PY
      - name: Commit verified review master to isolated branch and retain all existing films
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ruwaidix Research Cinema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          render_source_hash="$(git hash-object scripts/render-ace2-v20.py)"
          mkdir -p /tmp/ace2-v20-output
          cp -a assets/films/series-v20-ace2/. /tmp/ace2-v20-output/
          git fetch origin cinema/ace2-covid-v20-clinical-evidence
          current_hash="$(git show origin/cinema/ace2-covid-v20-clinical-evidence:scripts/render-ace2-v20.py | git hash-object --stdin)"
          if [ "$render_source_hash" != "$current_hash" ]; then
            echo "Newer source renderer exists; do not push a stale binary"; exit 0
          fi
          git reset --hard origin/cinema/ace2-covid-v20-clinical-evidence
          cp -a /tmp/ace2-v20-output/. assets/films/series-v20-ace2/
          git add assets/films/series-v20-ace2/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Film 12: export the clinical ACE2 observational research cinema review master"
          git push origin HEAD:cinema/ace2-covid-v20-clinical-evidence
