name: Ruwaidix narrator audition — open source, not approved for publication
on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - scripts/audition-cinematic-voices.py
      - .github/workflows/voice-auditions-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-narrator-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local Kokoro audition runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install numpy soundfile kokoro-onnx
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-voice-audition-kokoro-20261017
      - name: Download local open-source voice model
        run: |
          mkdir -p film-models
          test -s film-models/kokoro-v1.0.fp16.onnx || curl --fail --location --retry 3 -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          test -s film-models/voices-v1.0.bin || curl --fail --location --retry 3 -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Make twelve reproducible narration samples (no approval implied)
        run: |
          python scripts/audition-cinematic-voices.py --validate-only
          python scripts/audition-cinematic-voices.py --models film-models
      - name: Commit separately from the movies and user-facing pages
        run: |
          git config user.name "Ruwaidix Narrator Auditions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/voice-auditions/
          if ! git diff --cached --quiet; then
            git commit -m "Twelve unapproved voice audition recordings [voice-audition-output]"
            git fetch origin cinematic-remake-20261017
            git rebase FETCH_HEAD
            git push origin HEAD:cinematic-remake-20261017
          fi
