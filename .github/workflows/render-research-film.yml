name: Render Ruwaidix two-minute film
on:
  push:
    branches:
      - main
      - film-documentary-2026-10-16
    paths:
      - assets/films/what-survives-scenes.json
      - scripts/render-documentary.py
      - .github/workflows/render-research-film.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-film-${{ github.ref }}
  cancel-in-progress: false
jobs:
  documentary:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[film-output]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout existing full scientific archive
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open film tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy soundfile kokoro-onnx
      - name: Check source provenance, film story and preserved homepage
        run: |
          node --test tests/research-film.test.cjs
          python -m py_compile scripts/render-documentary.py
          python scripts/render-documentary.py --validate-only
      - name: Obtain freely licensed local TTS model and voice
        run: |
          mkdir -p film-models
          curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
          test "$(stat -c%s film-models/voices-v1.0.bin)" -gt 1000000
      - name: Render and validate exact 120-second film
        run: python scripts/render-documentary.py --workspace film-models
      - name: Commit only rendered MP4, captions and manifest
        run: |
          git config user.name "Ruwaidix Film Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/what-survives-the-experiment.mp4 assets/films/what-survives-the-experiment.vtt assets/films/what-survives-build.json
          if ! git diff --cached --quiet; then
            git commit -m "Render open-source archival documentary [film-output]"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
