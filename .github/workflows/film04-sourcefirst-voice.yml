name: Film 04 - source-first free Kokoro voice
on:
  push:
    branches: [film04-sourcefirst-voice-20261022]
    paths: ['.github/workflows/film04-sourcefirst-voice.yml']
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source narration engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
      - name: Get Kokoro model and voices
        run: |
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s model/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Render 12 timed passages without cutting speech
        run: |
          python - <<'PY'
          import numpy as np, soundfile as sf, json
          from pathlib import Path
          from kokoro_onnx import Kokoro
          lines=["Curcumin gives turmeric its colour. In this experiment, it also served as a molecular probe for cyanide.","These photographs and spectra come from the actual study, published in Analytical Methods in twenty nineteen.","The important detail is the solvent: ninety parts acetonitrile, ten parts water. This was not pure water.","Adding cyanide turned the solution from bright yellow toward orange. The test tubes show the actual change.","Ultraviolet-visible spectroscopy measured a falling absorption band at four hundred twenty-one nanometres, with a new band appearing.","The new absorption appears near five hundred twenty nanometres: a ninety-nine nanometre shift recorded experimentally.","The controls matter. Hydroxide produced a similar response, so the colour change was not completely selective.","The reported detection limit was two point three micromolar under the experimental conditions, not a clinical threshold.","The team also measured fluorescence. Adding cyanide reduced curcumin's emission intensity near five hundred twenty nanometres.","Curcumin fluorescence was observed inside cultured H E K two nine three T cells. These are actual microscope images.","After cyanide treatment, intracellular fluorescence diminished over time. That observation does not establish a diagnostic test.","The result is a promising laboratory probe whose chemistry, interference and solvent conditions must accompany the claim."]
          model=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          sr=None;mix=None;events=[]
          for i,txt in enumerate(lines):
            for speed in (1.08,1.13,1.18,1.23,1.28):
              arr,rate=model.create(txt,voice='af_bella',speed=speed,lang='en-us')
              arr=np.asarray(arr,dtype=np.float32).reshape(-1)
              if len(arr)/rate <= 9.70:break
            duration=len(arr)/rate
            print(f'SHOT {i+1:02} duration={duration:.2f}s speed={speed}',flush=True)
            if duration>9.70:raise ValueError(f'Shot {i+1} too long; edit the line')
            if sr is None:sr=rate;mix=np.zeros(120*sr,dtype=np.float32)
            assert sr==rate
            pos=round((i*10+0.16)*sr)
            mix[pos:pos+len(arr)]+=arr
            sf.write(f'shot-{i+1:02}.wav',arr,sr,subtype='PCM_16')
            events.append(dict(shot=i+1,start=i*10+0.16,end=i*10+0.16+duration,text=txt,voice_speed=speed))
          peak=float(np.max(np.abs(mix)))
          assert peak>0.025
          mix*=0.78/peak
          sf.write('Film_04_Curcumin_Cyanide_Kokoro.wav',mix,sr,subtype='PCM_16')
          Path('film04-speech-timings.json').write_text(json.dumps(dict(voice='af_bella',source='Kokoro ONNX',rights='Model Apache-2.0; engine MIT',events=events),indent=2))
          PY
      - name: Validate audio
        run: |
          ffprobe -v error -show_entries format=duration:stream=sample_rate,channels -of default=noprint_wrappers=1 Film_04_Curcumin_Cyanide_Kokoro.wav
      - uses: actions/upload-artifact@v4
        with:
          name: film04-curcumin-narration
          retention-days: 7
          path: |
            Film_04_Curcumin_Cyanide_Kokoro.wav
            film04-speech-timings.json
            shot-*.wav
