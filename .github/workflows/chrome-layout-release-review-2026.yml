name: Chrome layout and interaction release review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    name: Real Chrome screenshots and essential flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Verify browser QA contract without a browser
        run: node --test tests/browser-release-contract-2026.test.cjs
      - name: Install pinned open-source browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Detect preinstalled Chrome
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Chrome is not available on the runner; cannot certify screenshots."
            exit 1
          fi
      - name: Serve checked-in website without third-party hosting
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ruwaidix-http-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --silent --fail --head http://127.0.0.1:8765/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ruwaidix-http-server.log
          exit 1
      - name: Real Chrome checks, 5 viewports and representative screenshots
        env:
          SITE_BASE_URL: http://127.0.0.1:8765
          BROWSER_QA_OUTPUT: browser-qa-artifacts
        run: node scripts/browser-release-qa-2026.cjs
      - name: Sample real film frames with FFmpeg, independently of Chrome controls
        if: success() || failure()
        run: |
          node --test tests/film-frame-sampling-2026.test.cjs
          command -v ffmpeg
          command -v ffprobe
          node scripts/sample-film-frames-2026.cjs
      - name: Upload actual browser screenshots and issue report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruwaidix-browser-release-${{ github.run_id }}
          path: browser-qa-artifacts/
          if-no-files-found: warn
          retention-days: 21
