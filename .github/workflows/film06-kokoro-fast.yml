name: Film 06 - Kokoro quick retry
on:
  push:
    branches: [film06-nebulizer-narration-20261022]
    paths: ['.github/workflows/film06-kokoro-fast.yml']
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free open Kokoro engine
        run: |
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
      - name: Download licensed voice weights
        run: |
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s model/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Generate twelve intact science narration passages
        run: |
          python - <<'PY'
          import json,numpy as np,soundfile as sf
          from pathlib import Path
          from kokoro_onnx import Kokoro
          lines=["A carrier can look excellent in a vial, then fail at the nebulizer. That is the question behind inhaled dexamethasone formulations.","My master's research examines nonionic niosomes and proniosomes that form vesicles upon hydration. Their membranes include Span sixty and cholesterol.","Changing membrane packing could alter a vesicle's response to stress. This packing diagram is a formulation hypothesis, not measured morphology.","Before aerosol testing, the samples need size distributions, surface charge, drug content, and chemical compatibility measurements.","Microscopy gives a separate view of vesicle structure. These images come from thesis progress materials, not simulated microscopy.","Drug calibration supports accurate quantitation. Linearity alone cannot tell us whether medicine will reach the lung after nebulization.","Air-jet and vibrating-mesh nebulizers make aerosols differently. Each device may impose distinct mechanical stresses on nanocarriers.","Those stresses can change vesicle size or cause leakage. Measurements before and after aerosolization are essential.","Aerodynamic particle size matters. Fine particle fraction and mass median aerodynamic diameter describe aerosol performance, not clinical efficacy.","These comparisons are internal thesis-progress observations. They are exploratory and have not been independently peer-reviewed.","Aerosol performance is only one gate. Release behavior and biological response must also be examined before clinical translation.","Will the medicine survive the nebulizer? The answer depends on formulation and device together. A promising carrier is not yet a treatment."]
          model=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          sr=None;voice=None;events=[]
          for i,text in enumerate(lines):
            for speed in (1.05,1.10,1.15,1.20,1.25):
              wav,rate=model.create(text,voice='af_bella',speed=speed,lang='en-us')
              wav=np.asarray(wav,dtype=np.float32).ravel()
              if len(wav)/rate<=9.60:break
            dur=len(wav)/rate
            if dur>9.60:raise RuntimeError(f'Scene {i+1} narration overrun, {dur:.2f}s. Revise script, do not truncate.')
            if sr is None:sr=rate;voice=np.zeros(120*sr,dtype=np.float32)
            assert sr==rate
            t0=i*10+.2;offset=round(t0*sr)
            voice[offset:offset+len(wav)]+=wav
            sf.write(f'scene_{i+1:02}.wav',wav,sr,subtype='PCM_16')
            events.append(dict(scene=i+1,start=t0,end=t0+dur,text=text,speed=speed))
            print('SCENE',i+1,'SPEECH',round(dur,2),'SPEED',speed,flush=True)
          peak=float(np.max(np.abs(voice)));assert peak>.01
          sf.write('Film_06_Kokoro_Narration.wav',voice*.80/peak,sr,subtype='PCM_16')
          Path('Film_06_Narration_Timings.json').write_text(json.dumps({'engine':'Kokoro ONNX af_bella','events':events,'status':'requires human audition'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: film06-kokoro-audition
          path: |
            Film_06_Kokoro_Narration.wav
            Film_06_Narration_Timings.json
            scene_*.wav
          retention-days: 7
