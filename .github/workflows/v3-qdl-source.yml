name: V3 authentic source image check (QDL folio)
on:
  push:
    branches: [cinema-v3-evidence-first]
    paths: [scripts/ingest-v3-qdl-public-folio.py, .github/workflows/v3-qdl-source.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v3-qdl-specific-folio
  cancel-in-progress: false
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Fetch exact publicly served IIIF source, with no alternate-image fallback
        run: python scripts/ingest-v3-qdl-public-folio.py
      - name: Commit verified archival image only
        run: |
          git config user.name "Ruwaidix evidence-first cinema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/v3/sources/Or5786-f31v-QDL-original.*
          if ! git diff --cached --quiet; then
            git commit -m "Stage genuine public-domain Or 5786 folio 31v for documented film context"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
