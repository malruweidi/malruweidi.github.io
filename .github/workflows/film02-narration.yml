name: Film 02 / free Kokoro research narration
on:
  push:
    branches: [film02-source-first-20261022]
    paths: ['.github/workflows/film02-narration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narrator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Kokoro narrator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s model/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Render precisely timed scientific speech
        run: |
          python - <<'PY'
          import json,numpy as np,soundfile as sf
          from pathlib import Path
          from kokoro_onnx import Kokoro
          lines=[
          (0,20,"Before blood even begins to move through a developing brain, its vessels must take shape. In zebrafish embryos, researchers found tiny primary cilia along the first cerebral vessels. What were these projections doing before blood flow began?"),
          (20,40,"These are the original confocal images. Green marks a ciliary reporter. Red outlines blood vessels. The cilia often sat along spaces opening within new vessels. Time-lapse sequences showed changes in their shape and position, even before flow started."),
          (40,60,"As new vessels sprouted through the hindbrain, cilia appeared near growing tips and developing lumens. Later, fewer remained. Some persisted at curved vessels, branch points, and places where vessels joined. Their location changed as the network matured."),
          (60,80,"One experiment reduced heartbeat and blood flow. The early distribution of cilia remained. Another exposed developing vessels to elevated shear stress. That was associated with premature cilia loss and bleeding. Their role appears more complicated than flow sensing alone."),
          (80,100,"Disrupting the genes I F T one seventy-two and I F T eighty-one, both needed for building cilia, was associated with bleeding in the developing brain. The researchers were investigating whether cilia help keep a forming vessel intact."),
          (100,120,"These observations are from zebrafish embryos, not human patients. They reveal when endothelial cilia appear, where they persist, and how vascular stability can depend on them. A blood vessel is alive long before it becomes a pipe for blood.")]
          voice=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          chunks=[];data=[];sr=None
          for i,(st,en,phrase) in enumerate(lines,1):
            a,rate=voice.create(phrase,voice='af_bella',speed=1.06,lang='en-us')
            a=np.asarray(a,dtype=np.float32).reshape(-1)
            if sr is None:sr=rate
            assert rate==sr
            duration=len(a)/sr
            print('CHAPTER',i,'DURATION',round(duration,2),'AVAILABLE',en-st,flush=True)
            if duration>en-st-1.0:raise RuntimeError('Narration overflow in chapter '+str(i))
            sf.write(f'film02_chapter_{i:02}.wav',a,sr)
            chunks.append((st,a))
            data.append({'chapter':i,'start':st+0.65,'end':st+0.65+duration,'text':phrase})
          result=np.zeros(120*sr,np.float32)
          for st,a in chunks:
            offset=round((st+0.65)*sr)
            result[offset:offset+len(a)]+=a
          peak=float(np.max(np.abs(result)));assert 0.01<peak<3
          result*=0.78/peak
          sf.write('Film_02_Kokoro_120s.wav',result,sr,subtype='PCM_16')
          Path('Film_02_Kokoro_cue_manifest.json').write_text(json.dumps(data,indent=2))
          print('WAV SHA?',Path('Film_02_Kokoro_120s.wav').stat().st_size)
          PY
      - name: Audio integrity
        run: ffprobe -v error -show_entries format=duration:stream=sample_rate,channels -of json Film_02_Kokoro_120s.wav
      - uses: actions/upload-artifact@v4
        with:
          name: film02-kokoro-voice-audition
          path: |
            Film_02_Kokoro_120s.wav
            Film_02_Kokoro_cue_manifest.json
            film02_chapter_*.wav
          retention-days: 7
