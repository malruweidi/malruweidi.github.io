name: Making Medicines Keep V4 — full-frame historical cinema
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/render-making-medicines-v4.py
      - .github/workflows/render-making-medicines-v4.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-making-medicines-v4
  cancel-in-progress: false
jobs:
  cinematic-manuscript-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-safe open film and narration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-making-medicines-v4.py scripts/render-making-medicines-v3.py
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Obtain openly published Kokoro narrator models
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Re-film actual historical text in full-frame motion and eight material-science episodes
        run: python scripts/render-making-medicines-v4.py
      - name: Verify master integrity and unchanged original
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          p=Path("assets/films/series-v4/making-medicines-keep.mp4")
          meta=json.loads(p.with_suffix(".json").read_text())
          assert p.stat().st_size>1_000_000 and p.stat().st_size<98_000_000
          assert meta["sha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          assert abs(float(meta["duration_seconds"])-120)<.35
          assert len(meta["chapters"])==8
          assert meta["edition"].startswith("V4 archival-material")
          assert "NOT HUMAN REVIEWED" in meta["human_review"]
          assert p.with_suffix(".vtt").read_text().startswith("WEBVTT")
          assert Path("assets/films/series/making-medicines-keep.mp4").exists()
          data=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-of","json",str(p)]))
          assert {"h264","aac"}<={t["codec_name"] for t in data["streams"]}
          print("Encoded distinct V4 draft, source sound and picture checks pass")
          PY
      - name: Commit distinct V4 to a safe alternate path
        run: |
          git config user.name "Ruwaidix Cinematic Film Production"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v4/making-medicines-keep.*
          if ! git diff --cached --quiet; then
            git commit -m "Encode full-screen archival and experimental mechanics documentary V4"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              git push origin HEAD:"${{ github.ref_name }}"
            else
              git rebase --abort
              exit 1
            fi
          fi
