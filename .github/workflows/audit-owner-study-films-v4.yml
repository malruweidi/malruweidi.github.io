name: Inspect V4 full-picture cyanide and zebrafish movie frames
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/audit-owner-study-films-v4.py
      - .github/workflows/audit-owner-study-films-v4.yml
      - assets/films/series-v4/curcumin-cyanide.mp4
      - assets/films/series-v4/histology-failure.mp4
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ruwaidix-v4-owner-archive-quality-gate
  cancel-in-progress: false
jobs:
  audiovisual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - name: Inspect original image identity and sixteen frames of encoded V4 motion
        run: python scripts/audit-owner-study-films-v4.py
      - name: Commit full-frame contact sheets if they differ from current source hashes
        run: |
          git config user.name "Ruwaidix V4 Editorial Review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v4/qa/curcumin-cyanide-contact.* assets/films/series-v4/qa/histology-failure-contact.*
          if ! git diff --cached --quiet; then
            git commit -m "Visually audit source-bound curcumin and failed histology motion cuts"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              git push origin HEAD:"${{ github.ref_name }}"
            else
              git rebase --abort
              exit 1
            fi
          fi
