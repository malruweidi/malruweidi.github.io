name: Source verify 2021 respiratory microfluidics review Figure 1
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/import-microfluidic-review-fig1.py
      - .github/workflows/import-microfluidic-review-fig1.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  source-figure-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - name: Verify published Figure 1 comes only from Springer Nature
        run: python scripts/import-microfluidic-review-fig1.py
      - name: Verify correct paper and photo credits
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path("assets/films/source-figures/v4/microfluidic-virus/source-provenance.json")
          j=json.loads(p.read_text())
          assert j["doi"]=="10.1007/s42247-021-00169-7"
          assert "NOT ACTUAL DEVICE" in j["interpretation"]
          assert hashlib.sha256(Path(j["image"]).read_bytes()).hexdigest()==j["sha256"]
          PY
      - name: Commit genuine source pixels without overwriting published film
        run: |
          git config user.name "Ruwaidix first-party science source"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/source-figures/v4/microfluidic-virus/
          if ! git diff --cached --quiet; then
            git commit -m "Verify exact primary review Figure 1 with DOI and CC BY attribution"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
