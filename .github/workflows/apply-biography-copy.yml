name: Apply homepage biography copy
on:
  push:
    paths:
      - '.github/workflows/apply-biography-copy.yml'
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Make two precise biography edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          original = p.read_text(encoding='utf-8')
          edits = [
            ('EGYPTIAN RESEARCHER · WRITER · HISTORY OF MEDICINE · BASED IN QATAR',
             'RESEARCH · WRITING · THE PEOPLE AND QUESTIONS BEHIND THE WORK'),
            ('I am Egyptian. Much of my education and scientific life developed in Qatar. What has endured across those settings is not a fixed professional title, but an increasingly demanding relationship with evidence. I want to understand what I observe, and I am willing to learn a different method when the question requires it.',
             'I was born in Egypt and raised in Qatar, where much of my education and scientific life began. It was a third-culture upbringing in the ordinary sense: Egyptian family roots, everyday life in Qatar, and no particular need to separate the two. The curiosity in these photographs followed me into university, where questions gradually became experiments and research. I still want to understand what I observe, even when doing so means learning an unfamiliar method.')
          ]
          for before, after in edits:
              if original.count(before) != 1:
                  raise SystemExit(f'Expected one occurrence, got {original.count(before)}: {before[:50]}')
              original = original.replace(before, after)
          p.write_text(original, encoding='utf-8')
          PY
      - name: Commit the two copy edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Present Egyptian-Qatar upbringing naturally in the story"
          git push
