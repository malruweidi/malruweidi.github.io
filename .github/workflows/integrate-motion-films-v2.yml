name: Integrate four scientific motion edits in feature publication films
on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - .github/workflows/integrate-motion-films-v2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-source-motion-inserts
  cancel-in-progress: false
jobs:
  motion-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free film render stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx cairosvg
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-voice-audition-kokoro-20261017
      - name: Load open local narrator engine
        run: |
          mkdir -p film-models
          test -s film-models/kokoro-v1.0.fp16.onnx || curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          test -s film-models/voices-v1.0.bin || curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Verify four unique animation sources exist in controlled manifest
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open("assets/films/cinematic-library-v2.json"))
          names=("pub-airway-reopening","pub-ace2-forms","pub-food-printing","pub-microfluidic-virus")
          for name in names:
              f=next(x for x in d["films"] if x["slug"]==name)
              motion=[s for s in f["shots"] if s.get("video","").startswith("assets/films/animations-v2/")]
              assert len(motion)==1,(name,len(motion))
              assert os.path.isfile(motion[0]["video"])
              assert "not" in motion[0]["credit"].lower(),name
              print("Verified original conceptual motion clip:",name,motion[0]["video"])
          PY
      - name: Render each revised moving-image edition and checkpoint immediately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ruwaidix Scientific Film Editor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for title in pub-airway-reopening pub-ace2-forms pub-food-printing pub-microfluidic-virus; do
            python scripts/render-cinematic-library.py --film "$title" --limit 1 --models film-models
            MOVIE="$title" python - <<'PY'
          import os,json,hashlib
          title=os.environ["MOVIE"]
          base="assets/films/library-v2/"+title+"-rough-cut"
          j=json.load(open(base+".json"))
          assert len(j["motion_shots"])==1,(title,j.get("motion_shots"))
          assert j["motion_shots"][0]["source_sha256"]
          assert j["sha256"]==hashlib.sha256(open(base+".mp4","rb").read()).hexdigest()
          assert j["voice_approved"] is False
          print("Scientifically credited animated segment verified:",title)
          PY
            git add -A assets/films/library-v2/
            if ! git diff --cached --quiet; then
              git commit -m "Revise animated source-grounded film $title [v2-output]"
              for retry in 1 2 3 4 5 6 7 8; do
                git fetch origin cinematic-remake-20261017
                git rebase FETCH_HEAD
                if git push origin HEAD:cinematic-remake-20261017; then break; fi
                sleep 3
              done
            fi
          done
