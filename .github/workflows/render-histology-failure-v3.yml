name: Zebrafish histology failure V3 authentic-photo film
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/render-histology-failure-v3.py
      - .github/workflows/render-histology-failure-v3.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: ruwaidix-histology-negative-result, cancel-in-progress: false}
jobs:
  preserve-failed-result:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install open-source documentary renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-histology-failure-v3.py
      - uses: actions/cache@v4
        with: {path: film-models, key: ruwaidix-kokoro-onnx-fp16-v1.1}
      - name: Download open TTS models only when not cached
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl -fL --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl -fL --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Assemble actual failed experiment with explanatory mechanics clearly labelled
        run: python scripts/render-histology-failure-v3.py
      - name: Independently verify the old media archive and new eight-chapter master
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          d=Path("assets/films/series-v3")
          film=d/"histology-failure.mp4"
          j=json.loads((d/"histology-failure.json").read_text())
          assert j["sha256"]==hashlib.sha256(film.read_bytes()).hexdigest()
          assert j["result"].startswith("UNSUCCESSFUL")
          assert len(j["sources"])==3 and len(j["chapters"])==8
          assert abs(j["duration_seconds"]-120)<.35
          assert "NOT APPROVED" in j["human_review"]
          assert (d/"histology-failure.vtt").read_text().startswith("WEBVTT")
          assert Path("assets/films/series/histology-failure.mp4").exists()
          stream=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-of","json",str(film)]))
          assert {"h264","aac"}<={x["codec_name"] for x in stream["streams"]}
          PY
      - name: Commit separate V3 film without replacing existing public recordings
        run: |
          git config user.name "Ruwaidix Failed Experiment Cinema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v3/histology-failure.*
          if ! git diff --cached --quiet; then
            git commit -m "Record source-specific negative-result histology story using three authentic owner photos"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              git push origin HEAD:"${{ github.ref_name }}"
            else
              git rebase --abort
              exit 1
            fi
          fi
