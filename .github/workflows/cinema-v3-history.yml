name: Cinema V3 — historical pharmacy picture and voice draft
on:
  push:
    branches: [cinema-v3-evidence-first]
    paths:
      - scripts/render-cinema-v3-history.py
      - assets/films/v3/making-medicines-keep.storyboard.json
      - .github/workflows/cinema-v3-history.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cinema-v3-history-manuscript-review
  cancel-in-progress: false
jobs:
  source-first-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local open-source compositor and proper Arabic shaping fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy soundfile kokoro-onnx
      - name: Validate manuscript scene sources and generated preview composition
        run: |
          python -m py_compile scripts/render-cinema-v3-history.py
          python scripts/render-cinema-v3-history.py --validate-only
      - name: Cache open synthetic narrator
        uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-v3-kokoro-fp16-v1.1
      - name: Retrieve Kokoro open voice model (no proprietary API)
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Render eight different source-led explanatory film scenes
        run: python scripts/render-cinema-v3-history.py
      - name: Independently verify audio, video, captions, source and 128s runtime
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          p=Path('assets/films/v3/rendered')
          movie=p/'making-medicines-keep-v3.mp4'
          meta=json.loads((p/'making-medicines-keep-v3.json').read_text())
          assert movie.is_file() and movie.stat().st_size>1000000
          assert meta['sha256']==hashlib.sha256(movie.read_bytes()).hexdigest()
          assert len(meta['visuals'])==8
          vtt=(p/'making-medicines-keep-v3.vtt').read_text()
          assert vtt.startswith('WEBVTT')
          assert sum('-->' in x for x in vtt.splitlines())>=16
          assert all(len(x)<=51 for x in vtt.splitlines() if x and '-->' not in x and x!='WEBVTT')
          streams=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(movie)]))
          assert abs(float(streams['format']['duration'])-128)<.35
          assert {'video','audio'} <= {x['codec_type'] for x in streams['streams']}
          print('V3 HISTORICAL FILM VERIFIED',movie,meta['sha256'])
          PY
      - name: Commit alternative v3 draft only, not live public cinema
        run: |
          git config user.name "Ruwaidix source-critical films"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/v3/rendered/
          if ! git diff --cached --quiet; then
            git commit -m "Stage eight-scene primary-text-based Cairo pharmaceutical documentary V3"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
