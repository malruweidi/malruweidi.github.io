name: Six feature-film voice duration audition
on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - scripts/audit-voice-duration-v2.py
      - .github/workflows/audit-voice-duration-v2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-feature-voice-timing
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy soundfile kokoro-onnx
      - run: python scripts/audit-voice-duration-v2.py --validate-only
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-voice-audition-kokoro-20261017
      - name: Retrieve publicly hosted local voice model
        run: |
          mkdir -p film-models
          test -s film-models/kokoro-v1.0.fp16.onnx || curl --fail --location --retry 3 -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          test -s film-models/voices-v1.0.bin || curl --fail --location --retry 3 -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Measure scene voice durations and detect future clip overruns
        run: python scripts/audit-voice-duration-v2.py --models film-models
      - name: Save diagnostic report (does not alter videos or editorial signoff)
        run: |
          git config user.name "Ruwaidix Timing Inspector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/voice-timing-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "Voice duration preflight report [voice-duration-output]"
            pushed=false
            for retry in 1 2 3 4 5 6 7 8; do
              git fetch origin cinematic-remake-20261017
              git rebase FETCH_HEAD
              if git push origin HEAD:cinematic-remake-20261017; then pushed=true; break; fi
              sleep "$((retry * 2))"
            done
            test "$pushed" = true
          fi
