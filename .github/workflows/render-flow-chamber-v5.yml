name: 2020 bubble chamber V5 complete original-figure research movie
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/render-flow-chamber-v5.py
      - .github/workflows/render-flow-chamber-v5.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ruwaidix-2020-cell-chamber-v5
  cancel-in-progress: false
jobs:
  source-validated-chamber-film:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install offline open-source movie engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-flow-chamber-v5.py
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Get open local voice model
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Render moving cell-interface and exact Figures 1 5 6
        run: python scripts/render-flow-chamber-v5.py
      - name: Independently inspect encoding, provenance and source identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          path=Path("assets/films/series-v5/flow-chamber-method.mp4")
          d=json.loads(path.with_suffix(".json").read_text())
          assert d["sha256"]==hashlib.sha256(path.read_bytes()).hexdigest()
          assert d["doi"]=="10.3390/mps3040065"
          assert len(d["chapters"])==8 and abs(d["duration_seconds"]-120)<.3
          assert {int(k) for k in d["documented_figures"]}=={1,5,6}
          assert path.with_suffix(".vtt").read_text().startswith("WEBVTT")
          assert Path("assets/films/series/flow-chamber-method.mp4").exists()
          c=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-of","json",str(path)]))
          assert {"h264","aac"}<={s["codec_name"] for s in c["streams"]}
          print("Exact study and original Figure 1/5/6 source verified")
          PY
      - name: Preserve original; stage V5 replacement candidate only
        run: |
          git config user.name "Ruwaidix Original Evidence Film Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v5/flow-chamber-method.*
          if ! git diff --cached --quiet; then
            git commit -m "Encode V5 original-data bubble chamber documentary with genuine mechanism motion"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
