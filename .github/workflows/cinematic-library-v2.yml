name: Rebuild all Ruwaidix films — unapproved cinematic editions
on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - assets/films/cinematic-library-v2.json
      - assets/films/publication-series-directors-v2.json
      - scripts/render-cinematic-library.py
      - scripts/render-directors-cuts.py
      - tests/cinematic-library-v2.test.cjs
      - .github/workflows/cinematic-library-v2.yml
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: ruwaidix-cinema-library-v2
  cancel-in-progress: false

jobs:
  source-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-safe original film toolkit
        run: python -m pip install pillow numpy soundfile cairosvg
      - name: Verify all 44 scripts, evidence and previous video archive preservation
        run: |
          node --test tests/directors-cuts.test.cjs tests/cinematic-library-v2.test.cjs
          python -m py_compile scripts/render-documentary.py scripts/render-directors-cuts.py scripts/render-cinematic-library.py
          python scripts/render-cinematic-library.py --validate-only
          python scripts/audit-v2-science-art.py

  film-render:
    needs: source-validate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[v2-output]')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open renderer and caption/voice dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx cairosvg
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-voice-audition-kokoro-20261017
      - name: Get locally operated Kokoro narrator for unapproved sound auditions
        run: |
          mkdir -p film-models
          test -s film-models/kokoro-v1.0.fp16.onnx || curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          test -s film-models/voices-v1.0.bin || curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Complete all 44 revised films, committing safe checkpoints after every 3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ruwaidix Film Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for batch in $(seq 1 16); do
            remaining="$(python scripts/render-cinematic-library.py --remaining-count | tail -n 1)"
            echo "Batch $batch, films still to attempt: $remaining"
            if [ "$remaining" -eq 0 ]; then break; fi
            python scripts/render-cinematic-library.py --missing-only --limit 3 --keep-going --voice-mode kokoro-preview --models film-models
            git add assets/films/library-v2/
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint cinematic film rough cuts $batch [v2-output]"
              pushed=false
              for retry in 1 2 3 4 5 6 7 8; do
                git fetch origin cinematic-remake-20261017
                git rebase FETCH_HEAD
                if git push origin HEAD:cinematic-remake-20261017; then pushed=true; break; fi
                sleep "$((retry * 2))"
              done
              if [ "$pushed" != true ]; then echo "Failed to reconcile concurrent output commits" >&2; exit 1; fi
            fi
          done
      - name: Make true-frame contact sheets for technical visual review
        run: |
          python scripts/render-contact-sheet-v2.py
          git add assets/films/visual-audit-v2/
          if ! git diff --cached --quiet; then
            git commit -m "Archive real preview frames and objective QA results [v2-output]"
            git fetch origin cinematic-remake-20261017
            git rebase FETCH_HEAD
            git push origin HEAD:cinematic-remake-20261017
          fi
      - name: Summarize completed drafts and blocked titles without claiming artistic approval
        run: |
          python scripts/render-cinematic-library.py --remaining-count
          python - <<'PY'
          from pathlib import Path
          d=Path('assets/films/library-v2')
          print('Completed technical previews:',len(list(d.glob('*-rough-cut.mp4'))))
          print('Blocked technical renders:',len(list(d.glob('*-blocked.json'))))
          print('Editorial listening, figures, rights and visual sign-off: NOT CERTIFIED')
          PY
