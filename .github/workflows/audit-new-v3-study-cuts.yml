name: Inspect new study-matched V3 films against source hashes
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/audit-new-v3-study-cuts.py
      - .github/workflows/audit-new-v3-study-cuts.yml
      - assets/films/series-v3/ace2-forms.mp4
      - assets/films/series-v3/curcumin-cyanide.mp4
      - assets/films/series-v3/histology-failure.mp4
      - assets/films/series-v3/micelles-pahs.mp4
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ruwaidix-new-v3-studies
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - run: python scripts/audit-new-v3-study-cuts.py
      - name: Save exact-MP4 contact sheets and byte provenance only
        run: |
          git config user.name "Ruwaidix Visual Evidence Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v3/qa/
          if ! git diff --cached --quiet; then
            git commit -m "Add full-frame visual QA for 4 source-specific films"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              git push origin HEAD:"${{ github.ref_name }}"
            else
              git rebase --abort
              git fetch origin "${{ github.ref_name }}"
              git reset --hard "origin/${{ github.ref_name }}"
              echo "Skipped conflicting derived binary QA; source movie remains intact"
            fi
          fi
