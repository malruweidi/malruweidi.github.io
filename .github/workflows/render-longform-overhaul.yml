name: Ruwaidix four longform documentaries v2
on:
  push:
    branches: [film-remake-20261017, main]
    paths:
      - scripts/remaster-evidence-series.py
      - assets/films/longform-remake-direction.json
      - .github/workflows/render-longform-overhaul.yml
      - scripts/make-film-qa-contact-sheets.py
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ruwaidix-all-longform-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open scientific filmmaking dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy soundfile kokoro-onnx cairosvg
      - name: Verify source boundaries of the four documentary treatments
        run: |
          python -m py_compile scripts/remaster-evidence-series.py scripts/film-overhaul-motion.py
          python scripts/remaster-evidence-series.py --validate-only
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Fetch open narrator models when uncached
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Build four 120-second features from actual evidence and distinct source media
        run: |
          for batch in 1 2 3 4; do
            left="$(python scripts/remaster-evidence-series.py --remaining-count | tail -n 1)"
            if [ "$left" -eq 0 ]; then break; fi
            python scripts/remaster-evidence-series.py --missing-only --limit 1
          done
      - name: Verify asset continuity, sound and subtitles
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          d=Path("assets/films/longform-v2")
          films=json.loads(Path("assets/films/evidence-in-motion.json").read_text())["films"]
          assert len(films)==4
          for original in films:
              slug=original["slug"]
              stem=original.get("media_stem",slug)
              f=d/(stem+".mp4")
              manifest=d/(slug+"-build.json")
              assert f.exists() and manifest.exists(),(f,manifest)
              record=json.loads(manifest.read_text())
              assert record["edition"]=="longform-v2"
              assert record["sha256"]==hashlib.sha256(f.read_bytes()).hexdigest()
              assert len(record["animated_scene_ids"])>=1
              assert f.with_suffix(".vtt").read_text().startswith("WEBVTT")
              pr=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","json",str(f)]))
              assert abs(float(pr["format"]["duration"])-120)<.2
              print(stem,float(pr["format"]["duration"]))
          PY
      - name: Generate contact sheets from the actual encoded documentary frames
        run: python scripts/make-film-qa-contact-sheets.py --collection longform-v2
      - name: Commit alternate footage without modifying the first editions
        run: |
          git config user.name "Ruwaidix Open Film Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/longform-v2/*.mp4 assets/films/longform-v2/*.vtt assets/films/longform-v2/*.json assets/films/longform-v2/*.webp assets/films/longform-v2/plates/*.webp assets/films/longform-v2/qa/*.jpg assets/films/longform-v2/qa/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Film draft: source-grounded evidence documentary V2 [longform-output]"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
