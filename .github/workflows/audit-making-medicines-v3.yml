name: Making Medicines Keep V3 frame-by-frame visual review
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/audit-making-medicines-v3.py
      - .github/workflows/audit-making-medicines-v3.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ruwaidix-making-qa
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - run: python scripts/audit-making-medicines-v3.py
      - name: Commit source-hashed full-frame QA without changing MP4
        run: |
          git config user.name "Ruwaidix Film QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v3/qa/
          if ! git diff --cached --quiet; then
            git commit -m "Publish 16 sampled real frames from unique 8-chapter medieval pharmacy film"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
