name: Ruwaidix independent film release gate
on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - scripts/audit-film-release-v2.py
      - .github/workflows/film-release-gate-v2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-film-release-audit
  cancel-in-progress: false
jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg metadata reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Independently check all 44 movies without approving any
        run: python scripts/audit-film-release-v2.py --write
      - name: Save the factual gate even if films need repair
        run: |
          git config user.name "Ruwaidix Film QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/visual-audit-v2/release-gate-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "Update unapproved technical release gate [v2-qa-output]"
            pushed=false
            for retry in 1 2 3 4 5 6 7 8; do
              git fetch origin cinematic-remake-20261017
              git rebase FETCH_HEAD
              if git push origin HEAD:cinematic-remake-20261017; then pushed=true; break; fi
              sleep "$((retry * 2))"
            done
            if [ "$pushed" != true ]; then exit 1; fi
          fi
