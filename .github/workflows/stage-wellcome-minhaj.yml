name: Authentic Wellcome Minhaj manuscript source import
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/import-wellcome-minhaj.py
      - .github/workflows/stage-wellcome-minhaj.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-primary-minhaj
  cancel-in-progress: false
jobs:
  stage-verified-manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - name: Request only catalog-verified public domain MS Arabic 1002 images from official Wellcome API
        run: python scripts/import-wellcome-minhaj.py
      - name: Check explicit unverified-page status and copy dating
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          folder=Path("assets/films/source-manuscripts/wellcome-ms-arabic-1002")
          d=json.loads((folder/"source-register.json").read_text())
          assert d["canvas_count"]>=120 and d["copy_date"]=="Egypt, 1904 CE"
          assert len(d["staged_pages"])==4
          for p in d["staged_pages"]:
            assert "UNVERIFIED" in p["subject_identification"]
            assert p["sha256"]==hashlib.sha256((folder/p["filename"]).read_bytes()).hexdigest()
          print("Verified authentic manuscript pixels; syrup-page identification still pending.")
          PY
      - name: Commit cited manuscript to separate archive without changing existing films
        run: |
          git config user.name "Ruwaidix Primary Source Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/source-manuscripts/wellcome-ms-arabic-1002/
          if ! git diff --cached --quiet; then
            git commit -m "Stage Wellcome MS Arabic 1002 actual scanned folios for human location review"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              git push origin HEAD:"${{ github.ref_name }}"
            else
              git rebase --abort
              echo "Do not risk overriding existing genuine source folios."
              exit 1
            fi
          fi
