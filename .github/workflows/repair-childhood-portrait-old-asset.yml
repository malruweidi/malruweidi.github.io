name: Fix existing childhood image asset (one time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-childhood-portrait-old-asset.yml
permissions:
  contents: write
jobs:
  fix-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace old photo bytes with cutout (retain original path)
        run: |
          set -euo pipefail
          python3 -m venv /tmp/portrait-fix
          /tmp/portrait-fix/bin/python -m pip -q install pillow
          /tmp/portrait-fix/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          source=Path('assets/personal-archive/suspenders-transparent.png')
          data=source.read_bytes()
          expected='db08c81fe2882159d653d5bf59bec46669bcbf9cce714805021a65c17367e1d1'
          digest=hashlib.sha256(data).hexdigest()
          assert digest==expected, f'Unexpected source image digest {digest}'
          image=Image.open(source).convert('RGBA')
          assert image.getpixel((0,0))[3]==0, 'The source cutout has no transparent background'
          target=Path('assets/personal-archive/suspenders.webp')
          image.save(target,'WEBP',quality=91,method=6,exact=True)
          check=Image.open(target).convert('RGBA')
          assert check.getpixel((0,0))[3]==0, 'WebP export lost transparency'
          assert check.size==image.size
          print('Verified transparent replacement at the old URL:',target,check.size)
          PY
          git rm .github/workflows/repair-childhood-portrait-old-asset.yml
          git add assets/personal-archive/suspenders.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace stale Scene 01 WebP with actual transparent portrait cutout"
          git pull --rebase origin main
          git push origin HEAD:main
