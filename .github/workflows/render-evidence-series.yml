name: Render Ruwaidix four research films
on:
  push:
    branches:
      - four-documentaries-20261016
    paths:
      - assets/films/evidence-in-motion.json
      - scripts/render-evidence-series.py
      - .github/workflows/render-evidence-series.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-series-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[series-output]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout whole existing archive
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source production tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy soundfile kokoro-onnx
      - name: Validate full film provenance, screenplay, pages, and existing content
        run: |
          node --test tests/evidence-films.test.cjs tests/research-film.test.cjs tests/film-cinematic-v2.test.cjs
          python -m py_compile scripts/render-evidence-series.py scripts/render-documentary.py
          python scripts/render-evidence-series.py --validate-only
      - name: Download open-source local British voice model
        run: |
          mkdir -p film-models
          curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
          test "$(stat -c%s film-models/voices-v1.0.bin)" -gt 1000000
      - name: Render four 120-second films, voice, posters, source plates, and captions
        run: python scripts/render-evidence-series.py --workspace film-models
      - name: Validate every output file, runtime, and source plate
        run: |
          python - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          root=Path("assets/films")
          data=json.loads((root/"evidence-in-motion.json").read_text())
          for f in data["films"]:
              slug=f["slug"]
              stem=f.get("media_stem",slug)
              video=root/(stem+".mp4")
              info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","json",str(video)]))
              duration=float(info["format"]["duration"])
              assert abs(duration-120)<.16,(slug,duration)
              assert (root/(slug+"-poster.webp")).is_file()
              assert (root/(stem+".vtt")).read_text().startswith("WEBVTT")
              assert all((root/"plates"/(slug+"-"+s["id"]+".webp")).is_file() for s in f["scenes"])
              manifest=json.loads((root/(slug+"-build.json")).read_text())
              assert manifest["sha256"]==hashlib.sha256(video.read_bytes()).hexdigest()
              print(slug,round(duration,2),video.stat().st_size,flush=True)
          PY
      - name: Commit ONLY newly rendered source-grounded film artifacts
        run: |
          git config user.name "Ruwaidix Documentary Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/plates/ assets/films/*-poster.webp
          git add assets/films/what-a-bubble-can-do.mp4 assets/films/what-a-bubble-can-do.vtt assets/films/what-a-bubble-can-do-build.json
          git add assets/films/two-materials-no-section-evidence-cut.mp4 assets/films/two-materials-no-section-evidence-cut.vtt assets/films/two-materials-no-section-build.json
          git add assets/films/the-laboratory-we-carried-with-us.mp4 assets/films/the-laboratory-we-carried-with-us.vtt assets/films/the-laboratory-we-carried-with-us-build.json
          git add assets/films/making-medicines-keep.mp4 assets/films/making-medicines-keep.vtt assets/films/making-medicines-keep-build.json
          if ! git diff --cached --quiet; then
            git commit -m "Render four evidence-based two-minute documentaries [series-output]"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
