name: Render Ruwaidix publication documentaries
on:
  push:
    branches:
      - publication-documentaries-20261016
      - main
    paths:
      - assets/films/publication-series.json
      - scripts/render-publication-series.py
      - .github/workflows/render-publication-series.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-publication-series-${{ github.ref }}
  cancel-in-progress: false
jobs:
  documentary-series:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[series-output]')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Preserve full website and check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source documentary engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy soundfile kokoro-onnx cairosvg
      - name: Check scene provenance and scientific source boundaries
        run: |
          python -m py_compile scripts/render-documentary.py scripts/render-publication-series.py
          python scripts/render-publication-series.py --validate-only
      - name: Download public open-source Kokoro narrator models
        run: |
          mkdir -p film-models
          curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
          test "$(stat -c%s film-models/voices-v1.0.bin)" -gt 1000000
      - name: Render factual scientific documentary chapters
        run: python scripts/render-publication-series.py --models film-models
      - name: Check MP4 streams, subtitles and publication references
        run: |
          python scripts/render-publication-series.py --validate-only
          for file in assets/films/series/*.mp4; do
            test -s "$file"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$file" | grep -q h264
            test -s "${file%.mp4}.vtt"
          done
      - name: Commit only new renders and associated evidence manifests
        run: |
          git config user.name "Ruwaidix Film Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series/*.mp4 assets/films/series/*.vtt assets/films/series/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Render five source-grounded scientific films [series-output]"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
