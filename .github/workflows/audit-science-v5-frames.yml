name: Cinematic V5 source-hashed all-frame review
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/audit-science-v5-frames.py
      - .github/workflows/audit-science-v5-frames.yml
      - assets/films/series-v5/*.mp4
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ruwaidix-v5-science-frame-review
  cancel-in-progress: false
jobs:
  review-encoded-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - name: Create unbiased 16-shot contact sheet from every encoded movie
        run: python scripts/audit-science-v5-frames.py
      - name: Retain all original frames and SHA-bound review index
        run: |
          git config user.name "Ruwaidix V5 Film Source QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v5/qa/
          if ! git diff --cached --quiet; then
            git commit -m "Index all exact primary-source V5 film camera frames by MP4 hash"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              git push origin HEAD:"${{ github.ref_name }}"
            else
              git rebase --abort
              git reset --hard "origin/${{ github.ref_name }}"
              echo "Competing QA review update; preserve the authoritative exact MP4 frames."
            fi
          fi
