name: Reconcile all four source-timed feature documentaries
on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - .github/workflows/recover-feature-cuts-v2.yml
      - assets/films/cinematic-library-v2.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-recovery-current-features
  cancel-in-progress: true
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FFmpeg and open-source CPU documentary tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx cairosvg
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-voice-audition-kokoro-20261017
      - name: Retrieve open-source model files when not cached
        run: |
          mkdir -p film-models
          test -s film-models/kokoro-v1.0.fp16.onnx || curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          test -s film-models/voices-v1.0.bin || curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Verify revised feature timing before running resource-intensive syntheses
        run: |
          python - <<'PY'
          import json
          d=json.load(open('assets/films/cinematic-library-v2.json'))
          wanted=['feature-what-survives-the-experiment','feature-ring-that-never-closed','feature-airway-reopening-evidence-cut','feature-two-materials-no-section-evidence-cut']
          for slug in wanted:
              f=next(x for x in d['films'] if x['slug']==slug)
              total=sum(x['sec'] for x in f['shots'])
              assert total<=168,(slug,total)
              print('Recovery screenplay:',slug,total,'seconds')
          PY
      - name: Render and inspect all outstanding films from authoritative storyboards
        shell: bash
        run: |
          set -euo pipefail
          for film in feature-what-survives-the-experiment feature-ring-that-never-closed feature-airway-reopening-evidence-cut feature-two-materials-no-section-evidence-cut; do
            echo "Feature recovery: $film"
            python scripts/render-cinematic-library.py --film "$film" --limit 1 --voice-mode kokoro-preview --models film-models
            test -s "assets/films/library-v2/$film-rough-cut.mp4"
            test -s "assets/films/library-v2/$film-rough-cut.vtt"
            test -s "assets/films/library-v2/$film-rough-cut.json"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "assets/films/library-v2/$film-rough-cut.mp4"
          done
      - name: Commit only protected rough-cut files, never public site videos
        run: |
          git config user.name "Ruwaidix Film Recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/films/library-v2/
          if ! git diff --cached --quiet; then
            git commit -m "Recover source-faithful feature films with uncut narration [v2-output]"
            for n in 1 2 3 4 5 6 7 8; do
              git fetch origin cinematic-remake-20261017
              git rebase FETCH_HEAD
              if git push origin HEAD:cinematic-remake-20261017; then exit 0; fi
              sleep 4
            done
            exit 1
          fi
