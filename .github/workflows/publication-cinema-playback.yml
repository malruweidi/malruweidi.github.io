name: Publication Cinema playback integrity
on:
  push:
    branches: [main]
    paths:
      - publication-cinema.html
      - films.html
      - films/making-medicines-keep.html
      - assets/films/publication-series.json
      - assets/films/series-v6/releases.json
      - assets/films/series-v7-pilots/releases.json
      - assets/films/series-v7-pilots/*.mp4
      - assets/films/series-v7-pilots/*.vtt
      - tests/publication-v7-public-release.test.cjs
      - tests/publication-v6-poster.test.cjs
      - tests/all-cinema-release.test.cjs
      - tests/cinema-science-provenance.test.cjs
      - tests/cinema-corrected-documentaries.test.cjs
      - films/what-a-bubble-can-do.html
      - films/two-materials-no-section.html
      - assets/films/evidence-in-motion.json
      - scripts/render-evidence-series.py
      - tests/cinema-quality-screening.test.cjs
      - cinema-quality-preview.html
      - .github/workflows/publication-cinema-playback.yml
  pull_request:
    paths:
      - publication-cinema.html
      - films.html
      - films/making-medicines-keep.html
      - assets/films/publication-series.json
      - assets/films/series-v6/releases.json
      - assets/films/series-v7-pilots/releases.json
      - assets/films/series-v7-pilots/*.mp4
      - assets/films/series-v7-pilots/*.vtt
      - tests/publication-v7-public-release.test.cjs
      - tests/publication-v6-poster.test.cjs
      - tests/all-cinema-release.test.cjs
      - tests/cinema-science-provenance.test.cjs
      - tests/cinema-corrected-documentaries.test.cjs
      - films/what-a-bubble-can-do.html
      - films/two-materials-no-section.html
      - assets/films/evidence-in-motion.json
      - scripts/render-evidence-series.py
      - tests/cinema-quality-screening.test.cjs
      - cinema-quality-preview.html
      - .github/workflows/publication-cinema-playback.yml
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 35 film sources, captions, posters, preserved versions, and release index
        run: node --test tests/publication-v6-poster.test.cjs tests/all-cinema-release.test.cjs tests/cinema-quality-screening.test.cjs tests/cinema-science-provenance.test.cjs tests/cinema-corrected-documentaries.test.cjs tests/publication-v7-public-release.test.cjs
      - name: Check inline catalogue player JavaScript
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('publication-cinema.html','utf8');
          const tags=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          let checked=0;
          for(const [,script] of tags){ if(script.trim()){new vm.Script(script);checked++;} }
          if(!checked)throw Error('No inline film-player script was found');
          console.log('Checked',checked,'film page script blocks');
          JS
