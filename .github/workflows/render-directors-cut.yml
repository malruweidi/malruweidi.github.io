name: Build source-credited pharmacy director's cut
on:
  push:
    branches:
      - film-directors-cut-20261017
    paths:
      - .github/workflows/render-directors-cut.yml
      - scripts/render-directors-cut.py
      - assets/films/director-cuts/making-medicines-keep.json
      - tests/directors-cut.test.cjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[directors-cut-output]')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout full existing site and archive, leaving originals untouched
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent open-source film production packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy soundfile kokoro-onnx
      - name: Check source rights, visual variation and storyboard
        run: |
          node --test tests/directors-cut.test.cjs
          python -m py_compile scripts/render-directors-cut.py
          python scripts/render-directors-cut.py --validate-only
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Fetch local open source narrator models
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl -fLSs --retry 3 -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl -fLSs --retry 3 -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
          test "$(stat -c%s film-models/voices-v1.0.bin)" -gt 1000000
      - name: Produce 120-second 16-shot MP4, audio and subtitles
        run: python scripts/render-directors-cut.py --models film-models --voice bm_lewis
      - name: Verify media and research provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess,hashlib
          s=Path("assets/films/director-cuts/making-medicines-keep-directors-cut-bm-lewis")
          v=Path(str(s)+".mp4")
          c=Path(str(s)+".vtt")
          j=Path(str(s)+".json")
          for p in (v,c,j): assert p.is_file() and p.stat().st_size>300,str(p)
          record=json.loads(j.read_text())
          assert len(record["shots"])==16
          assert hashlib.sha256(v.read_bytes()).hexdigest()==record["sha256"]
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","json",str(v)]))
          assert abs(float(info["format"]["duration"])-120)<.3
          print("Verified",record["seconds"],"seconds",len(record["shots"]),"credited shots")
          PY
      - name: Publish preview files on this isolated review branch only
        run: |
          git config user.name "Ruwaidix Film Preview Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/director-cuts/*.mp4 assets/films/director-cuts/*.vtt assets/films/director-cuts/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Add first source-credited director's cut preview [directors-cut-output]"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
