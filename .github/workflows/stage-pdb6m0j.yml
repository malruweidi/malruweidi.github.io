name: Stage real ACE2–spike RBD atomic structure 6M0J
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/stage-pdb6m0j.py
      - .github/workflows/stage-pdb6m0j.yml
  workflow_dispatch:
permissions: {contents: write}
jobs:
  verify-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/stage-pdb6m0j.py
      - name: Commit unchanged original PDB and cited chain metadata
        run: |
          git config user.name "Ruwaidix Molecular Evidence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/source-structures/pdb-6m0j/
          if ! git diff --cached --quiet; then
            git commit -m "Stage verified 6M0J experimental ACE2–SARS-CoV-2 RBD structure"
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then git push origin HEAD:"${{ github.ref_name }}"; else git rebase --abort; exit 1; fi
          fi
