name: Audit real source-specific cyanide and failed histology documentary frames
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/audit-owner-study-films-v3.py
      - .github/workflows/audit-owner-study-films-v3.yml
      - assets/films/series-v3/curcumin-cyanide.mp4
      - assets/films/series-v3/histology-failure.mp4
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ruwaidix-actual-scientific-film-review
  cancel-in-progress: false
jobs:
  inspect-source-specific-film:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install decode and composition stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow
      - name: Inspect archival image SHA and actual encoded footage
        run: python scripts/audit-owner-study-films-v3.py
      - name: Publish source-stamped review sheets
        run: |
          git config user.name "Ruwaidix Film QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v3/qa/curcumin-cyanide-contact.* assets/films/series-v3/qa/histology-failure-contact.*
          if ! git diff --cached --quiet; then
            git commit -m "Stage full 16-frame audiovisual inspection of owner-study cinema"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
