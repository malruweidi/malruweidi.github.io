name: Flow chamber V3 — source-verified experiment documentary
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - scripts/render-flow-chamber-v3.py
      - .github/workflows/render-flow-chamber-v3.yml
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: ruwaidix-flow-chamber-v3
  cancel-in-progress: false
jobs:
  method-film:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build locally with public video, graphics and narration engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-flow-chamber-v3.py
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Fetch openly distributed Kokoro voice engine models
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Render original verified experimental-flow-chamber film
        run: python scripts/render-flow-chamber-v3.py
      - name: Verify correct source figures and preserve original film
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          m=Path("assets/films/series-v3/flow-chamber-method.mp4")
          j=json.loads(m.with_suffix(".json").read_text())
          assert j["primary_doi"]=="10.3390/mps3040065"
          assert {p["figure_number"] for p in j["source_figures"]}=={1,5,6}
          assert len(j["chapters"])==8
          assert abs(j["duration_seconds"]-120)<.4
          assert hashlib.sha256(m.read_bytes()).hexdigest()==j["sha256"]
          assert m.with_suffix(".vtt").read_text().startswith("WEBVTT")
          assert Path("assets/films/series/flow-chamber-method.mp4").exists()
          print("Original figures for this chamber only, technical master valid")
          PY
      - name: Commit V3 as alternative without overwriting public V1
        run: |
          git config user.name "Ruwaidix Science Cinema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v3/flow-chamber-method.*
          if ! git diff --cached --quiet; then
            git commit -m "Render exact 2020 flow chamber Figure 1/5/6 documentary"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
