name: Film cinema source and export reconciliation
on:
  push:
    branches:
      - cinematic-remake-20261017
    paths:
      - scripts/audit-cinematic-completion.py
      - .github/workflows/audit-cinematic-completion.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-cinema-final-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local dependencies
        run: python -m pip install pillow numpy soundfile cairosvg
      - name: Audit current source digest and unfinished outputs
        run: python scripts/audit-cinematic-completion.py
      - name: Publish non-approval report with concurrency retry
        run: |
          git config user.name "Ruwaidix Audit Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/visual-audit-v2/completion-ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Record film source-digest and export completion status [cinema-audit]"
            success=false
            for i in 1 2 3 4 5 6 7 8; do
              git fetch origin cinematic-remake-20261017
              git rebase FETCH_HEAD
              if git push origin HEAD:cinematic-remake-20261017; then success=true; break; fi
              sleep "$((i * 2))"
            done
            test "$success" = true
          fi
