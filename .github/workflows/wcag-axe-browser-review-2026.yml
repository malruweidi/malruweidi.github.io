name: WCAG automated accessibility review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  axe-wcag:
    name: Render pages and inspect WCAG 2.2 A/AA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Verify issue policy and coverage without a browser
        run: node --test tests/accessibility-audit-2026.test.cjs
      - name: Install pinned free browser driver and accessibility audit engine
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1 axe-core@4.10.3
      - name: Locate runner Chrome
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "A real Chrome installation is required"
            exit 1
          fi
      - name: Serve immutable checked-in site via localhost
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ruwaidix-wcag-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --silent --fail --head http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ruwaidix-wcag-http.log
          exit 1
      - name: Inventory real browser accessibility issues with evidence
        env:
          SITE_BASE_URL: http://127.0.0.1:8765
          ACCESSIBILITY_QA_OUTPUT: accessibility-qa-artifacts
          ACCESSIBILITY_QA_MODE: inventory
        run: node scripts/accessibility-audit-2026.cjs
      - name: Preserve redacted findings and exact failing selectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruwaidix-wcag-issues-${{ github.run_id }}
          path: accessibility-qa-artifacts/
          if-no-files-found: warn
          retention-days: 21
