name: Website integrity audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check links, media, JavaScript and scientific attribution
        run: node scripts/site-integrity.cjs
      - name: Verify restored archival binary bytes and photo/video provenance
        run: node --test tests/owner-media-restoration.test.cjs
      - name: Verify film sources, captions and non-destructive discovery
        run: node --test tests/moving-evidence.test.cjs
      - name: Verify filmed research provenance, media checksum and bilingual transcript
        run: node --test tests/film-publication.test.cjs
      - name: Check scientific film collection, in-development statuses and archival source preservation
        run: node --test tests/documentary-collection.test.cjs
      - name: Verify second released film video hash, exact running time, subtitles and scientific source integrity
        run: node --test tests/two-materials-production.test.cjs
      - name: Verify Cairo microscope film provenance, exact 120-second render, bilingual subtitles and preservation
        run: node --test tests/cairo-microscope-film.test.cjs
      - name: Verify evidence figure preservation and expandable interpretation notes
        run: node --test tests/evidence-viewer.test.cjs
      - name: Validate four new documentary films and their documented eight-chapter source pages
        run: node --test tests/evidence-films.test.cjs
      - name: Verify 180-second pulmonary evidence cut, published data and source preservation
        run: node --test tests/airway-evidence-cut.test.cjs
      - name: Verify distinct Chem Squad and leadership destinations
        run: node --test tests/chem-squad-leadership-navigation.test.mjs
      - name: Verify restored archival wayfinding without expanding the homepage
        run: node --test tests/behind-the-record-preservation.test.cjs
      - name: Verify Major Revisions book, cover and clear site navigation
        run: node --test tests/major-revisions-navigation.test.cjs
      - name: Verify compact chapter-led homepage and preserved full record
        run: node --test tests/homepage-chapter-navigation.test.mjs
      - name: Check editorial wayfinding and chapter preservation
        run: node --test tests/editorial-wayfinding.test.mjs
      - name: Test accessible mobile Explore and bilingual page context
        run: node --test tests/responsive-wayfinding-2026.test.cjs
      - name: Verify new reading, screen and training pages are discoverable
        run: node --test tests/public-discovery-coverage-2026.test.cjs
      - name: Guard stable keyboard focus, Arabic search categories and font loading
        run: node --test tests/search-focus-and-font-loading.test.cjs
      - name: Verify first-class search access from research hubs
        run: node --test tests/research-discovery-entrypoints.test.cjs
      - name: Re-audit editorial prose and preserved scientific provenance
        run: node --test tests/editorial-voice.test.mjs
      - name: Guard public captions, film links and story translations
        run: node --test tests/public-copy-boundary.test.mjs
      - name: Test lossless standalone stories and research dossiers
        run: node --test tests/deep-reading.test.mjs
      - name: Validate UREP23 research story, preserved chapters and bilingual discovery
        run: node --test tests/urep23-story.test.mjs
      - name: Verify chemistry documentary source limits, original archive and SHA256 MP4 integrity
        run: node --test tests/ring-that-never-closed-film.test.cjs
      - name: Check all cross-page fragment destinations
        run: node scripts/check-cross-page-anchors.cjs
      - name: Test research readout hierarchy and responsive language support
        run: node --test tests/research-reading-qa.test.mjs
      - name: Verify consolidated research directions and preserved long-form essay
        run: node --test tests/research-directions-unification.test.mjs
      - name: Validate source-verified Substack publication collection
        run: node --test tests/substack-publications.test.mjs
      - name: Test Substack public-feed comparison and writing routes
        run: node --test tests/substack-feed-verify.test.mjs
      - name: Guard against missing teacher photographs, inaccessible illness stories and mistaken school chronology
        run: node --test tests/early-science-and-story-discoverability.test.mjs
      - name: Verify archive dating and source-linked film social previews
        run: node --test tests/second-pass-publication-discovery.test.mjs
      - name: Check film viewer playback and reader-facing screening links
        run: node --test tests/third-pass-film-reader-experience.test.mjs
      - name: Check public film collection language against playable destinations
        run: node --test tests/fourth-pass-film-navigation.test.mjs
      - name: Check research status and source-linked film reading paths
        run: node --test tests/film-evidence-threads-2026.test.cjs
      - name: Verify reproducible source-level photographic and video placement inventory
        run: node --test tests/media-placement-inventory.test.cjs
      - name: Guard original story photographs and source-context routes
        run: node --test tests/story-archive-photographic-context.test.cjs
      - name: Check user-controlled motion for homepage research figures
        run: node --test tests/home-gallery-motion.test.cjs
      - name: Confirm photographed Stories routes and original archive image access
        run: node --test tests/stories-archive-visual-continuity-2026.test.cjs
      - name: Check scientific figures and distinguish image attribution from published research
        run: node --test tests/scientific-figure-source-boundaries-2026.test.cjs
