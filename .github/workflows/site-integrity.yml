name: Website integrity audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check links, media, JavaScript and scientific attribution
        run: node scripts/site-integrity.cjs
      - name: Verify film sources, captions and non-destructive discovery
        run: node --test tests/moving-evidence.test.cjs
      - name: Verify filmed research provenance, media checksum and bilingual transcript
        run: node --test tests/film-publication.test.cjs
      - name: Check scientific film collection, in-development statuses and archival source preservation
        run: node --test tests/documentary-collection.test.cjs
      - name: Verify evidence figure preservation and expandable interpretation notes
        run: node --test tests/evidence-viewer.test.cjs
      - name: Check editorial wayfinding and chapter preservation
        run: node --test tests/editorial-wayfinding.test.mjs
      - name: Test lossless standalone stories and research dossiers
        run: node --test tests/deep-reading.test.mjs
      - name: Validate UREP23 research story, preserved chapters and bilingual discovery
        run: node --test tests/urep23-story.test.mjs
      - name: Check all cross-page fragment destinations
        run: node scripts/check-cross-page-anchors.cjs
      - name: Test research readout hierarchy and responsive language support
        run: node --test tests/research-reading-qa.test.mjs
      - name: Validate source-verified Substack publication collection
        run: node --test tests/substack-publications.test.mjs
      - name: Test Substack public-feed comparison and writing routes
        run: node --test tests/substack-feed-verify.test.mjs
