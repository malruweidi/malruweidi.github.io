name: Film 11 | Moving zebrafish microscopy

on:
  push:
    branches:
      - cinema/zebrafish-v19-highspeed-observation
    paths:
      - assets/films/series-v19-zebrafish/film.html
      - scripts/render-zebrafish-v19.py
      - tests/zebrafish-v19.test.py
      - .github/workflows/render-zebrafish-v19.yml

permissions:
  contents: write

concurrency:
  group: single-film11-flow-v18-${{ github.ref }}
  cancel-in-progress: false

jobs:
  film11-review-cut:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out original 2020 zebrafish methods figure and preserved 84s narration
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible no-cost Chromium FFmpeg rendering stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check pillow playwright numpy soundfile
          python -m playwright install --with-deps chromium
      - name: Validate source image identity and 6 moving reproducible chapters
        run: |
          python -m py_compile scripts/render-zebrafish-v19.py tests/zebrafish-v19.test.py
          python scripts/render-zebrafish-v19.py --validate-only
          python tests/zebrafish-v19.test.py
      - name: Render full 84-second film at native 1920x1080 24fps
        run: python -u scripts/render-zebrafish-v19.py
      - name: Independent check of source claims, encoded motion, captions and loudness
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess,re
          root=Path("assets/films/series-v19-zebrafish")
          master=root/"zebrafish-hemodynamics.mp4"
          data=json.loads((root/"zebrafish-hemodynamics.json").read_text())
          assert data["film_index"]==11 and data["paper"]["doi"]=="10.1016/j.micron.2020.102876"
          assert data["published_method"]["recording_seconds"]==10
          assert data["published_method"]["analysis_software"]==["MicroZebraLab","ImageJ"]
          assert "permission" in data["paper"]["rights"]
          assert data["live_website_unchanged"] and data["older_film_masters_preserved"]
          assert hashlib.sha256(master.read_bytes()).hexdigest()==data["sha256"]
          for src in [data["paper_figure"],*data["archival_context_images"]]:
            assert hashlib.sha256(Path(src["path"]).read_bytes()).hexdigest()==src["sha256"]
          assert (root/"zebrafish-hemodynamics.vtt").read_text().count("-->")==12
          assert (root/"zebrafish-hemodynamics.contact.webp").stat().st_size>14000
          assert (root/"zebrafish-hemodynamics.webp").stat().st_size>5000
          assert len(list(root.glob("chapter-??.jpg")))==6
          frames=subprocess.check_output(["ffmpeg","-v","error","-i",str(master),
            "-map","0:v:0","-an","-vf","fps=1","-f","framemd5","-"],text=True)
          hashes=[q.rsplit(",",1)[-1].strip() for q in frames.splitlines() if q and not q.startswith("#")]
          assert 83<=len(hashes)<=85,len(hashes)
          assert len(set(hashes))>=80,(len(set(hashes)),len(hashes))
          print("FILM11 VERIFIED VIDEO-ONLY TEMPORAL FRAMES",len(set(hashes)),"/",len(hashes))
          audio=subprocess.run(["ffmpeg","-hide_banner","-i",str(master),
            "-map","0:a:0","-filter_complex","ebur128=peak=true","-f","null","-"],
            capture_output=True,text=True)
          assert audio.returncode==0
          import re
          samples=[float(x) for x in re.findall(r"TPK:\s*([-+]?\d+(?:\.\d+)?)\s*dBFS",audio.stderr)]
          assert samples, "True-peak samples missing from EBU R128 measurement"
          worst=max(samples)
          assert worst <= -1.0, f"True peak over mastering ceiling: {worst:.1f} dBTP"
          print("FILM11 VERIFIED TRUE PEAK",worst,"dBTP")
          print("FILM11 EBU R128",audio.stderr[-1500:])
          PY
      - name: Commit verified review master to isolated branch and retain all existing films
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ruwaidix Research Cinema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          render_source_hash="$(git hash-object scripts/render-zebrafish-v19.py)"
          mkdir -p /tmp/flow-v18-output
          cp -a assets/films/series-v19-zebrafish/. /tmp/flow-v18-output/
          git fetch origin cinema/zebrafish-v19-highspeed-observation
          current_hash="$(git show origin/cinema/zebrafish-v19-highspeed-observation:scripts/render-zebrafish-v19.py | git hash-object --stdin)"
          if [ "$render_source_hash" != "$current_hash" ]; then
            echo "Newer source renderer exists; do not push a stale binary"; exit 0
          fi
          git reset --hard origin/cinema/zebrafish-v19-highspeed-observation
          cp -a /tmp/flow-v18-output/. assets/films/series-v19-zebrafish/
          git add assets/films/series-v19-zebrafish/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Film 10: reproduce the airway-reopening flow chamber in native 1080p cinematic motion"
          git push origin HEAD:cinema/zebrafish-v19-highspeed-observation
