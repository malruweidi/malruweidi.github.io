name: Film 04 curcumin - free Kokoro narration audition
on:
  push:
    branches: [film04-curcumin-voice-review-20261022]
    paths: ['.github/workflows/film04-kokoro-voice.yml']
permissions:
  contents: read
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install completely free model runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install -q 'kokoro-onnx>=0.4,<1' 'numpy>=1.25,<3' 'soundfile>=0.12'
      - name: Fetch open speech weights
        run: |
          mkdir -p model
          curl -fLsS --retry 3 -o model/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -fLsS --retry 3 -o model/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s model/kokoro-v1.0.fp16.onnx)" -gt 90000000
      - name: Generate 12 full-length narrated passages with no cuts
        run: |
          python - <<'PY'
          import numpy as np,soundfile as sf,json
          from pathlib import Path
          from kokoro_onnx import Kokoro
          scripts=["Colour can reveal a molecular interaction. In this study, the familiar yellow pigment curcumin became a probe for cyanide.","The signal begins in a solution of acetonitrile and water. Add cyanide, and the yellow sample changes colour.","The published spectra show the absorption band near four hundred twenty-one nanometres giving way to a band at five hundred twenty.","Those two peaks are measurements, not decoration. The new colour is evidence that the electronic absorption has changed.","Several other tested anions barely shifted the signal. Hydroxide was an important exception, so selectivity has experimental limits.","The authors reported a detection limit of two point three micromolar in their chosen laboratory conditions. That is not a clinical threshold.","Under ultraviolet excitation, curcumin emits green fluorescence. Cyanide quenches that emission near five hundred twenty nanometres.","The paper also examined how the probe responded at different cyanide concentrations. Each point belongs to the actual calibration experiment.","Then the experiment moved into living cultured cells. Fluorescence microscopy showed that the dye entered the cells and was visible.","After cyanide exposure, the cellular fluorescent signal declined over time. The microscope images show that change directly.","The proposed molecular explanation involves deprotonation and altered conjugation. The evidence is strongest for the observed optical response.","A molecule can answer a carefully framed question, but the conditions matter. Curcumin offered a laboratory readout, not a universal detector."]
          model=Kokoro('model/kokoro-v1.0.fp16.onnx','model/voices-v1.0.bin')
          samples=None;sr=None;events=[]
          for i,script in enumerate(scripts):
            for speed in (1.05,1.10,1.15,1.20,1.25):
              audio,rate=model.create(script,voice='af_bella',speed=speed,lang='en-us')
              audio=np.asarray(audio,dtype=np.float32).ravel()
              if len(audio)/rate<=9.65:break
            if len(audio)/rate>9.65: raise RuntimeError('Scene '+str(i+1)+' narration exceeds scene')
            if sr is None:sr=rate;samples=np.zeros(120*rate,dtype=np.float32)
            assert rate==sr
            start=i*10+.15;offset=round(sr*start)
            samples[offset:offset+len(audio)]+=audio
            sf.write(f'scene-{i+1:02}.wav',audio,sr,subtype='PCM_16')
            events.append(dict(shot=i+1,start=start,end=start+len(audio)/sr,text=script,speed=speed))
            print(i+1,round(len(audio)/sr,2),speed,flush=True)
          mx=float(np.max(np.abs(samples)));assert mx>.01
          sf.write('Film_04_Curcumin_Kokoro.wav',samples*.8/mx,sr,subtype='PCM_16')
          Path('Film_04_Timings.json').write_text(json.dumps({'engine':'Kokoro ONNX af_bella','events':events,'release':'voice audition pending'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: film04-curcumin-narration-audition
          path: |
            Film_04_Curcumin_Kokoro.wav
            Film_04_Timings.json
            scene-*.wav
          retention-days: 7