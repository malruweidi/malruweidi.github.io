name: ACE2 2022 clinical observational film V4
on:
  push:
    branches: [film-remake-20261017]
    paths:
      - assets/films/source-figures/v3/ace2-covid-drugs-figure-crops.json
      - scripts/render-study-figures-v4.py
      - .github/workflows/render-ace2-clinical-v4.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-v4-ace2-observational
  cancel-in-progress: false
jobs:
  figure-led-cohort-cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
          python -m py_compile scripts/render-study-figures-v4.py
      - name: Verify authentic source license, source PDF, exact crop integrity and biomedical limits
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          c=json.loads(Path("assets/films/source-figures/v3/ace2-covid-drugs-figure-crops.json").read_text())
          s=json.loads(Path("assets/films/source-figures/ace2-covid-drugs-2022/source-manifest.json").read_text())
          assert s["doi"]==c["doi"]=="10.1080/08037051.2022.2055530"
          assert s["license"]["name"]=="CC BY 4.0"
          assert s["study_type"].startswith("Observational")
          assert len(c["figures"])==3
          for item in c["figures"]:
            assert hashlib.sha256(Path(item["image_path"]).read_bytes()).hexdigest()==item["sha256"]
            assert hashlib.sha256(Path(item["source_page"]).read_bytes()).hexdigest()==item["source_page_sha256"]
          print("All original clinical cohort images source-hash verified")
          PY
      - uses: actions/cache@v4
        with:
          path: film-models
          key: ruwaidix-kokoro-onnx-fp16-v1.1
      - name: Load open narrator weights
        run: |
          mkdir -p film-models
          if [ ! -s film-models/kokoro-v1.0.fp16.onnx ]; then curl --fail --location --retry 3 -sS -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx; fi
          if [ ! -s film-models/voices-v1.0.bin ]; then curl --fail --location --retry 3 -sS -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin; fi
      - name: Render only this observational study's original Figure 1-3 data
        run: python scripts/render-study-figures-v4.py --film ace2-covid-drugs
      - name: Check original study match, human-review disclaimer and 120-sec H264
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          p=Path("assets/films/series-v4/ace2-covid-drugs.mp4")
          m=json.loads(p.with_suffix(".json").read_text())
          assert m["doi"]=="10.1080/08037051.2022.2055530"
          assert m["sha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          assert "NOT APPROVED" in m["human_review"]
          assert len(m["chapters"])==8 and abs(m["duration_seconds"]-120)<.3
          assert {"h264","aac"}<={s["codec_name"] for s in json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-of","json",str(p)]))["streams"]}
          assert p.with_suffix(".vtt").read_text().startswith("WEBVTT")
          PY
      - name: Save V4 draft only; original V1 remains unchanged
        run: |
          git config user.name "Ruwaidix Source-First Cinema"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/series-v4/ace2-covid-drugs.*
          if ! git diff --cached --quiet; then
            git commit -m "Encode 2022 hypertensive COVID cohort with true Figure 1-3 plots, no clinical causal inference"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
