name: Render Two Materials documentary
on:
  push:
    branches: [main]
    paths:
      - assets/films/two-materials-scenes.json
      - scripts/render-two-materials-film.py
      - .github/workflows/render-two-materials.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ruwaidix-two-materials-${{ github.ref }}
  cancel-in-progress: false
jobs:
  film:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[histology-output]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Retrieve original science archive
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible open video stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow numpy soundfile kokoro-onnx
      - name: Validate experimental sources and scene timecodes
        run: |
          python -m py_compile scripts/render-two-materials-film.py
          python scripts/render-two-materials-film.py --validate-only
      - name: Download documented free Kokoro speech models
        run: |
          mkdir -p film-models
          curl --fail --location --retry 3 --silent --show-error -o film-models/kokoro-v1.0.fp16.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl --fail --location --retry 3 --silent --show-error -o film-models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s film-models/kokoro-v1.0.fp16.onnx)" -gt 90000000
          test "$(stat -c%s film-models/voices-v1.0.bin)" -gt 1000000
      - name: Produce 150-second documentary with English closed captions
        run: python scripts/render-two-materials-film.py --workspace film-models
      - name: Validate actual rendered film
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("assets/films/two-materials-no-section.mp4")
          j=json.loads(Path("assets/films/two-materials-build.json").read_text())
          assert p.stat().st_size>1_000_000, "Missing genuine media"
          assert p.open("rb").read(8)[4:8]==b"ftyp", "Not an MP4"
          assert hashlib.sha256(p.read_bytes()).hexdigest()==j["video_sha256"]
          assert abs(float(j["seconds"])-150)<0.2
          assert Path("assets/films/two-materials-no-section.vtt").read_text().startswith("WEBVTT")
          assert j["scene_count"]==10
          print("Validated MP4 size",p.stat().st_size,"sources",len(j["source_photo_sha256"]))
          PY
      - name: Publish only new documentary artifacts
        run: |
          git config user.name "Ruwaidix Documentary Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/films/two-materials-no-section.mp4 assets/films/two-materials-no-section.vtt assets/films/two-materials-build.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish source-grounded 150-second histology film [histology-output]"
            git fetch origin "${{ github.ref_name }}"
            git rebase FETCH_HEAD
            git push origin HEAD:${{ github.ref_name }}
          fi
